<style>
/* Layout: one fixed game screen (256x224 logical px) scaled by --u, touch pad below on coarse pointers */
:root{
  --ink:#0b0907;      /* charred wood around the screen */
  --win:#1c1712;      /* window fill: smoked leather */
  --line:#f1e7d3;     /* bone white text */
  --lamp:#f2b75a;     /* ember amber: cursor, highlights */
  --bronze:#b8925a;   /* forged bronze trim */
  --bronze2:#6e5232;
  --mist:#b3a58c;     /* weathered parchment: secondary text */
  --hp:#8fd65a; --mp:#5cc0ea; --bad:#ff6a4e; --gold:#ffd27a; --dim:#6e6252;
  --f-pix:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic",sans-serif;
  --f-head:"Shippori Mincho B1","Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif JP","Yu Mincho",serif;
  color-scheme:dark;
}
html,body{width:100%;height:100%;height:100dvh;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#2a2118 0%,#14100c 55%,var(--ink) 100%);color:var(--line);
  font-family:var(--f-pix);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#app{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;right:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px}
#screen{position:relative;width:calc(var(--u,2px)*256);height:calc(var(--u,2px)*224);overflow:hidden;background:#000;
  border-radius:calc(var(--u)*2);box-shadow:0 0 0 2px #4a3a26,0 0 0 4px #120e0a,0 18px 50px #000c;flex:none}
#screen.shake{animation:shake .32s steps(8) 1}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(calc(var(--u)*-3),calc(var(--u)*1))}40%{transform:translate(calc(var(--u)*3),calc(var(--u)*-1))}60%{transform:translate(calc(var(--u)*-2),0)}80%{transform:translate(calc(var(--u)*2),calc(var(--u)*1))}}
#cv,#gl{position:absolute;inset:0;width:100%;height:100%}
#cv{image-rendering:pixelated}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 75% 70% at 50% 50%,#0000 55%,#0008 100%)}
#ui{z-index:2} #flash{z-index:3} #fade{z-index:4}
#ui{position:absolute;inset:0;font-size:calc(var(--u)*9);line-height:1.45;letter-spacing:.02em}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}

/* windows */
.win{position:absolute;box-sizing:border-box;background:linear-gradient(#111b3b,#0b1229);border:calc(var(--u)*1.5) solid var(--line);
  border-radius:calc(var(--u)*3);box-shadow:inset 0 0 0 calc(var(--u)*1) #ffbf5a33,0 calc(var(--u)*1.5) 0 #0009;
  padding:calc(var(--u)*5) calc(var(--u)*7);color:var(--line);text-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 #000a}
.win.dimmed{filter:brightness(.62) saturate(.7)}
.win .ttl{position:absolute;top:calc(var(--u)*-6);left:calc(var(--u)*8);background:var(--win);padding:0 calc(var(--u)*3);
  font-size:calc(var(--u)*7.5);color:var(--lamp);line-height:1.4;border-radius:calc(var(--u)*1)}
.opt{position:relative;padding-left:calc(var(--u)*10);white-space:nowrap;cursor:pointer;min-height:calc(var(--u)*13);touch-action:manipulation}
.opt.empty-back{display:flex;flex-direction:column;justify-content:center;white-space:normal;min-height:calc(var(--u)*40);padding:calc(var(--u)*5);text-align:center;color:var(--mist);border:calc(var(--u)*.6) dashed var(--bronze2)}
.opt.empty-back small{display:block;margin-top:calc(var(--u)*3);font-size:max(12px,calc(var(--u)*6.5));color:var(--lamp)}
.opt.dis{color:var(--dim)}
.opt.sel::before{content:"";position:absolute;left:calc(var(--u)*1);top:calc(var(--u)*3.2);border-left:calc(var(--u)*5) solid var(--lamp);
  border-top:calc(var(--u)*3.5) solid transparent;border-bottom:calc(var(--u)*3.5) solid transparent;animation:blink .9s steps(2) infinite}
.win.inactive .opt.sel::before{animation:none;opacity:.6}
@keyframes blink{50%{opacity:.15}}
.opt .r{position:absolute;right:0;top:0;color:var(--mist)}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:calc(var(--u)*8)}
.more{position:absolute;right:calc(var(--u)*6);font-size:calc(var(--u)*6);color:var(--lamp);animation:blink 1s steps(2) infinite}
.more.up{top:calc(var(--u)*1)} .more.dn{bottom:calc(var(--u)*0)}

/* message */
.msg{left:calc(var(--u)*6);right:calc(var(--u)*6);bottom:calc(var(--u)*6);height:calc(var(--u)*62);font-size:calc(var(--u)*9.5);line-height:1.55;white-space:pre-wrap}
.msg.top{top:calc(var(--u)*6);bottom:auto}
.msg .nm{color:var(--lamp);display:block;font-size:calc(var(--u)*8);line-height:1.3;margin-bottom:calc(var(--u)*1)}
.msg.face{padding-left:calc(var(--u)*46)}
.msg .pf{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*7);width:calc(var(--u)*34);height:calc(var(--u)*34);image-rendering:pixelated;
  border-radius:calc(var(--u)*2);background:#1b2850;box-shadow:inset 0 0 0 calc(var(--u)*1) #ffbf5a55}
.msg .nx{position:absolute;right:calc(var(--u)*8);bottom:calc(var(--u)*3);width:0;height:0;border-left:calc(var(--u)*3.5) solid transparent;
  border-right:calc(var(--u)*3.5) solid transparent;border-top:calc(var(--u)*4.5) solid var(--lamp);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(calc(var(--u)*1.5))}}
.hl{color:var(--lamp)} .hb{color:var(--mp)} .hr{color:var(--bad)} .hg{color:var(--hp)}

/* banner (place names, notices) */
.banner{position:absolute;left:50%;top:calc(var(--u)*18);transform:translateX(-50%);padding:calc(var(--u)*3) calc(var(--u)*14);
  font-size:calc(var(--u)*9);white-space:nowrap;background:linear-gradient(90deg,#0000,#0b1229e6 18%,#0b1229e6 82%,#0000);
  border-top:calc(var(--u)*.8) solid #ffbf5a88;border-bottom:calc(var(--u)*.8) solid #ffbf5a88;transition:opacity .5s}

/* status bits */
.bar{height:calc(var(--u)*2.5);background:#000a;border-radius:calc(var(--u)*1);overflow:hidden;margin-top:calc(var(--u)*.5)}
.bar i{display:block;height:100%;background:var(--hp);transition:width .25s}
.bar.mp i{background:var(--mp)}
.num{font-variant-numeric:tabular-nums}
.stbox{font-size:calc(var(--u)*7.5);line-height:1.35;padding:calc(var(--u)*3) calc(var(--u)*5)}
.stbox .n{color:var(--line);display:flex;justify-content:space-between;align-items:baseline}
.stbox .n small{color:var(--mist);font-size:calc(var(--u)*6.5)}
.stbox .k{display:flex;justify-content:space-between}
.stbox .k b{font-weight:normal;color:var(--mist)}
.stbox.act{border-color:var(--lamp);box-shadow:inset 0 0 0 calc(var(--u)*1) #ffbf5a66,0 0 calc(var(--u)*6) #ffbf5a66}
.stbox.dead{color:var(--bad)} .stbox.dead .n{color:var(--bad)}
.stbox.hurt{animation:hurt .35s steps(4) 1}
@keyframes hurt{0%,100%{transform:translate(0,0);background:#3a0d14}25%{transform:translate(calc(var(--u)*-2),0)}75%{transform:translate(calc(var(--u)*2),0)}}
.stbox.heal{animation:heal .6s 1}
@keyframes heal{0%{box-shadow:inset 0 0 calc(var(--u)*10) #8ee07fcc}100%{box-shadow:inset 0 0 0 #8ee07f00}}
.stbox.low .hpv{color:var(--gold)} .stbox.crit .hpv{color:var(--bad)}
.tag{display:inline-block;font-size:calc(var(--u)*6);padding:0 calc(var(--u)*2);border-radius:calc(var(--u)*1);margin-left:calc(var(--u)*2);line-height:1.5}
.tag.poi{background:#6b2f8a} .tag.slp{background:#2f4f8a} .tag.up{background:#8a5a1f} .tag.df{background:#2f6b4f}

/* floating numbers */
.pop{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--u)*12);color:#fff;pointer-events:none;
  text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #000,calc(var(--u)*-1) calc(var(--u)*1) 0 #000,calc(var(--u)*1) calc(var(--u)*-1) 0 #000,calc(var(--u)*-1) calc(var(--u)*-1) 0 #000;
  animation:pop 1s ease-out forwards;font-variant-numeric:tabular-nums}
.pop.heal{color:var(--hp)} .pop.mp{color:var(--mp)} .pop.crit{color:var(--gold);font-size:calc(var(--u)*15)} .pop.miss{color:var(--mist);font-size:calc(var(--u)*9)}
@keyframes pop{0%{opacity:0;margin-top:calc(var(--u)*4)}12%{opacity:1;margin-top:calc(var(--u)*-8)}24%{margin-top:calc(var(--u)*-3)}75%{opacity:1}100%{opacity:0;margin-top:calc(var(--u)*-6)}}

/* title */
.logo{position:absolute;left:0;right:0;top:calc(var(--u)*30);text-align:center;pointer-events:none}
.logo .jp{font-size:calc(var(--u)*30);letter-spacing:.12em;color:#fff4dc;text-shadow:0 0 calc(var(--u)*6) #ffbf5acc,0 0 calc(var(--u)*16) #ff9f3a66,calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #2a1408}
.logo .jp ruby rt{font-size:calc(var(--u)*7);letter-spacing:.3em;color:var(--lamp)}
.logo .en{margin-top:calc(var(--u)*3);font-size:calc(var(--u)*7);letter-spacing:.55em;color:var(--mist);padding-left:.55em}
.press{position:absolute;left:0;right:0;bottom:calc(var(--u)*40);text-align:center;font-size:calc(var(--u)*9);color:var(--lamp);animation:blink 1.4s steps(2) infinite}
.foot{position:absolute;left:0;right:0;bottom:calc(var(--u)*6);text-align:center;font-size:calc(var(--u)*6);color:var(--dim);letter-spacing:.1em}
.prologue{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*20);text-align:center;
  font-size:calc(var(--u)*9.5);line-height:2;white-space:pre-line;color:#e8e2d4;transition:opacity 1.2s}
.credits{position:absolute;left:0;right:0;text-align:center;font-size:calc(var(--u)*9);line-height:1.9;white-space:pre-line;color:#f2ead8;text-shadow:0 0 calc(var(--u)*4) #000}
.credits h3{margin:calc(var(--u)*14) 0 calc(var(--u)*2);font-weight:normal;font-size:calc(var(--u)*7);letter-spacing:.3em;color:var(--lamp)}
.credits .big{font-size:calc(var(--u)*22);letter-spacing:.14em;color:#fff4dc;text-shadow:0 0 calc(var(--u)*8) #ffbf5acc}
.desc{font-size:calc(var(--u)*8);color:var(--line);line-height:1.5}
.desc small{color:var(--mist);font-size:calc(var(--u)*7)}
.up{color:var(--hp)} .dn{color:var(--bad)}
.sett .opt .r{color:var(--lamp)}

/* touch pad */
#pad{position:relative;width:100%;max-width:520px;flex:none;display:none;touch-action:none}
#pad.on{display:block}
.dpad{position:absolute;left:4%;top:50%;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,#1a2648 0%,#121a35 70%,#0e1530 100%);
  box-shadow:inset 0 2px 0 #ffffff14,0 6px 16px #0008}
.dpad i{position:absolute;background:#2a3762;box-shadow:inset 0 1px 0 #ffffff22}
.dpad i.h{left:12%;right:12%;top:37%;height:26%;border-radius:8px}
.dpad i.v{top:12%;bottom:12%;left:37%;width:26%;border-radius:8px}
.dpad b{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.75}
.dpad b.u{left:50%;top:18%;transform:translateX(-50%);border-bottom-color:var(--mist);border-top:0}
.dpad b.d{left:50%;bottom:18%;transform:translateX(-50%);border-top-color:var(--mist);border-bottom:0}
.dpad b.l{top:50%;left:18%;transform:translateY(-50%);border-right-color:var(--mist);border-left:0}
.dpad b.r{top:50%;right:18%;transform:translateY(-50%);border-left-color:var(--mist);border-right:0}
.dpad.pu b.u,.dpad.pd b.d,.dpad.pl b.l,.dpad.pr b.r{opacity:1;filter:drop-shadow(0 0 4px var(--lamp))}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#0b1024;
  background:radial-gradient(circle at 35% 30%,#ffe2a8,#ffbf5a 55%,#c9832a);box-shadow:0 5px 0 #7a4a14,0 8px 16px #0008}
.btn.b{background:radial-gradient(circle at 35% 30%,#c9d6ea,#93a7c4 55%,#5b6a88);box-shadow:0 5px 0 #33405e,0 8px 16px #0008}
.btn.on{transform:translateY(4px);box-shadow:0 1px 0 #7a4a14,0 3px 8px #0008}
.btn.b.on{box-shadow:0 1px 0 #33405e,0 3px 8px #0008}
.mbtn{position:absolute;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:12px;font-size:12px;letter-spacing:.2em;color:var(--mist);
  background:#141d3a;box-shadow:inset 0 0 0 1px #2a3762,0 3px 0 #070b18}
.mbtn.on{color:var(--lamp)}
#help{font-size:12px;color:var(--dim);letter-spacing:.06em;text-align:center;line-height:1.6;flex:none;max-width:100%}
#help kbd{font-family:inherit;color:var(--mist);background:#141d3a;border-radius:4px;padding:0 5px;box-shadow:inset 0 0 0 1px #2a3762}

/* additions: modal, battle log, ending, landscape pad */
.msg.blog div{white-space:nowrap;overflow:hidden}
.modal{z-index:10;font-size:calc(var(--u)*8.5)}
.modal input,.modal textarea{width:100%;box-sizing:border-box;font-family:var(--f-pix);font-size:max(16px,calc(var(--u)*9));background:#070b18;color:var(--line);border:1px solid var(--dim);border-radius:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*4);outline:none;resize:none;user-select:text;-webkit-user-select:text}
.modal textarea{font-size:max(16px,calc(var(--u)*8));word-break:break-all}
.modal input:focus,.modal textarea:focus{border-color:var(--lamp);box-shadow:0 0 0 2px #ffbf5a44}
.mbtns{display:flex;gap:calc(var(--u)*4);justify-content:flex-end;margin-top:calc(var(--u)*5)}
.mbtns button{font-family:var(--f-pix);font-size:max(16px,calc(var(--u)*8));background:var(--lamp);color:#0b1024;border:0;border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.5) calc(var(--u)*6);cursor:pointer;touch-action:manipulation}
.mbtns button:focus-visible{outline:2px solid var(--line);outline-offset:2px}
.mbtns #mcancel{background:#2a3762;color:var(--line)}
.endshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0000 18%,#0b1229a8 40%,#0b1229a8 60%,#0000 82%)}
.prologue{text-shadow:0 0 calc(var(--u)*3) #000,0 0 calc(var(--u)*6) #000}
.win.desc{font-size:calc(var(--u)*8);line-height:1.5;padding:calc(var(--u)*4) calc(var(--u)*6)}
.win.desc .k,.statusv .k{display:flex;justify-content:space-between}
.win.desc .k b,.statusv .k b{font-weight:normal;color:var(--mist)}
.statusv{font-size:calc(var(--u)*8.5);line-height:1.5}
.win.list .r{padding-left:calc(var(--u)*6)}
[hidden]{display:none!important}
#app.land{flex-direction:row}
#app.land #pad{position:fixed;inset:0;max-width:none;height:auto!important;pointer-events:none;z-index:5;display:block}
#app.land #pad>*{pointer-events:auto}

/* ===== hunting-lodge theme: smoked leather panels with forged bronze trim ===== */
#ui{font-weight:500;letter-spacing:.03em}
.win{background:linear-gradient(180deg,rgba(38,31,24,.95),rgba(17,14,11,.95));border:calc(var(--u)*1) solid var(--bronze);border-radius:calc(var(--u)*1.5);
  box-shadow:inset 0 0 0 calc(var(--u)*.8) #000c,inset 0 0 0 calc(var(--u)*1.6) #b8925a30,0 calc(var(--u)*1.5) calc(var(--u)*5) #000b;
  text-shadow:0 calc(var(--u)*.6) calc(var(--u)*1) #000}

  --c:#e0bf84;--t:calc(var(--u)*1);--l:calc(var(--u)*6);
  background:linear-gradient(var(--c),var(--c)) top left/var(--l) var(--t) no-repeat,linear-gradient(var(--c),var(--c)) top left/var(--t) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) top right/var(--l) var(--t) no-repeat,linear-gradient(var(--c),var(--c)) top right/var(--t) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) bottom left/var(--l) var(--t) no-repeat,linear-gradient(var(--c),var(--c)) bottom left/var(--t) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) bottom right/var(--l) var(--t) no-repeat,linear-gradient(var(--c),var(--c)) bottom right/var(--t) var(--l) no-repeat}
.win .ttl{background:linear-gradient(#5e4628,#2e2214);border:calc(var(--u)*.6) solid var(--bronze);color:#ffe2a8;font-family:var(--f-head);font-weight:800;
  letter-spacing:.12em;padding:0 calc(var(--u)*4);border-radius:calc(var(--u)*.8);top:calc(var(--u)*-6.5)}
.opt{border-radius:calc(var(--u)*1)}

.opt.sel::before{border-left-color:#f2c06a;filter:drop-shadow(0 0 calc(var(--u)*1.5) #f2b75a)}

.msg .nm{font-family:var(--f-head);font-weight:800;color:#ffd68e;letter-spacing:.08em}

.banner{font-family:var(--f-head);font-weight:800;letter-spacing:.3em;font-size:calc(var(--u)*11);color:#fff2d6;
  background:linear-gradient(90deg,#0000,#120e0ae0 18%,#120e0ae0 82%,#0000);border-top-color:#b8925acc;border-bottom-color:#b8925acc;
  text-shadow:0 0 calc(var(--u)*4) #f2b75a99,0 calc(var(--u)*.6) 0 #000}
.bar{height:calc(var(--u)*2.6);background:#0009;box-shadow:inset 0 0 0 calc(var(--u)*.4) #b8925a55;border-radius:calc(var(--u)*.6)}
.bar i{background:linear-gradient(#b4ec7e,#5aa632)}

const OUT = '#1c1424';
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

/* ---------- painter ---------- */
function painter(g, seed) {
  const r = mulberry(seed || 1);
  return {
    g, r,
    px(x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); },
    rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); },
    dots(c, n, x0 = 0, y0 = 0, w = 16, h = 16) { g.fillStyle = c; for (let i = 0; i < n; i++) g.fillRect(x0 + Math.floor(r() * w), y0 + Math.floor(r() * h), 1, 1); },
    ri(a, b) { return a + Math.floor(r() * (b - a + 1)); },
  };
}
const TILE_CACHE = new Map();
function tileC(key, fn) {

}

function ground(P, kind, v) {

  P.dots(d, 14); P.dots(l, 6);
  if (kind === 'grass') { for (let i = 0; i < 3; i++) { const x = P.ri(1, 13), y = P.ri(2, 14); P.px(x, y, l); P.px(x + 2, y, l); P.px(x + 1, y + 1, d); } if (v === 3) { P.px(4, 5, '#f4e27a'); P.px(11, 10, '#ffffff'); P.px(12, 4, '#f08aa0'); } }

}

  P.rect(7, 12, 2, 4, '#6b4426'); P.px(6, 15, '#4e301a'); P.px(9, 15, '#4e301a');
  const g = P.g;
  g.fillStyle = '#22603a'; g.beginPath(); g.arc(8, 7.5, 7, 0, Math.PI * 2); g.fill();

const px = n => `calc(var(--u)*${n})`;
function place(e, x, y, w, h) { if (x != null) e.style.left = px(x); if (y != null) e.style.top = px(y); if (w != null) e.style.width = px(w); if (h != null) e.style.height = px(h); }
function mkWin(cls, x, y, w, h, parent) { const e = document.createElement('div'); e.className = 'win ' + (cls || ''); place(e, x, y, w, h); (parent || uiRoot).appendChild(e); return e; }
function markup(s) { // [y]..[/] color tags
  return esc(s).replace(/\[(y|b|r|g)\]/g, (m, c) => `<span class="${{ y: 'hl', b: 'hb', r: 'hr', g: 'hg' }[c]}">`).replace(/\[\/\]/g, '</span>');
}
function friendName(id) {
  if (typeof G !== 'undefined' && G) {
    const m = G.party && G.party.find(x => x.id === id);
    if (m && m.name) return m.name;
    if (G.names && G.names[id]) return G.names[id];
  }
  return (CHARS[id] && CHARS[id].name) || id;
}
function fillName(s) {
  const hero = (typeof G !== 'undefined' && G && G.party && G.party[0]) ? G.party[0].name : '主人公';
  return String(s).replace(/\{name\}|ミラ|セナ/g, m => m === '{name}' ? hero : friendName(m === 'ミラ' ? 'mira' : 'sena'));
}

const UI = {

  update() {

    const f = this.focus[this.focus.length - 1];

    if (f && f._pf !== FRAME) f.update();
  },
  push(h) { h._pf = FRAME; this.focus.push(h); },
  pop(h) { const i = this.focus.lastIndexOf(h); if (i >= 0) this.focus.splice(i, 1); },
  busy() { return this.focus.length > 0; },
  tapped() { return In.inTick ? this._tap : !!this._tapEdge; },
  clear() { uiRoot.innerHTML = ''; this.focus.length = 0; Msg.el = null; },
};

/* ---------- list window ---------- */
class ListWin {
  constructor(o) {
    this.o = Object.assign({ cols: 1, cancel: true, rows: 0 }, o);
    this.el = mkWin('list ' + (o.cls || ''), o.x, o.y, o.w, o.h);
    if (o.title) { const t = document.createElement('div'); t.className = 'ttl'; t.textContent = o.title; this.el.appendChild(t); }
    this.body = document.createElement('div'); if (this.o.cols === 2) this.body.className = 'grid2'; this.el.appendChild(this.body);
    this.sel = o.sel || 0; this.top = 0; this.items = o.items || [];
    this.render();
  }
  setItems(items, sel) { this.items = items; if (sel != null) this.sel = sel; this.sel = clamp(this.sel, 0, Math.max(0, items.length - 1)); this.render(); }
  get rows() { return this.o.rows || 99; }
  render() {
    const o = this.o, per = o.cols, rows = this.rows;
    const selRow = Math.floor(this.sel / per);
    if (selRow < this.top) this.top = selRow; if (selRow >= this.top + rows) this.top = selRow - rows + 1;
    const start = this.top * per, end = Math.min(this.items.length, start + rows * per);
    let h = '';
    for (let i = start; i < end; i++) {
      const it = this.items[i];
      h += `<div class="opt${i === this.sel ? ' sel' : ''}${it.dis ? ' dis' : ''}" data-i="${i}">${it.html != null ? it.html : esc(it.t)}${it.r != null ? `<span class="r num">${esc(it.r)}</span>` : ''}</div>`;
    }
    if (!this.items.length && o.empty) h = `<div class="opt empty-back" role="button" tabindex="0">${esc(o.empty)}<small>タップして 戻る</small></div>`;
    this.body.innerHTML = h;
    if (this.top > 0) this.body.insertAdjacentHTML('beforeend', '<div class="more up">▲</div>');
    if (end < this.items.length) this.body.insertAdjacentHTML('beforeend', '<div class="more dn">▼</div>');
    for (const e of this.body.querySelectorAll('.opt[data-i]')) e.addEventListener('click', ev => { ev.stopPropagation(); this.click(+e.dataset.i); });
    const emptyBack = this.body.querySelector('.empty-back');
    if (emptyBack) {
      const back = ev => { ev.preventDefault(); ev.stopPropagation(); Snd.fx('cancel'); this.resolve(-1); };
      emptyBack.addEventListener('click', back);
      emptyBack.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') back(ev); });
    }
    if (o.onMove) o.onMove(this.sel, this.items[this.sel]);
  }
  click(i) { if (!this._res) return; if (i !== this.sel) { this.sel = i; this.render(); } this.confirm(); }
  confirm() { const it = this.items[this.sel]; if (!it) return; if (it.dis && !this.o.allowDis) { Snd.fx('buzz'); return; } Snd.fx('ok'); this.resolve(this.sel); }
  resolve(v) { const r = this._res; this._res = null; UI.pop(this); this.el.classList.add('inactive'); if (r) r(v); }
  choose() { this.el.classList.remove('inactive'); return new Promise(r => { this._res = r; UI.push(this); }); }
  update() {
    const n = this.items.length, per = this.o.cols; let s = this.sel;
    if (n) {
      if (In.repeat('down')) s = s + per < n ? s + per : (this.o.wrap === false ? s : s % per);
      else if (In.repeat('up')) s = s - per >= 0 ? s - per : (this.o.wrap === false ? s : Math.min(n - 1, s % per + per * Math.floor((n - 1 - s % per) / per)));
      else if (per > 1 && In.repeat('right')) s = s % per < per - 1 && s + 1 < n ? s + 1 : s - s % per;
      else if (per > 1 && In.repeat('left')) s = s % per > 0 ? s - 1 : Math.min(n - 1, s - s % per + per - 1);
      else if (this.o.lr && In.repeat('right')) { this.o.lr(1); return; }
      else if (this.o.lr && In.repeat('left')) { this.o.lr(-1); return; }
      if (s !== this.sel) { this.sel = s; Snd.fx('cur'); this.render(); }
    }
    if (In.pressed('a')) { if (n) this.confirm(); }
    else if (In.pressed('b') && this.o.cancel) { Snd.fx('cancel'); this.resolve(-1); }
    else if (In.pressed('menu') && this.o.cancel && this.o.menuCancel !== false) { Snd.fx('cancel'); this.resolve(-1); }
  }
  close() { if (this._res) this.resolve(-1); this.el.remove(); }
}

const Msg = {

  setFace(id, name) {

  /* ---------- drawing ---------- */
  layers(ch, x, y, f) {

  draw(c) {

      if (ch === 'k' && this.tile(x - 1, y) !== 'k' && this.tile(x, y - 1) !== 'k') c.drawImage(boatSprite(), sx, sy - 12 + Math.round(Math.sin(FRAME / 30)));

    // entities
    const ents = [];
    for (const n of m.npcs) if (this.visible(n)) ents.push({ e: n, spr: n.def.aura ? auraSprite(n.def.aura, Math.floor(FRAME / 20) % 2) : buildSprite(n.def.ch, n.dir, n.mv ? Math.floor(FRAME / 8) % 2 : Math.floor(FRAME / 24) % 2), bob: n.def.aura ? Math.round(Math.sin(FRAME / 12) * 1.5) : 0 });
    for (let i = this.fol.length - 1; i >= 0; i--) { const fo = this.fol[i], mem = G.party[i + 1]; if (!mem) continue; ents.push({ e: fo, spr: buildSprite(CHARS[mem.id].sprite, fo.dir, (fo.mv ? Math.floor(FRAME / 8) : Math.floor(FRAME / 24)) % 2), ghost: mem.hp <= 0, z: -1 - i }); }
    ents.push({ e: this.p, spr: buildSprite('hero', this.p.dir, (this.p.mv ? Math.floor(FRAME / 8) : Math.floor(FRAME / 24)) % 2), z: 1 });
    if (m.kind === 'world') { for (let y = y0; y <= y1 + 2; y++) for (let x = x0; x <= x1; x++) if (this.tile(x, y) === 'X' && !F('dawn')) ents.push({ tower: true, e: { px: x * 16, py: y * 16 } }); }
    ents.sort((a, b) => (a.e.py - b.e.py) || ((a.z || 0) - (b.z || 0)));

      const sx = o.e.px - cx, sy = o.e.py - cy;

      c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(sx + 8, sy + 14.5, 5.5, 2, 0, 0, 7); c.fill();

  shore(c, x, y, sx, sy) {

    if (land(x, y + 1)) { c.fillRect(sx, sy + 15, 16, 1); c.fillRect(sx + 8 - ph * 6, sy + 14, 3, 1); }
    if (land(x - 1, y)) { c.fillRect(sx, sy, 1, 16); c.fillRect(sx + 1, sy + 4 + ph * 6, 1, 3); }
    if (land(x + 1, y)) { c.fillRect(sx + 15, sy, 1, 16); c.fillRect(sx + 14, sy + 9 - ph * 6, 1, 3); }
  },
  lighting(c, cx, cy, x0, y0, x1, y1) {
    const m = this.m;
    if (m.kind === 'world' || m.kind === 'town') {
      let t = [0.5, 0.4, 0.3, 0.22][flames()]; if (F('bridge')) t = 0.16; if (F('dawn')) t = 0;
      if (m.kind === 'town') t *= 0.7;

        c.fillStyle = `rgb(${Math.round(255 - t * 200)},${Math.round(255 - t * 196)},${Math.round(255 - t * 120)})`;

          c.globalCompositeOperation = 'lighter';

          c.globalCompositeOperation = 'source-over';
        }
      }
      if (this.ending > 0) { c.globalCompositeOperation = 'screen'; const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgba(255,170,90,${0.35 * this.ending})`); g.addColorStop(1, `rgba(255,220,160,${0.1 * this.ending})`); c.fillStyle = g; c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'source-over'; }
      return;

    if (!this.lc) { const [lc, lg] = mkCanvas(W, H); this.lc = lc; this.lg = lg; }
    const g = this.lg, dark = m.d.dark === true ? 0.86 : (m.d.dark || 0);
    if (!dark) return;

    g.fillStyle = m.theme === 'volcano' ? `rgba(30,4,2,${dark})` : m.theme === 'shrine' ? `rgba(2,8,24,${dark})` : `rgba(6,3,12,${dark})`;
    g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r, a = 1) => { const gr = g.createRadialGradient(x, y, r * 0.25, x, y, r); gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); };
    const flick = Math.sin(FRAME / 7) * 2 + Math.sin(FRAME / 3.3);
    hole(this.p.px + 8 - cx, this.p.py + 6 - cy, 66 + flames() * 12 + flick);
    if (m.d.altar && !F(m.d.altar.flag)) hole(m.d.altar.x * 16 + 16 - cx, m.d.altar.y * 16 + 6 - cy, 46 + flick);
    for (const n of m.npcs) if (n.def.aura && this.visible(n)) hole(n.px + 8 - cx, n.py + 8 - cy, 22, 0.7);
    let cnt = 0;
    for (let y = y0; y <= y1 && cnt < 40; y++) for (let x = x0; x <= x1; x++) { const ch = this.tile(x, y); if (ch === 'L') { hole(x * 16 + 8 - cx, y * 16 + 8 - cy, 20, 0.8); cnt++; } else if (ch === '*') hole(x * 16 + 8 - cx, y * 16 + 8 - cy, 18, 0.5); }
    c.drawImage(this.lc, 0, 0);
    if (m.theme === 'volcano') { c.globalCompositeOperation = 'overlay'; c.fillStyle = 'rgba(255,90,40,.12)'; c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'source-over'; }
  },
};

/* ===== battle ===== */
const FLOATERS = new Set(['bat', 'ghost', 'eye', 'jellyfish', 'bird', 'mage', 'nox2']);
const BLog = {
  el: null, lines: [],
  open() { if (this.el && this.el.isConnected) return; this.el = mkWin('msg blog'); this.lines = []; },
  close() { if (this.el) this.el.remove(); this.el = null; },
  clear() { this.lines = []; if (this.el) this.el.innerHTML = ''; },
  async add(text, hold) {
    this.open();
    if (this.lines.length >= 3) this.lines.shift();
    this.lines.push(fillName(text));
    const html = this.lines.slice(0, -1).map(l => `<div>${markup(l)}</div>`).join('');
    const last = markup(this.lines[this.lines.length - 1]);
    const parts = last.split(/(<[^>]+>)/).filter(Boolean); const units = []; for (const p of parts) { if (p[0] === '<') units.push({ tag: p }); else for (const c of p) units.push({ ch: c }); }
    const total = units.filter(u => u.ch).length;
    let n = 0;
    while (n < total) {
      n = Math.min(total, n + (In.held('a') ? 6 : 3));
      let s = '', k = 0; for (const u of units) { if (u.tag) s += u.tag; else { if (k >= n) break; s += u.ch; k++; } }
      if (this.el) this.el.innerHTML = html + `<div>${s}</div>`;
      await wait(1);
    }
    const w = hold != null ? hold : [34, 22, 12][G.settings.text];
    for (let i = 0; i < w; i++) { await wait(1); if (In.held('a') && i > 3) break; }
  },
};

const Battle = {
  active: false, en: [], fx: [], t: 0, cursor: null, status: null,
  async run(group, opt) {
    this.active = true; this.opt = opt; this.boss = !!opt.boss; this.t = 0; this.fx = []; this.cursor = null; this.turn = 0;
    G.battles++;
    // build enemies
    const counts = {}; for (const id of group) counts[id] = (counts[id] || 0) + 1;
    const seen = {};
    this.en = group.map(id => {
      const E = ENEMIES[id], art = enemyArt(id); seen[id] = (seen[id] || 0) + 1;
      const name = counts[id] > 1 ? E.name + 'ABCD'[seen[id] - 1] : E.name;
      return { id, E, name, hp: E.hp, mhp: E.hp, art, flash: 0, shake: 0, alpha: 1, dying: 0, dead: false, st: {}, buff: {}, x: 0, y: 0, w: art.base * 2, h: art.base * 2 };
    });
    this.layout();
    this.focus = null;
    if (R3.ok) { try { B3.begin(opt.bg || 'plain', this.en, this.boss); } catch (e) { console.error(e); R3.ok = false; } }
    // transition
    if (!opt.noTrans) {
      Snd.fx('enc');
      for (let i = 0; i < 3; i++) { await flash('#ffffff', 5, 0.85); await wait(2); }
      await fadeOut(8);
    }
    Snd.play(opt.bgm || (this.boss ? 'boss' : 'battle'));
    const prevScene = Scene.cur;
    if (bannerEl) { bannerEl.remove(); bannerEl = null; }
    Scene.set(this);
    this.status = new StatusStrip(4);
    await fadeIn(10);
    let result;
    try { result = await this.loop(); }
    catch (e) { console.error(e); result = 'win'; }
    // teardown
    if (result !== 'lose' || opt.keepOnLose) {
      await fadeOut(14);
    } else { await fadeOut(30); }
    BLog.close(); this.status.remove(); this.cursor = null;
    for (const m of G.party) { m.buff = {}; m.st.sleep = false; delete m.defending; }
    this.active = false;
    if (prevScene === Field || !opt.stay) { Scene.set(Field); }
    if (result !== 'lose') { if (!opt.noMusicResume) Field.applyMusic(); await fadeIn(14); }
    return result;
  },
  layout() {
    const list = this.en.filter(e => !e.dead);
    const ws = list.map(e => e.w); let total = ws.reduce((a, b) => a + b, 0) + (list.length - 1) * 4;
    const gap = total > 248 ? (248 - ws.reduce((a, b) => a + b, 0)) / Math.max(1, list.length - 1) : 4;
    total = ws.reduce((a, b) => a + b, 0) + gap * (list.length - 1);
    let x = (W - total) / 2;
    list.forEach(e => { e.x = Math.round(x); e.y = Math.round(152 - e.h); x += e.w + gap; });
  },
  liveEn() { return this.en.filter(e => !e.dead); },
  partyIdx(m) { return G.party.indexOf(m); },
  async loop() {
    const names = {}; for (const e of this.en) names[e.E.name] = (names[e.E.name] || 0) + 1;
    const intro = Object.entries(names).map(([n, c]) => c > 1 ? `${n}が ${c}ひき` : `${n}が`).join('、 ');
    if (this.boss && !TURBO) {
      // title card + roar while the camera pushes out from the monster
      const card = document.createElement('div'); card.className = 'bosscard';
      card.innerHTML = `<div class="lb">― 強大な魔物 ―</div><div class="nmb">${esc(this.en[0].E.name)}</div><div class="rl"></div>`;
      uiRoot.appendChild(card);
      await wait(20); Snd.fx('roar'); shake(); await wait(30); shake();
      await wait(70); card.classList.add('out'); await wait(24); card.remove();
    }
    await BLog.add(this.boss ? `${this.en[0].E.name}が あらわれた！` : `${intro} あらわれた！`);
    let first = 'normal';
    if (!this.learningMode() && !this.boss && !this.opt.noAmbush) { const r = Math.random(); if (r < 0.07) first = 'pre'; else if (r < 0.12) first = 'amb'; }
    if (first === 'pre') await BLog.add('しかし 魔物たちは まだ こちらに 気づいていない！');
    if (first === 'amb') await BLog.add('魔物たちは いきなり おそいかかってきた！');
    for (; ;) {
      this.turn++;
      if (TURBO && this.turn > 80) return 'lose';
      let cmds = [];
      if (first !== 'amb') {
        BLog.close();
        cmds = await this.commandPhase();
        if (cmds === 'flee') {
          BLog.clear();
          await BLog.add('{name}たちは にげだした！');
          if (this.boss || this.opt.noFlee) { await BLog.add('しかし にげることは できない！'); cmds = []; }
          else {
            const ps = alive().reduce((a, m) => a + mstats(m).spd, 0) / Math.max(1, alive().length), es = this.liveEn().reduce((a, e) => a + e.E.spd, 0) / Math.max(1, this.liveEn().length);
            const p = clamp(0.55 + (ps - es) / (2 * (ps + es)), 0.3, 0.92);
            if (first === 'pre' || Math.random() < p) { Snd.fx('run'); await BLog.add('うまく にげきれた！'); return 'flee'; }
            await BLog.add('しかし まわりこまれてしまった！'); cmds = [];

  async applyItem(it, t) {
    if (it.use === 'heal') { if (t.hp <= 0) { await BLog.add(`しかし ${t.name}は たおれている！`); return; } await this.healMember(t, it.power); }
    else if (it.use === 'mp') { if (t.hp <= 0) { await BLog.add(`しかし ${t.name}は たおれている！`); return; } const s = mstats(t); const v = Math.min(it.power, s.mmp - t.mp); t.mp += v; Snd.fx('heal'); this.status.fx(this.partyIdx(t), 'heal'); this.status.refresh(); const [x, y] = this.boxCenter(t); pop(x, y + 12, '+' + v, 'mp'); await BLog.add(`${t.name}の MPが ${v} 回復した！`); }
    else if (it.use === 'full') { if (t.hp <= 0) { await BLog.add(`しかし ${t.name}は たおれている！`); return; } const s = mstats(t); t.hp = s.mhp; t.mp = s.mmp; Snd.fx('heal'); this.status.fx(this.partyIdx(t), 'heal'); this.status.refresh(); await BLog.add(`${t.name}の HPと MPが すべて 回復した！`); }
    else if (it.use === 'cure') { if (t.hp <= 0) { await BLog.add(`しかし ${t.name}は たおれている！`); return; } t.st.poison = false; Snd.fx('heal'); this.status.fx(this.partyIdx(t), 'heal'); await BLog.add(`${t.name}の 毒が きえた！`); }
    else if (it.use === 'raise') await this.reviveMember(t);
  },
  async reviveMember(t) {
    if (t.hp > 0) { await BLog.add(`しかし ${t.name}は 元気だ。`); return; }
    t.hp = Math.max(1, Math.floor(mstats(t).mhp / 2)); t.st = {}; Snd.fx('light'); this.status.fx(this.partyIdx(t), 'heal'); this.status.refresh();
    await BLog.add(`[g]${t.name}は 生きかえった！[/]`);
  },
  async healMember(t, amt) {
    const s = mstats(t); const v = Math.max(0, Math.min(amt, s.mhp - t.hp)); t.hp += v;
    Snd.fx('heal'); this.status.fx(this.partyIdx(t), 'heal'); this.status.refresh();
    const [x, y] = this.boxCenter(t); pop(x, y + 10, String(v), 'heal');
    await BLog.add(`${t.name}の HPが ${v} 回復した！`);
  },
  async physHit(m, t, mult, elem, fx, o) {
    const st = mstats(m);
    Snd.fx('swing');
    if (!(o && o.sure) && t.E.evade && chance(t.E.evade)) { await this.fxSlash(t, true); Snd.fx('miss'); const [x, y] = this.enemyCenter(t); pop(x, t.y + 8, 'MISS', 'miss'); await BLog.add(`ミス！ ${t.name}は ひらりと かわした！`); return; }
    const atk = st.atk * (m.buff.atk ? 1.3 : 1), def = t.E.def * (t.buff.def ? 1.5 : 1);
    const crit = !!(o && o.crit) || chance(1 / 18);

    const el = elem ? (t.E.el && t.E.el[elem] != null ? t.E.el[elem] : 1) : 1;
    dmg = Math.round(dmg * el);
    if (fx === 'light') await this.fxSpell('light', [t], true); else await this.fxSlash(t);
    if (crit) { Snd.fx('crit'); shake(); await BLog.add('[y]かいしんの いちげき！！[/]', 4); }
    await this.dmgEnemy(t, dmg, el, crit);
  },
  async dmgEnemy(t, dmg, el, crit) {
    if (t.dead) return;
    if (el === 0) { await BLog.add(`${t.name}には まったく 効いていない！`); return; }
    dmg = Math.max(el < 1 ? 0 : 1, dmg);
    t.hp -= dmg; t.flash = 14; t.shake = 12;
    if (!crit) Snd.fx('hit');
    const [x] = this.enemyCenter(t);
    pop(x, t.y + Math.min(30, t.h / 3), String(dmg), crit ? 'crit' : '');
    if (t.st.sleep && chance(0.5)) t.st.sleep = 0;
    await BLog.add(`${t.name}に [y]${dmg}[/]の ダメージ！${el > 1 ? ' こうかは ばつぐんだ！' : el < 1 ? ' あまり 効いていない。' : ''}`);

  async killEnemy(t) {

    for (let i = 0; i < dur; i++) { t.dying = 1 - i / dur; await wait(1); }
    t.dead = true;
    if (!t.E.boss) await BLog.add(`${t.name}を たおした！`, 8);
  },
  async healEnemy(e, amt) { const v = Math.min(amt, e.mhp - e.hp); e.hp += v; Snd.fx('heal'); this.fx.push(sparkles(e, '#8ef07f')); await BLog.add(`${e.name}の キズが ${v} 回復した！`); },
  async enemyAct(e) {
    if (e.st.sleep) { e.st.sleep--; if (e.st.sleep <= 0) { e.st.sleep = 0; await BLog.add(`${e.name}は 目を さました！`); } else await BLog.add(`${e.name}は ねむっている……`, 12); return; }
    let aid = wpick(e.E.acts.map(([w, a]) => [w, a]));
    let A = EACT[aid];
    if (A.k === 'heal' && e.hp > e.mhp * 0.6) { aid = 'atk'; A = EACT.atk; }
    if (A.k === 'buff' && e.buff[A.stat]) { aid = 'atk'; A = EACT.atk; }
    if (A.k === 'dispel' && !G.party.some(m => m.buff.atk || m.buff.def)) { aid = 'atk'; A = EACT.atk; }
    const live = alive(); if (!live.length) return;
    // enemy "attack" animation: blink
    e.flash = -8;
    await BLog.add(A.t.replace('{e}', e.name), 6);
    if (A.k === 'phys') {
      const tg = A.all ? live : [pick(live)];
      if (A.fx === 'quake') shake();
      for (const t of tg) {
        for (let h = 0; h < (A.hits || 1); h++) {
          if (t.hp <= 0) break;
          const st = mstats(t);
          let dmg = physDmg(e.E.atk * (e.buff.atk ? 1.3 : 1), st.def * (t.buff.def ? 1.5 : 1), A.m);
          if (t.defending) dmg = Math.max(1, Math.round(dmg / 2));
          if (chance(0.03)) { Snd.fx('miss'); await BLog.add(`${t.name}は ひらりと 身を かわした！`, 10); continue; }
          await this.hurtMember(t, dmg);
          if (A.drain && dmg > 0) { e.hp = Math.min(e.mhp, e.hp + Math.round(dmg / 2)); }
          if (A.poison && t.hp > 0 && !t.st.poison && !st.noPoison && chance(A.poison)) { t.st.poison = true; Snd.fx('poison'); this.status.refresh(); await BLog.add(`[r]${t.name}は 毒に おかされた！[/]`, 12); }
        }
      }
      return;
    }
    if (A.k === 'mag') {
      const tg = A.all ? live : [pick(live)];

        if (t.hp <= 0) continue;
        const st = mstats(t);

    }

      for (const t of tg) {
        if (mstats(t).noSleep || !chance(A.rate)) { await BLog.add(`${t.name}は ねむけを はねのけた！`, 10); continue; }
        t.st.sleep = true; this.status.refresh(); await BLog.add(`[b]${t.name}は ねむってしまった！[/]`, 10);
      }
      return;
    }
    if (A.k === 'heal') { await this.healEnemy(e, A.amt); return; }
    if (A.k === 'buff') { Snd.fx('buff'); e.buff[A.stat] = 3; await BLog.add(A.stat === 'atk' ? `${e.name}の 攻撃力が あがった！` : `${e.name}の 守りが かたくなった！`); return; }
    if (A.k === 'dispel') { Snd.fx('dark'); await flash('#2a0a3a', 14, 0.6); for (const m of G.party) m.buff = {}; this.status.refresh(); await BLog.add('みんなに かかっていた 加護が かき消された！'); return; }
  },
  async hurtMember(t, dmg, hold) {
    t.hp = Math.max(0, t.hp - dmg);
    if (t.st.sleep && chance(0.5)) t.st.sleep = false;
    const i = this.partyIdx(t);
    Snd.fx('hurt'); shake(); this.status.fx(i, 'hurt'); this.status.refresh();
    const [x, y] = this.boxCenter(t); pop(x, y + 10, String(dmg));
    await BLog.add(`${t.name}は [r]${dmg}[/]の ダメージを うけた！`, hold);
    if (t.hp <= 0) { t.st = {}; t.buff = {}; this.status.refresh(); await BLog.add(`[r]${t.name}は たおれた！[/]`); }
  },
  async finish(r) {
    if (r === 'lose') {
      BLog.clear(); Snd.stop(0.3);
      await BLog.add(`{name}たちは 全滅してしまった……`, 60);
      return 'lose';
    }
    const exp = this.en.reduce((a, e) => a + e.E.exp, 0), gold = this.en.reduce((a, e) => a + e.E.gold, 0);

    await BLog.add(this.boss ? `${this.en[0].E.name}を たおした！` : '魔物の むれを やっつけた！', 20);
    if (exp) await BLog.add(`それぞれ [y]${exp}[/]ポイントの けいけんちを かくとく！`, 20);
    if (gold) { G.gold += gold; await BLog.add(`[y]${gold}ゴールド[/]を 手に入れた！`, 20); }
    for (const e of this.en) if (e.E.drop && chance(e.E.drop[1])) { addItem(e.E.drop[0]); Snd.fx('item'); await BLog.add(`${e.E.name}は [y]${itemName(e.E.drop[0])}[/]を 落としていった！`, 24); }
    for (const m of G.party) {
      const ups = gainExp(m, exp);
      for (const u of ups) {
        BLog.clear(); Snd.jingle('levelup'); this.status.refresh();
        this.status.fx(this.partyIdx(m), 'heal');
        await BLog.add(`[y]${m.name}は レベル ${u.lv}に あがった！[/]`, 20);
        const d = u.d, parts = [];
        if (d.hp) parts.push(`HP+${d.hp}`); if (d.mp) parts.push(`MP+${d.mp}`); if (d.str) parts.push(`力+${d.str}`); if (d.def) parts.push(`守備+${d.def}`); if (d.mag) parts.push(`魔力+${d.mag}`); if (d.spd) parts.push(`素早さ+${d.spd}`);
        await BLog.add(parts.join('  '), 30);
        for (const s of u.skills) { Snd.fx('buff'); await BLog.add(`[g]${m.name}は ${SKILLS[s].name}を おぼえた！[/]`, 30); }

    }
    await waitKeyOrTime(90);
    return 'win';
  },

  /* ---------- effects ---------- */
  async fxSlash(t, miss) {
    const [cx, cy] = this.enemyCenter(t);
    const f = { life: 10, draw: (c, k) => { c.strokeStyle = miss ? 'rgba(255,255,255,.5)' : '#fff'; c.lineWidth = 2; const p = 1 - k / 10; c.beginPath(); c.moveTo(cx - 22, cy - 22); c.lineTo(cx - 22 + 44 * Math.min(1, p * 2), cy - 22 + 44 * Math.min(1, p * 2)); c.stroke(); if (p > 0.4) { c.beginPath(); c.moveTo(cx + 18, cy - 24); c.lineTo(cx + 18 - 40 * Math.min(1, (p - 0.4) * 2.5), cy - 24 + 44 * Math.min(1, (p - 0.4) * 2.5)); c.stroke(); } } };
    this.fx.push(f); await wait(10);
  },
  async fxSpell(kind, tg, quick) {
    if (!tg.length) return;
    Snd.fx(kind === 'meteor' ? 'meteor' : kind);
    const fxs = [];
    if (kind === 'fire') { for (const t of tg) fxs.push(particles(t, ['#ff5a1a', '#ffb03a', '#fff2a0', '#d02a10'], 36, { vy: [-2.4, -0.6], vx: [-1, 1], life: 34, g: -0.02, from: 'bottom' })); this.fx.push(tint('rgba(255,90,20,', 26, 0.22)); }
    else if (kind === 'ice') { for (const t of tg) fxs.push(shards(t)); this.fx.push(tint('rgba(150,220,255,', 26, 0.25)); }
    else if (kind === 'thunder') { for (const t of tg) fxs.push(bolt(t)); flash('#fffbe0', 8, 0.7); }
    else if (kind === 'light') { for (const t of tg) fxs.push(beam(t, '#fff6c8')); for (const t of tg) fxs.push(particles(t, ['#ffffff', '#fff2a0', '#ffe070'], 20, { vy: [-1.6, -0.3], vx: [-0.6, 0.6], life: 30, from: 'mid' })); }
    else if (kind === 'meteor') { for (const t of tg) fxs.push(meteor(t)); }
    else if (kind === 'sleep') { for (const t of tg) fxs.push(zzz(t)); }
    for (const f of fxs) this.fx.push(f);
    await wait(quick ? 16 : kind === 'meteor' ? 44 : 30);
    if (kind === 'meteor') { shake(); flash('#ffd0a0', 12, 0.6); await wait(10); }
  },
  async fxDawn() { Snd.fx('light'); await flash('#fff0c0', 24, 0.9); },
  async fxEnemySpell(el) {
    const col = el === 'fire' ? 'rgba(255,80,20,' : el === 'ice' ? 'rgba(140,210,255,' : el === 'water' ? 'rgba(40,120,255,' : 'rgba(90,20,140,';
    Snd.fx(el === 'fire' ? 'breath' : el === 'ice' ? 'ice' : el === 'water' ? 'breath' : 'dark');
    this.fx.push(tint(col, 30, 0.45));
    this.fx.push(wave(col));
    await wait(24);
  },
  update() {
    this.t++;
    if (R3.ok && B3.scene) B3.update(this.en, this.focus);
    for (const e of this.en) { if (e.flash > 0) e.flash--; else if (e.flash < 0) e.flash++; if (e.shake > 0) e.shake--; }
    for (const f of this.fx) { f.k = (f.k || 0) + 1; if (f.step) f.step(f.k); }
    this.fx = this.fx.filter(f => f.k < f.life);
  },
  draw(c) {
    const d3 = R3.ok && B3.scene;
    if (d3) B3.render(); else c.drawImage(battleBg(this.opt.bg || 'plain'), 0, 0);
    for (const e of this.en) {
      if (e.dead) continue;
      if (d3) { if (e.st.sleep && this.t % 60 < 40) { c.fillStyle = '#bcd8ff'; c.font = '8px sans-serif'; c.fillText('z', e.x + e.w - 6, e.y + 6 - (this.t % 60) / 10); } continue; }
      const fl = FLOATERS.has(e.E.art) ? Math.round(Math.sin(this.t / 14 + e.x) * 2) : 0;

        const sq = 1 - e.dying; c.drawImage(e.art.img, x - sq * 4, y + sq * e.h * 0.2, e.w + sq * 8, e.h * (1 - sq * 0.2));

      c.globalAlpha = 1;
      if (e.flash > 0 && e.flash % 4 < 2) c.drawImage(e.art.white, x, y, e.w, e.h);
      if (e.st.sleep && this.t % 60 < 40) { c.fillStyle = '#bcd8ff'; c.font = '8px sans-serif'; c.fillText('z', x + e.w - 6, y + 6 - (this.t % 60) / 10); }

      const e = this.cursor, b = Math.round(Math.sin(this.t / 5) * 2);

      c.fillStyle = '#ffbf5a'; c.beginPath(); c.moveTo(cx - 5, cy - 7); c.lineTo(cx + 5, cy - 7); c.lineTo(cx, cy); c.fill();

};
function physDmg(atk, def, mult = 1) { let b = atk * 0.5 - def * 0.25; const mn = atk * 0.06; if (b < mn) b = mn; return Math.max(1, Math.round(b * mult * rnd(0.85, 1.15))); }
async function waitKeyOrTime(n) { for (let i = 0; i < n; i++) { await wait(1); if (In.pressed('a') || UI.tapped()) return; } }

/* effect factories (logical px, drawn in battle) */
function particles(t, cols, n, o) {
  const ps = []; for (let i = 0; i < n; i++) { const x = t.x + t.w * (0.2 + Math.random() * 0.6); const y = o.from === 'bottom' ? t.y + t.h * (0.7 + Math.random() * 0.3) : t.y + t.h * (0.3 + Math.random() * 0.4); ps.push({ x, y, vx: rnd(o.vx[0], o.vx[1]), vy: rnd(o.vy[0], o.vy[1]), c: pick(cols), s: irnd(1, 3), d: irnd(0, 12) }); }
  return { life: o.life + 12, draw(c, k) { for (const p of ps) { const kk = k - p.d; if (kk < 0 || kk > o.life) continue; const a = 1 - kk / o.life; c.globalAlpha = a; c.fillStyle = p.c; c.fillRect(p.x + p.vx * kk, p.y + p.vy * kk + (o.g || 0) * kk * kk, p.s, p.s); } c.globalAlpha = 1; } };
}
function sparkles(t, col) { return particles(t, [col, '#ffffff'], 18, { vy: [-1.2, -0.4], vx: [-0.4, 0.4], life: 30, from: 'mid' }); }
function tint(col, life, a) { return { life, draw(c, k) { c.fillStyle = col + (a * Math.sin(Math.PI * k / life)).toFixed(3) + ')'; c.fillRect(0, 0, W, H); } }; }
function wave(col) { return { life: 30, draw(c, k) { c.fillStyle = col + '0.5)'; const x = -60 + k * 12; c.fillRect(x, 40, 60, 120); c.fillStyle = col + '0.25)'; c.fillRect(x - 40, 40, 40, 120); } }; }
function shards(t) {
  const [cx, cy] = [t.x + t.w / 2, t.y + t.h / 2]; const ss = []; for (let i = 0; i < 12; i++) { const a = Math.random() * Math.PI * 2, r = rnd(30, 50); ss.push({ a, r, d: irnd(0, 8) }); }
  return { life: 34, draw(c, k) { for (const s of ss) { const kk = k - s.d; if (kk < 0) continue; const p = Math.min(1, kk / 18); const r = s.r * (1 - p); const x = cx + Math.cos(s.a) * r, y = cy + Math.sin(s.a) * r; c.fillStyle = kk > 18 ? 'rgba(255,255,255,' + (1 - (kk - 18) / 14) + ')' : '#bfe8ff'; c.beginPath(); c.moveTo(x, y - 4); c.lineTo(x + 2, y); c.lineTo(x, y + 4); c.lineTo(x - 2, y); c.fill(); } if (k > 18 && k < 26) { c.fillStyle = 'rgba(220,245,255,.5)'; c.beginPath(); c.arc(cx, cy, (k - 18) * 4, 0, 7); c.fill(); } } };
}
function bolt(t) {
  const cx = t.x + t.w / 2, cy = t.y + t.h / 2; let pts = [];
  const gen = () => { pts = [[cx + rnd(-10, 10), 0]]; for (let y = 16; y < cy; y += 14) pts.push([cx + rnd(-12, 12), y]); pts.push([cx, cy]); };
  gen();
  return { life: 26, draw(c, k) { if (k % 6 === 0) gen(); if (k % 8 > 5) return; c.strokeStyle = '#fff8c0'; c.lineWidth = 3; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke(); c.strokeStyle = '#ffffff'; c.lineWidth = 1; c.stroke(); } };
}
function beam(t, col) { const cx = t.x + t.w / 2; return { life: 30, draw(c, k) { const a = Math.sin(Math.PI * k / 30); const w = 6 + 14 * a; const g = c.createLinearGradient(cx - w, 0, cx + w, 0); g.addColorStop(0, 'rgba(255,246,200,0)'); g.addColorStop(0.5, `rgba(255,250,220,${a})`); g.addColorStop(1, 'rgba(255,246,200,0)'); c.fillStyle = g; c.fillRect(cx - w, 0, w * 2, t.y + t.h); } }; }
function meteor(t) {
  const cx = t.x + t.w / 2, cy = t.y + t.h * 0.6; const rocks = [0, 8, 16].map(d => ({ d, ox: rnd(-16, 16) }));
  return { life: 56, draw(c, k) { for (const r of rocks) { const kk = k - r.d; if (kk < 0) continue; if (kk < 28) { const p = kk / 28; const x = cx + r.ox - 120 * (1 - p), y = cy - 160 * (1 - p); c.fillStyle = '#ffb04a'; c.beginPath(); c.arc(x, y, 6, 0, 7); c.fill(); c.fillStyle = '#7a3a1a'; c.beginPath(); c.arc(x, y, 4, 0, 7); c.fill(); c.fillStyle = 'rgba(255,160,60,.4)'; c.fillRect(x - 22, y - 30, 16, 8); } else if (kk < 40) { c.fillStyle = `rgba(255,200,120,${1 - (kk - 28) / 12})`; c.beginPath(); c.arc(cx + r.ox, cy, (kk - 28) * 3, 0, 7); c.fill(); } } } };
}
function zzz(t) { return { life: 40, draw(c, k) { c.fillStyle = '#c8d8ff'; c.font = 'bold 9px sans-serif'; for (let i = 0; i < 3; i++) { const kk = k - i * 8; if (kk < 0) continue; c.globalAlpha = Math.max(0, 1 - kk / 32); c.fillText('Z', t.x + t.w / 2 + i * 6 - 6, t.y + t.h / 3 - kk * 0.8); } c.globalAlpha = 1; } }; }

// mailto link for reporting a mistake in one question (no personal data, only the question)
function egReportUrl(Q, C) {
  const tx = h => String(h || '').replace(/<span class="qb"><\/span>/g, ' ____ ').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\s+/g, ' ').trim();
  const id = Q.id || (Q.key + (Q.dir != null ? '#' + Q.dir : ''));
  const lines = ['【問題ID】' + id, '【分野】' + EG_CATS[Q.cat].n, '【問題】' + (Q.qtext || tx(Q.prompt) + (Q.sub ? ' ' + tx(Q.sub) : '')).slice(0, 300),
    '【選択肢】' + Q.opts.map((o, i) => (i + 1) + '. ' + o.t).join(' / '), '【正解とされた答え】' + (Q.ans + 1) + '. ' + Q.opts[Q.ans].t,
    C ? '【選んだ答え】' + C.t : '', '', '【気づいた点】（ここに書いてください）', ''].filter((l, i, a) => l !== '' || i >= a.length - 3);
  return 'mailto:' + EG_MAIL + '?subject=' + encodeURIComponent('［灯守の旅路 英語の章］問題の誤りの報告 ' + id) + '&body=' + encodeURIComponent(lines.join('\n'));
}

 "主催者から参加者へのお願いです。if you can't ＿＿ tomorrow's event（もし明日の行事に＿＿できないなら）とあります。行事に対してすることなので attend（出席する）です。","明日の行事に出席できない場合はお知らせください。","似た形の単語が並んだら、後ろの言葉（ここでは event）と自然につながるかで選びます。"),
EG_Q('v16','v_recommend',1,"Can you ____ a good restaurant near here?",["recommend","remain","receive","reduce"],
 ["「すすめる」。この近くのよいお店を教えて、という意味になります。","「残る」。後ろに「何を」を置かない言葉で、レストランをそのまま続けられません。","「受け取る」。レストランを受け取る、では意味が通りません。","「減らす」。よいレストランを減らして、では意味が合いません。"],
 "相手に頼みごとをしている文です。a good restaurant near here（この近くのよいレストラン）について、相手にしてほしいことが空欄に入ります。よいお店を教えてほしいので recommend（すすめる）です。","この近くでおすすめのレストランはありますか？","good（よい）が付いた物について頼んでいたら、recommend を考えます。"),
EG_Q('v17','v_recommend',2,"The doctor ____ more sleep and less coffee.",["recommended","received","refused","reached"],
 ["「すすめた」。医者が体に良いことをすすめる場面に合います。","「受け取った」。睡眠とコーヒーを受け取った、では意味が通りません。","「断った」。医者が睡眠を断る、では話がおかしくなります。","「届いた・たどり着いた」。場所や目標に使う言葉です。"],
 "医者（The doctor）が、睡眠を増やしてコーヒーを減らすことについて何かをした文です。医者が患者に良いことを伝えたので、recommended（すすめた）です。","医者は、睡眠を増やしてコーヒーを減らすようにすすめた。","誰が言っているか（ここでは医者）を見ると、どんな動作が自然か判断できます。"),
EG_Q('v18','v_recommend',3,"This book comes highly ____.",["recommended","recommend","recommending","recommendation"],
 ["come highly recommended で「強くすすめられている・評判が良い」。本はすすめられる側なので -ed の形です。","recommend は「すすめる」動作の形で、comes highly の後ろには置けません。","recommending だと本が人に何かをすすめていることになり、立場が逆です。","recommendation は名詞（物事の名前）で、highly（とても）の後ろのこの位置には置けません。"],
 "この本（This book）について評判を言っている文です。本は自分で何かをすすめるのではなく、人から「すすめられる」側です。そのため「～される」を表す recommended を使います。","この本はとても評判が良い（強くすすめられている）。","主語が「する側」か「される側」かを確かめ、される側なら -ed の形を考えます。"),

EG_Q('g1','g_be',1,"My brother ____ a nurse.",["is","are","am","does"],
 ["主語の My brother は1人なので is です。","are は you や、2人以上・2つ以上のときに使います。","am は I（私）のときだけ使います。","does は「する」系の動詞の疑問文などで使う言葉で、「～です」の意味はありません。"],
 "主語、つまり「誰が」に当たるのは My brother（私の兄・弟）です。後ろの a nurse（看護師）と「兄は看護師だ」という関係なので、「～です」を表す be動詞を使います。兄は1人なので is です。","私の兄（弟）は看護師です。","まず主語が I か、you や2人以上か、それ以外の1人・1つかを確認します。"),
EG_Q('g2','g_be',1,"They ____ in the library now.",["are","is","be","do"],
 ["They（彼ら）は2人以上なので are です。","is は1人・1つのときに使います。","be はそのままの形で、主語のすぐ後ろには置けません。","do は「する」系の言葉で、「いる」の意味はありません。"],
 "主語は They（彼ら）で、2人以上です。in the library now（今、図書館に）は場所なので、「～にいる」を表す be動詞が入ります。2人以上なので are です。","彼らは今、図書館にいます。","後ろが場所や状態なら be動詞。主語の人数で is・am・are を決めます。"),
EG_Q('g3','g_be',1,"I ____ very busy today.",["am","is","are","do"],
 ["主語が I なので am です。","is は I と you 以外の1人・1つのときです。","are は you や2人以上のときです。","do は「する」系の言葉で、busy（忙しい）の前には置けません。"],
 "主語は I（私）です。very busy（とても忙しい）は状態を表すので、「～です」の be動詞が入ります。I には am を使います。","私は今日とても忙しいです。","主語が I なら am。迷ったら主語から確認します。"),
EG_Q('g4','g_3s',1,"She ____ to work by bus every day.",["goes","go","going","gone"],
 ["主語が She（彼女1人）で、毎日の習慣なので goes です。","go は I・you・2人以上のときの形です。","going だけでは文の動詞になれません。is going のように be動詞が必要です。","gone は過去分詞で、has gone のように have と一緒に使います。"],
 "主語は She（彼女）で、I と you 以外の1人です。every day（毎日）とあるので、今の習慣の話です。この条件では動詞に s や es を付けるので、go は goes になります。","彼女は毎日バスで仕事に行きます。","主語が he・she・人の名前などの1人で、every ～ のような習慣の合図があれば s を付けます。"),
EG_Q('g5','g_3s',1,"My father ____ coffee every morning.",["drinks","drink","drinking","to drink"],
 ["主語の My father は1人で、毎朝の習慣なので drinks です。","drink は I・you・2人以上のときの形です。","drinking だけでは文の動詞になれません。","to drink は「飲むこと・飲むために」で、文の中心の動詞にはなれません。"],
 "主語は My father（私の父）で1人です。every morning（毎朝）から、今の習慣の話だと分かります。だから drink に s を付けた drinks です。","父は毎朝コーヒーを飲みます。","主語のすぐ後ろの空欄では、主語が1人かどうかで s を判断します。"),
EG_Q('g6','g_3s',1,"Ken ____ English very well.",["speaks","speak","speaking","is speak"],
 ["主語の Ken は1人で、いつもの能力を言っているので speaks です。","speak は I・you・2人以上のときの形です。","speaking だけでは文の動詞になれません。","is と speak を並べることはできません。is speaking なら「話しているところ」になります。"],
 "主語は Ken（ケン）で1人です。very well（とても上手に）から、いつも英語を上手に話せる、という今の事実を言っています。だから speak に s を付けた speaks です。","ケンは英語をとても上手に話します。","人の名前が主語のときも、he・she と同じように s を付けます。"),
EG_Q('g7','g_past',1,"We ____ a movie last night.",["watched","watch","watches","will watch"],
 ["last night（昨夜）は終わった時なので過去形です。","watch は今のことや習慣を表す形です。","watches は主語が1人のときの今の形で、We には使いません。","will watch はこれからのことです。昨夜とは合いません。"],
 "主語は We（私たち）。last night（昨夜）が、もう終わった時を表しています。だから動詞は過去形の watched（見た）です。","私たちは昨夜、映画を見ました。","文の最後にある時の言葉（last ～、yesterday、～ ago）を最初に確認します。"),
EG_Q('g8','g_past',2,"I ____ to Kyoto two years ago.",["went","go","have gone","will go"],
 ["two years ago（2年前）は過去なので went です。","go は今のことや習慣の形です。","have gone は今とつながる言い方で、ago（～前）とは一緒に使えません。","will go はこれからのことです。"],
 "主語は I（私）。two years ago（2年前）は、はっきり終わった時です。go の過去形は went です。ago があるときは、have＋過去分詞（今とつながる言い方）は使いません。","私は2年前に京都へ行きました。","ago があれば過去形。have＋過去分詞の選択肢は外します。"),
EG_Q('g9','g_past',1,"She ____ the email yesterday.",["sent","sends","send","will send"],
 ["yesterday（昨日）なので過去形。send の過去形は sent です。","sends は今のことや習慣を表す形です。","send は今の形です。","will send はこれからのことです。"],
 "主語は She（彼女）。yesterday（昨日）は終わった時なので過去形を選びます。send（送る）は形が変わる動詞で、過去形は sent です。","彼女は昨日そのメールを送りました。","yesterday を見たら過去形。形が変わる動詞（send → sent）にも注意します。"),
EG_Q('g10','g_inf_ger',2,"I enjoy ____ with my friends.",["talking","to talk","talk","talked"],
 ["enjoy の後ろの動作は ～ing の形です。","to talk は enjoy の後ろには使いません。","talk のままでは、enjoy と動詞が2つ並んでしまいます。","talked は過去形で、enjoy の後ろには置けません。"],
 "主語は I（私）、enjoy（楽しむ）が中心の動詞です。何を楽しむかが空欄に入ります。enjoy の後ろに動作を続けるときは ～ing の形と決まっているので talking（話すこと）です。","私は友達と話すのが楽しいです。","空欄の前の動詞（enjoy・finish など）を見て、～ing を取る動詞か確認します。"),
EG_Q('g11','g_inf_ger',2,"We decided ____ a new car.",["to buy","buying","buy","bought"],
 ["decide は to＋動詞の原形を続けて「～することに決める」。","buying は decide の後ろでは使いません。","buy のままでは、decided と動詞が2つ並んでしまいます。","bought は過去形で、decided の後ろには置けません。"],
 "主語は We（私たち）、decided（決めた）が中心の動詞です。決めた内容はこれからする動作なので、to＋動詞の原形の to buy（買うこと）を使います。","私たちは新しい車を買うことに決めた。","decide・want・hope のように「これからのこと」を考える動詞なら、to＋動詞の原形です。"),
EG_Q('g12','g_inf_ger',3,"Please remember ____ the door when you leave.",["to lock","locking","lock","locked"],
 ["remember to lock は「これから忘れずに鍵をかける」。","remember locking は「前に鍵をかけたことを覚えている」で、出かけるときのお願いには合いません。","lock のままでは、remember と動詞が2つ並んでしまいます。","locked は過去形で、remember の後ろにこの形では置けません。"],
 "相手へのお願いです。when you leave（出かけるとき）とあるので、鍵をかけるのはこれから先のことです。remember は、これからのことなら to＋動詞の原形、もう済んだことなら ～ing を使います。","出かけるときは忘れずにドアの鍵をかけてね。","remember・stop・try を見たら、その動作が「これから」か「すでに」かを確かめます。"),
EG_Q('g13','g_inf_ger',3,"He stopped ____ to answer the phone.",["walking","to walk","walk","walked"],
 ["stop walking で「歩くのをやめる」。電話に出るために足を止めた、という意味になります。","stopped to walk は「歩くために立ち止まった」。電話に出る、という後ろの部分と合いません。","walk のままでは、stopped と動詞が2つ並んでしまいます。","walked は過去形で、stopped の後ろにこの形では置けません。"],
 "主語は He（彼）。後ろの to answer the phone（電話に出るために）が、止まった目的です。やめた動作は「歩くこと」なので walking。stop の後ろの ～ing は「やめた動作」、to ～ は「止まった目的」です。","彼は電話に出るために歩くのをやめた。","stop の後ろでは、やめたこと（～ing）と、止まった目的（to ～）を分けて考えます。"),
EG_Q('g14','g_perfect',2,"I have ____ this movie three times.",["seen","saw","see","seeing"],
 ["have の後ろは過去分詞。see の過去分詞は seen です。","saw は過去形で、have の後ろには置けません。","see は今の形で、have の後ろには置けません。","seeing は have の後ろにこの形では置けません。"],
 "主語は I（私）。three times（3回）とあるので、「今までに3回見たことがある」という経験の話です。経験は have＋過去分詞で表すので、seen を使います。","私はこの映画を3回見たことがあります。","have・has の後ろの空欄は、過去分詞（seen・been など）の形を探します。"),
EG_Q('g15','g_perfect',2,"She has lived in Osaka ____ 2019.",["since","for","from","ago"],
 ["since は「～以来」。始まった時点（2019年）を示します。","for は「～の間」で、for five years のように長さに使います。","from は始まりを表しますが、has lived のような今まで続く言い方とはふつう一緒に使いません。","ago は「～前」で、年の数字の前には置けません。"],
 "主語は She（彼女）。has lived（ずっと住んでいる）は、過去から今まで続いていることを表します。2019 は住み始めた時点なので、since（～以来）を使います。","彼女は2019年からずっと大阪に住んでいます。","後ろが始まった時点なら since、長さなら for を選びます。"),
EG_Q('g16','g_perfect',2,"Have you ever ____ to Okinawa?",["been","went","go","going"],
 ["have been to ～ で「～に行ったことがある」。","went は過去形で、have の後ろには置けません。","go は今の形で、have の後ろには置けません。","going は have の後ろにこの形では置けません。"],
 "相手に ever（今までに）を使って経験を聞いています。経験は have＋過去分詞です。「～に行ったことがある」は have been to ～ の形で表すので been です。","沖縄に行ったことはありますか？","Have you ever を見たら過去分詞を探します。行った経験なら been to です。"),
EG_Q('g17','g_passive',1,"This bridge was ____ in 1950.",["built","build","building","builds"],
 ["was built で「建てられた」。橋は建てられる側です。","build は今の形で、was の後ろには置けません。","was building だと「橋が何かを建てていた」ことになり、立場が逆です。","builds は今の形で、was の後ろには置けません。"],
 "主語は This bridge（この橋）です。橋は自分で何かを建てるのではなく、人に建てられる側です。「～された」は be動詞＋過去分詞で表すので、was built です。","この橋は1950年に建てられました。","主語が「する側」か「される側」かを考え、される側なら be動詞＋過去分詞です。"),
EG_Q('g18','g_passive',2,"English is ____ in many countries.",["spoken","speaking","speak","spoke"],
 ["is spoken で「話されている」。英語は話される側です。","is speaking だと「英語が話している」ことになり、意味が逆です。","speak は今の形で、is の後ろには置けません。","spoke は過去形で、is の後ろには置けません。"],
 "主語は English（英語）です。英語は人が話すもので、英語自身は話しません。だから「話されている」を表す is spoken です。","英語は多くの国で話されています。","主語が物や言葉なら、「される側」ではないかを先に考えます。"),
EG_Q('g19','g_passive',2,"The meeting will be ____ in Room B.",["held","hold","holding","holds"],
 ["will be held で「開かれる」。会議は開かれる側です。","hold は動詞の原形で、will be の後ろには置けません。","will be holding だと「会議が何かを開いている」ことになり、立場が逆です。","holds は今の形で、will be の後ろには置けません。"],
 "主語は The meeting（会議）です。会議は自分で何かを開くのではなく、人に開かれる側です。hold（開く）の過去分詞 held を使い、will be held（開かれる予定だ）になります。","会議はB会議室で開かれます。","will be の後ろの空欄は、される側なら過去分詞を選びます。"),
EG_Q('g20','g_rel',2,"I have a friend ____ lives in Canada.",["who","which","where","what"],
 ["a friend（人）を後ろから説明するので who です。","which は物を説明するときに使います。","where は場所を説明するときに使います。friend は場所ではありません。","what は、前に説明される名詞があるときには使いません。"],
 "「私には友達がいる」と言った後、その友達がどんな人かを説明しています。空欄の後ろの lives in Canada（カナダに住んでいる）が友達の説明です。説明される a friend は人なので who を使います。","私にはカナダに住んでいる友達がいます。","空欄のすぐ前の名詞が、人か・物か・場所かを確認します。"),
EG_Q('g21','g_rel',2,"This is the book ____ I bought yesterday.",["which","who","where","what"],
 ["the book（物）を後ろから説明するので which です（that も使えます）。","who は人を説明するときに使います。","where は、後ろの文がすべてそろっているときに使います。bought（買った）の「何を」が抜けているので合いません。","what は、前に説明される名詞があるときには使いません。"],
 "「これは本です」と言った後、どんな本かを説明しています。I bought yesterday（私が昨日買った）が本の説明で、買った「何を」に当たるのが the book です。物なので which を使います。","これは私が昨日買った本です。","空欄の前の名詞が物なら which。後ろの文に「何を」が抜けているかも確かめます。"),
EG_Q('g22','g_rel',2,"The woman ____ is talking to Tom is my teacher.",["who","which","whose","where"],
 ["The woman（人）を説明し、空欄が「誰が」の役目をするので who です。","which は物を説明するときに使います。","whose は「その人の」という意味で、whose bag のように後ろに名詞が必要です。","where は場所を説明するときに使います。"],
 "文の中心は The woman … is my teacher.（その女性は私の先生です）。その間の ＿＿ is talking to Tom（トムと話している）が女性の説明です。空欄は「誰が話しているか」の「誰が」に当たり、人なので who です。","トムと話している女性は私の先生です。","空欄のすぐ後ろに動詞（is talking）が来たら、空欄が「誰が・何が」の役目です。"),
EG_Q('g23','g_where',3,"This is the hall ____ the interview will be held.",["where","which","who","what"],
 ["後ろの文は「何が・どうされる」までそろっていて、足りないのは「どこで」だけなので where です。","which を使うなら、後ろの文に「何を」などの抜けが必要です。ここは抜けていません。","who は人を説明するときに使います。hall は建物です。","what は、前に説明される名詞があるときには使いません。"],
 "「これはホールです」と言った後、どんなホールかを説明しています。後ろの the interview will be held では、the interview が「何が」、will be held が「行われる」に当たり、文として完成しています。足りない情報は「そこで」という場所なので where です。","ここが面接の行われるホールです。","空欄の後ろの文に抜けている部分があるかを、最初に確認します。抜けがなければ where です。"),
EG_Q('g24','g_where',3,"That's the park ____ we played soccer as kids.",["where","which","who","whose"],
 ["we played soccer（私たちがサッカーをした）で文がそろっているので where（そこで）です。","which なら、played の後ろの「何を」が抜けている必要があります。ここには soccer があります。","who は人を説明するときに使います。","whose は「その～の」で、後ろに名詞が必要です。"],
 "公園（the park）について説明している文です。後ろの we played soccer as kids は、「私たちが」「サッカーを」「した」がそろった文です。足りないのは「その公園で」という場所なので where です。","あれが、子どもの頃にサッカーをした公園です。","後ろの動詞の「何を」がそろっているかを見ます。そろっていれば where です。"),
EG_Q('g25','g_where',3,"This is the town ____ I visited last summer.",["which","where","who","what"],
 ["visited（～を訪れた）の「どこを」が抜けていて、それが the town なので which です。","where は後ろの文がそろっているときに使います。visited の後ろが足りません。","who は人を説明するときに使います。","what は、前に説明される名詞があるときには使いません。"],
 "町（the town）について説明している文です。後ろの I visited last summer では、visit（訪れる）の「どこを」に当たる言葉がありません。その抜けている部分が the town なので which を使います。場所の名詞でも、いつも where になるわけではありません。","ここは私が去年の夏に訪れた町です。","前の名詞が場所でも、後ろの文に「何を」が抜けていれば which です。"),

EG_Q('i1','i_lookforward',2,"I'm looking forward to ____ you.",["seeing","see","saw","be seen"],
 ["look forward to の to は前置詞なので、後ろの動作は ～ing です。","to see は「会うために」などで使う形ですが、この熟語の to の後ろには置けません。","saw は過去形で、to の後ろには置けません。","be seen は「見られる」で、意味も形も合いません。"],

Object.assign(EG_KN, {
 g_if:{cat:'grammar',t:'仮定法（もし～なら）',l:'今の事実と違うことを「もし～なら」と想像するときは、if の文の動詞を過去形にし、後ろは would＋動詞の原形 にします。If I had time, I would go.（時間があれば行くのに＝実際は時間がない）。過去の事実と違うことなら、if の文を had＋過去分詞、後ろを would have＋過去分詞 にします。I wish の後ろも同じ考え方で、今の願いなら過去形を使います。'},
 g_part:{cat:'grammar',t:'分詞構文（～して、～なので）',l:'文の頭に ～ing や過去分詞を置いて「～して」「～なので」と理由や状況を短く表す形です。カンマの後ろの主語（「誰が・何が」）が、その動作を「する側」なら ～ing、「される側」なら過去分詞にします。Feeling tired, she went to bed.（疲れを感じたので、彼女は寝た）'},
 g_inv:{cat:'grammar',t:'倒置（Never / Not only が先頭）',l:'Never（一度も～ない）や Not only（～だけでなく）など否定の言葉を文の先頭に置くと、その後ろは疑問文と同じ語順になります。Never have I seen ～.／Not only was he late, ～. 強調したいときの形で、普通の語順に戻すと I have never seen ～. です。'},
 g_what:{cat:'grammar',t:'what と why（関係詞の発展）',l:'what は「～すること・～なもの」という意味で、前に名詞を置かずに使います。What he said（彼が言ったこと）。reason（理由）の後ろで「～する理由」と説明するときは why を使います。the reason why I left（私が辞めた理由）。'},
 g_agree:{cat:'grammar',t:'主語と動詞の一致',l:'動詞の形は、文の中心の主語（「誰が・何が」）に合わせます。Each of the students は「学生のそれぞれ」で中心は each（1人ずつ）なので has。The number of ～ は「～の数」で中心は number（1つの数）なので is。of の後ろの複数形にまどわされないことが大切です。'},
 g_cause:{cat:'grammar',t:'使役（have / make＋人・物＋形）',l:'「～してもらう・させる」は have や make の後ろに「人・物」と動作を続けます。人が自分で動作するなら動詞の原形（make him write）、物が「される側」なら過去分詞（have my car repaired＝車を修理してもらう）。make の後ろに to は付けません。'},
 g_pos:{cat:'grammar',t:'空欄に入る品詞を見分ける',l:'選択肢に同じ語の形違い（responsible / responsibility / responsibly）が並んだら、意味より先に空欄の役割を見ます。be動詞の後ろで主語の状態を言うなら形容詞（人や物の様子を表す言葉）、a や the の後ろなら名詞（物事の名前）、動詞を説明するなら副詞です。'},
 g_prep:{cat:'grammar',t:'前置詞と接続詞の使い分け',l:'空欄の後ろが名詞のまとまり（the heavy rain など）なら前置詞（due to, despite など）、主語と動詞がある文（it rained など）なら接続詞（because, although など）を使います。期限の「～までに」は by、継続の「～までずっと」は until です。'}
});

 "yesterday（昨日）は過去を表す言葉です。過去の時を表す言葉があれば、動詞は過去形にします。現在完了（have＋過去分詞）は「今とつながる」形なので、yesterday とは一緒に使えません。","その荷物は昨日の午後に届いた。","yesterday・last ～・～ ago があれば過去形です。現在完了とは一緒に使いません。"),
EG_Q('g48','g_tense',2,"If it ____ tomorrow, the picnic will be canceled.",["rains","will rain","rained","raining"],
 ["if（もし～なら）の文の中は、未来のことでも現在形を使うので rains です。","if の文の中では、未来のことでも will を使わないのが普通です。","rained は過去形で tomorrow と合いません（今の事実と違う想像なら、後ろは would になります）。","raining だけでは動詞になりません。is raining のように be動詞が必要です。"],
 "「もし明日雨なら」は実際に起こりうる条件です。時や条件を表す if・when の文の中は、未来のことでも現在形にします。主語が it（1つ）なので s を付けて rains です。","明日雨が降れば、ピクニックは中止になる。","if・when の文の中に tomorrow があっても、will ではなく現在形を使います。"),
EG_Q('g49','g_conj',2,"____ the weather was bad, the event was a success.",["Although","Because","Despite","However"],
 ["「天気は悪かった」と「成功した」は逆の内容なので、「～だけれども」の Although です。","Because は理由です。「天気が悪かったので成功した」では意味が通りません。","Despite（～にもかかわらず）は前置詞で、後ろに主語と動詞のある文（the weather was）を置けません。","However は「しかし」で、文と文をカンマ1つでつなぐことはできません。"],
 "前半「天気が悪かった」と後半「イベントは成功だった」は逆の内容です。空欄の後ろは主語 the weather＋動詞 was のある文なので、接続詞の Although を使います。Despite も意味は近いですが、Despite the bad weather のように後ろに名詞を置く前置詞です。","天気は悪かったが、イベントは成功した。","意味で2つに絞ったら、後ろが文か名詞かで接続詞と前置詞を見分けます。"),
EG_Q('g50','g_conj',3,"____ you have finished the test, you may leave the room.",["Once","Until","Unless","Whether"],
 ["Once は「いったん～したら」。テストを終えたら退室してよい、で意味が通ります。","Until は「～までずっと」。「終えるまで退室してよい」では逆の意味になります。","Unless は「～しない限り」。「終えない限り退室してよい」では意味が通りません。","Whether は「～かどうか」で、この形で条件をつなぐのは不自然です。"],
 "「テストを終えたら、退室してかまいません」という文です。once は接続詞（文と文をつなぐ言葉）として使うと「いったん～したら・～するとすぐ」という意味になります。","テストを終えたら、退室してかまいません。","Once＋文 は「～したら」。once（一度）という意味の使い方と区別します。"),
EG_Q('g51','g_conj',3,"The order will not be shipped ____ payment is received.",["unless","if","because","although"],
 ["unless は「～しない限り」。代金を受け取らない限り発送しない、で意味が通ります。","if だと「代金を受け取ったら発送しない」となり、逆の意味です。","because だと「受け取ったから発送しない」となり、意味が通りません。","although だと「受け取ったけれども発送しない」となり、不自然です。"],
 "will not be shipped（発送されない）という否定の文に、「代金が届かない限り」という条件をつなぐので unless が合います。unless は if ～ not（もし～しなければ）とほぼ同じ意味です。","代金を受け取らない限り、注文品は発送されません。","否定の文＋条件 なら、unless（～しない限り）を当てはめてみます。"),
EG_Q('g52','g_prep',1,"The store is open ____ 9 a.m. to 8 p.m.",["from","by","at","since"],
 ["from A to B で「AからBまで」。営業時間の始まりと終わりを示します。","by は「～までに」という期限で、to と組み合わせません。","at は「～時に」と一点を示す言葉で、to と組み合わせても範囲になりません。","since は「～以来ずっと」で、現在完了と一緒に使うのが普通です。"],
 "空欄の先に to 8 p.m. があるので、from A to B（AからBまで）の形です。お店や施設の営業時間でよく使います。","その店は午前9時から午後8時まで開いている。","空欄の先に to があれば、from を探します。"),
EG_Q('g53','g_prep',2,"All employees must wear ID badges ____ working hours.",["during","while","for","between"],
 ["during は「～の間（ずっと）」という前置詞で、後ろに working hours（勤務時間）という名詞を置けます。","while も「～の間」ですが接続詞なので、後ろに主語と動詞のある文が必要です（while they are working）。","for も「～の間」ですが、three hours のような長さに使います。「勤務時間」という期間の名前には during を使います。","between は「2つの間」で、between A and B の形で使います。"],
 "空欄の後ろは working hours（勤務時間）という名詞のまとまりです。名詞の前に置けて「～の間」を表す前置詞は during です。","全従業員は勤務時間中、社員証を着用しなければならない。","during＋名詞、while＋文。後ろの形で決めます。"),
EG_Q('g54','g_pron',1,"Mr. Kim and ____ will attend the conference.",["I","me","my","mine"],
 ["Mr. Kim and ＿ が主語（「誰が」）なので、主語の形の I です。","me は「私を・私に」の形で、主語には使いません。","my は「私の」で、後ろに名詞が必要です。","mine は「私のもの」で、人として会議に出る意味になりません。"],
 "will attend（出席する）の主語は Mr. Kim and ＿ です。主語の位置では I を使います。Mr. Kim を消して「＿ will attend」と考えると I だとすぐ分かります。","キムさんと私が会議に出席します。","and でつながった人を1人ずつにして考えると、正しい形が見えます。"),
EG_Q('g55','g_pron',1,"Ms. Sato forgot ____ umbrella at the office.",["her","she","hers","herself"],
 ["後ろに umbrella（傘）という名詞があるので、「彼女の」の her です。","she は主語の形で、名詞の前には置けません。","hers は「彼女のもの」で、後ろに名詞を置きません。","herself は「彼女自身」で、名詞の前には置けません。"],
 "＿ umbrella で「彼女の傘」です。名詞の前で「誰の」を表す形は her です。","佐藤さんは会社に傘を忘れた。","空欄のすぐ後ろに名詞があれば、my・your・her・his・their など「～の」の形です。"),
EG_Q('g56','g_pron',2,"Mr. Lee prepared the presentation slides by ____.",["himself","him","his","he"],
 ["by ～self で「自分で・ひとりで」。主語の Mr. Lee 自身なので himself です。","by him は「彼によって」で、主語と同じ人を指すと不自然です。","his は「彼の」で、後ろに名詞が必要です。","he は主語の形で、前置詞 by の後ろには置けません。"],
 "by himself は「自分で（ひとりで）」というまとまりです。主語（Mr. Lee）と同じ人に戻るときは ～self の形を使います。","リーさんは自分でプレゼンの資料を準備した。","by ～self で「自分で」。主語と同じ人なら ～self を探します。"),
EG_Q('g57','g_comp',1,"This printer is ____ than the old one.",["faster","fast","fastest","more fast"],
 ["後ろに than（～より）があるので、比べる形の faster です。","fast はそのままの形で、than と組み合わせられません。","fastest は「最も速い」で、than とは一緒に使いません。","fast は短い語なので、more ではなく er を付けます。"],
 "than があれば2つを比べています。短い形容詞は er を付けて faster（より速い）にします。the old one は the old printer（古いプリンター）のことです。","このプリンターは古いものより速い。","than があれば ～er か more ～ を探します。"),
EG_Q('g58','g_comp',2,"This is ____ hotel in the city.",["the most expensive","more expensive","the expensivest","as expensive"],
 ["in the city（市内で）の中で「最も高い」なので the most expensive です。","more expensive は2つを比べる形で、than がありません。","expensive は長い語なので est は付けず、most を前に置きます。","as expensive は as ～ as の形で、後ろの as がありません。"],
 "in the city（市の中で）と比べる範囲が示されているので「最も～」の形です。expensive のような長い形容詞は、the most を前に置きます。","ここは市内で最も高いホテルだ。","in ～ / of ～ で範囲が示されていれば、the ～est か the most ～ です。"),
EG_Q('g59','g_comp',3,"The new model is twice ____ the old one.",["as light as","lighter as","as lighter than","light as"],
 ["twice as ～ as で「～の2倍…」です。","lighter と as を混ぜた形は文法的に誤りです。","as と than を混ぜて使うことはできません。","as が1つ足りません。twice as light as の形です。"],
 "「～の○倍…だ」は ○ times as ～ as で表し、2倍は twice を使います。as と as の間には、元の形（light）を置きます。","新しいモデルは古いものの2倍軽い。","twice / three times の後ろは as ～ as の形です。"),
EG_Q('g60','g_passive',2,"The new office ____ by a famous architect.",["was designed","designed","was designing","has designing"],
 ["事務所は設計「される」側で、by（～によって）もあるので受け身の was designed です。","designed だけだと、事務所が何かを設計したことになります。","was designing は「設計していた」で、事務所が設計する側になってしまいます。","has designing という形はありません。"],
 "主語は The new office（新しい事務所）です。事務所は自分で設計できないので「設計される」側です。受け身は be動詞＋過去分詞 で、by a famous architect（有名な建築家によって）が「誰がしたか」を表します。","新しい事務所は有名な建築家によって設計された。","主語が「する側」か「される側」かを考えます。by ～ があれば受け身の合図です。"),
EG_Q('g61','g_rel',2,"Employees ____ want to join the training should contact Ms. Ono.",["who","which","whose","whom"],
 ["Employees（従業員）は人で、後ろの want の主語になるので who です。","which は物や動物に使います。","whose は「その人の」で、後ろに名詞が必要です。","whom は「その人を」の形で、want の主語になれません。"],
 "Employees ＿ want to join the training（研修に参加したい従業員）が主語、should contact が動詞です。空欄は直前の Employees（人）を説明し、want の主語の役割なので who です。","研修に参加したい従業員は小野さんに連絡してください。","空欄のすぐ後ろに動詞があれば、主語の役割です。人なら who、物なら which です。"),
EG_Q('g62','g_rel',3,"The client ____ order was delayed has called twice.",["whose","who","which","whom"],
 ["後ろに order（注文）という名詞があり、「その顧客の注文」なので whose です。","who の後ろには動詞が続くのが普通で、order was delayed とつながりません。","which は物に使うので、client（人）を説明できません。","whom は「その人を」で、後ろの名詞 order とつながりません。"],
 "The client ＿ order was delayed（注文が遅れた顧客）が主語、has called が動詞です。「その顧客の注文」という「～の」の関係なので、whose＋名詞 の形にします。","注文が遅れた顧客から、2回電話があった。","空欄のすぐ後ろが名詞で「その～の」とつながれば whose です。"),
EG_Q('g63','g_inf_ger',2,"Thank you for ____ our survey.",["completing","complete","to complete","completed"],
 ["for は前置詞なので、後ろの動詞は ～ing（動名詞）にして completing です。","complete は動詞の原形で、前置詞の後ろに置けません。","前置詞の後ろに to＋動詞の原形 は置けません。","completed は過去形・過去分詞で、for の後ろに置けません。"],
 "Thank you for ～（～をありがとう）の for は前置詞（名詞の前に置く言葉）です。前置詞の後ろに動詞を置くときは ～ing の形にして、名詞のように使います。","アンケートにご回答いただきありがとうございます。","前置詞（for・of・in・about など）の後ろの動詞は ～ing です。"),
EG_Q('g64','g_inf_ger',2,"Mr. Hara agreed ____ the project.",["to lead","leading","lead","led"],
 ["agree は後ろに to＋動詞の原形 を取るので to lead です。","agree の後ろに ～ing は使いません。","動詞の原形だけを続けることはできません。","led は過去形で、agreed の後ろにそのまま続けられません。"],
 "agree to ～ で「～することに同意する」です。decide・plan・hope のように、これから先のことに向かう動詞は to＋動詞の原形 を後ろに取ります。","原さんはそのプロジェクトを率いることに同意した。","decide・plan・agree・hope の後ろは to＋原形。enjoy・finish・avoid の後ろは ～ing です。"),
EG_Q('r10','r_detail',2,"How much of a discount can a member get on a sofa?",["35%","30%","5%","25%"],
 ["家具は全品30％引き、会員はさらに5％引きなので、合わせて35％です。","30％は会員でない人の割引です。会員はさらに5％引かれます。","5％は会員への上乗せ分だけです。","25％はどこにも書かれていません。30から5を引かないようにします。"],
 "ソファ（sofa）は家具（furniture）の一つで、all furniture is 30% off とあります。さらに Members get an extra 5% off（会員はさらに5％引き）。extra は「追加の」なので、合計35％です。","会員はソファでどれだけ割引を受けられますか？","質問の sofa は本文にありません。本文では furniture（家具）と大きなまとまりで言いかえられています。",
 "Spring Sale at Green Home Store! From April 10 to April 16, all furniture is 30% off. Members get an extra 5% off at the register. The sale does not include kitchen appliances. Visit our website for more details.","Members get an extra 5% off at the register."),
EG_Q('r11','r_detail',2,"How often does the bus leave at 3:00 p.m. on a weekday?",["Every 20 minutes","Every 40 minutes","Every hour","Every 7 minutes"],
 ["午後3時は午前6時から午後9時の間なので、20分ごとです。","40分ごとは午後9時より後の時間帯です。","1時間ごととはどこにも書かれていません。","7は日曜の始発の時刻（7:00 a.m.）で、間隔ではありません。"],
 "every 20 minutes は「20分ごとに」。午後3時（3:00 p.m.）は from 6:00 a.m. to 9:00 p.m.（午前6時から午後9時まで）の範囲に入ります。","平日の午後3時、バスはどれくらいの間隔で出ますか？","時刻の質問では、その時刻がどの時間帯の範囲に入るかを確かめます。",
 "City Loop Bus: Buses leave Central Station every 20 minutes from 6:00 a.m. to 9:00 p.m. After 9:00 p.m., buses run every 40 minutes until midnight. On Sundays, the first bus leaves at 7:00 a.m.","Buses leave Central Station every 20 minutes from 6:00 a.m. to 9:00 p.m."),
EG_Q('r12','r_purpose',2,"What does Lisa ask Tom to do?",["Contact the repair company","Fix the copy machine himself","Buy a new copy machine","Move to the third floor"],
 ["Could you contact them（彼らに連絡してくれますか）の them は修理会社のことです。","トム自身が直すようには頼んでいません。","新しいコピー機を買う話は出ていません。","third floor はコピー機のある場所で、引っ越しの話ではありません。"],
 "メールで頼みごとをするときは Could you ～?（～してもらえますか）がよく使われます。them は直前の文の the repair company（修理会社）を指します。","リサはトムに何を頼んでいますか？","頼みごとの質問では、Could you ～? / Please ～ の文を探します。",
 "Hi Tom, The copy machine on the third floor stopped working again this morning. I called the repair company last week, but nobody came. Could you contact them today and ask them to send someone by Friday? Thanks, Lisa","Could you contact them today and ask them to send someone by Friday?"),
EG_Q('r13','r_detail',2,"Which facility cannot be used on June 4?",["The swimming pool","The gym","The sauna","All facilities"],
 ["清掃のため、6月4日はプールが閉まります。","ジムはいつも通り開いています（stay open as usual）。","サウナもいつも通り開いています。","閉まるのはプールだけで、すべての施設ではありません。"],
 "will be closed は「閉まる」。閉まるのはプールだけで、The gym and the sauna will stay open（ジムとサウナは開いたまま）と書かれています。","6月4日に使えない施設はどれですか？","日付の質問は、本文で同じ日付を探し、その文の主語（何が）を確かめます。",
 "Notice to all members: The swimming pool will be closed on Tuesday, June 4, for cleaning. The gym and the sauna will stay open as usual. The pool will reopen on Wednesday morning at 6:00 a.m. We are sorry for any inconvenience.","The swimming pool will be closed on Tuesday, June 4, for cleaning."),
EG_Q('r14','r_reason',3,"Why will orders not be shipped from May 3 to May 5?",["The warehouse staff will be on holiday.","The online store will be closed.","The products are sold out.","There is a problem with the delivery company."],
 ["because の後ろに、倉庫のスタッフが休暇を取るから、と理由が書かれています。","オンラインストアは開いたまま（remain open）です。","売り切れの話は出ていません。","配送会社の問題には触れていません。"],
 "理由は because の後ろにあります。warehouse（倉庫）のスタッフが on holiday（休暇中）になるためです。その間の注文（Orders placed）は5月6日に発送されます。","5月3日から5日まで注文品が発送されないのはなぜですか？","Why の質問は、本文の because / since / due to の後ろを探します。",
 "Dear Customers, Please note that we will not ship any orders from May 3 to May 5 because our warehouse staff will be on holiday. Orders placed during this period will be shipped on May 6. Our online store will remain open.","Please note that we will not ship any orders from May 3 to May 5 because our warehouse staff will be on holiday."),
EG_Q('r15','r_detail',3,"What is required for this job?",["Basic spreadsheet skills","Office experience","Working five days a week","A driver's license"],
 ["must have（持っていなければならない）とあり、必須の条件です。","経験は helpful but not required（あると助かるが必須ではない）です。","勤務は週3日（three days a week）です。","運転免許の話は出ていません。"],
 "質問の required（必要とされる）を、本文では must have と言いかえています。Applicants（応募者）は、表計算ソフト（spreadsheet）の基本的な技能が必要です。","この仕事に必要なものは何ですか？","「必要なもの」は must / required / necessary の文に書かれています。not required（必須ではない）との違いに注意します。",
 "Part-Time Office Assistant Wanted. We are looking for someone to work three days a week at our downtown office. Main duties include answering phones and entering data. Applicants must have basic spreadsheet skills. Experience is helpful but not required. Please send your application to jobs@example.com by March 31.","Applicants must have basic spreadsheet skills."),
EG_Q('r16','r_detail',2,"What time does the cafe open on Wednesday?",["7:00 a.m.","9:00 a.m.","5:00 p.m.","6:00 p.m."],
 ["水曜は月曜から金曜（Monday to Friday）に入るので、午前7時に開きます。","午前9時は土日の開店時刻です。","午後5時は土日の閉店時刻です。","午後6時は平日の閉店時刻です。"],
 "Wednesday（水曜日）は Monday to Friday（月曜から金曜）の中に入ります。開店は範囲の最初の 7:00 a.m. です。","水曜日、カフェは何時に開きますか？","曜日の質問は、その曜日がどの範囲に入るかを先に確かめます。",
 "Sunny Cafe Hours: Monday to Friday, 7:00 a.m. to 6:00 p.m. Saturday and Sunday, 9:00 a.m. to 5:00 p.m. We are closed on national holidays. Free Wi-Fi is available for all customers.","Monday to Friday, 7:00 a.m. to 6:00 p.m."),
EG_Q('r17','r_notice',3,"When will the sales meeting be held?",["Thursday at 3:00 p.m.","Wednesday at 10:00 a.m.","Wednesday at 3:00 p.m.","Thursday at 10:00 a.m."],
 ["moved to（～に移された）の後ろが新しい日時です。","水曜午前10時は元の予定（planned for）です。","元の曜日と新しい時刻が混ざっています。","新しい曜日と元の時刻が混ざっています。"],
 "has been moved to ～ は「～に変更された」。planned for ～（予定されていた）の後ろは古い日時、moved to ～ の後ろが新しい日時です。","営業会議はいつ開かれますか？","変更のお知らせでは、古い情報（planned for）と新しい情報（moved to / changed to）を区別します。",
 "To: Sales Team. Subject: Meeting Change. The sales meeting planned for Wednesday at 10:00 a.m. has been moved to Thursday at 3:00 p.m. because the conference room is being repaired. The meeting will be held in Room 204 instead. Please bring your monthly reports.","The sales meeting planned for Wednesday at 10:00 a.m. has been moved to Thursday at 3:00 p.m. because the conference room is being repaired."),
EG_Q('r18','r_detail',2,"How much does a late check-out cost?",["$20","$11","$2","It is free."],
 ["late check-out fee（遅いチェックアウトの料金）は20ドルです。","11はチェックアウトの時刻（午前11時）です。","2は延長できる時刻（午後2時）です。","料金が請求書に加えられる（added to your bill）ので、無料ではありません。"],
 "fee は「料金」、bill は「請求書」。A late check-out fee of $20 で「20ドルの延長料金」です。","遅めのチェックアウトにはいくらかかりますか？","金額の質問は、$ や fee / cost / price の近くを探します。時刻の数字と混ぜないようにします。",
 "Welcome to Harbor Hotel. Check-out time is 11:00 a.m. If you would like to stay until 2:00 p.m., please ask at the front desk. A late check-out fee of $20 will be added to your bill. Breakfast is served from 6:30 a.m. to 10:00 a.m.","A late check-out fee of $20 will be added to your bill."),
EG_Q('r19','r_purpose',2,"What is the main purpose of this message?",["To confirm an appointment","To change an appointment","To ask Ms. Brown to fill out a form online","To announce a new clinic"],
 ["This is to confirm（これは～を確認するためのものです）と、最初に目的が書かれています。","時間を変えたいときは電話を、とあるだけで、変更のお知らせではありません。","用紙の記入は来院したときのことで、オンラインとは書かれていません。","新しい医院の宣伝ではありません。"],
