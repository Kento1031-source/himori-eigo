EG_Q('rb23','r_detail',2,"Which plan includes free use of meeting rooms?",["Private Office","Flex Desk","Dedicated Desk","The one-day trial"],
 ["個室プランには、毎月5時間分の会議室の無料利用がついています。","フレックス席に含まれるのは Wi-Fi とコーヒー・紅茶です。","専用席に含まれるのは鍵付きの引き出しとフレックス席の内容で、会議室は入っていません。","1日の無料体験は場所を試すもので、会議室の無料利用とは書かれていません。"],
 "Private Office の説明に plus five free hours of meeting room use each month（さらに毎月5時間の会議室の無料利用）とあります。ほかの会員は1時間15ドルで予約します。","会議室を無料で使えるのはどのプランですか？","料金プランの問題は、プランごとに「含まれるもの（Includes / plus）」を整理して読みます。",
 "HubSpace Coworking: Membership Plans. Flex Desk ($120/month): Use any open desk in our shared area from 8:00 a.m. to 8:00 p.m., Monday to Friday. Includes high-speed Wi-Fi and free coffee and tea. Dedicated Desk ($220/month): Your own desk that no one else uses, available 24 hours a day, seven days a week. Includes a locked drawer and everything in the Flex Desk plan. Private Office ($650/month): A furnished office for up to four people, plus five free hours of meeting room use each month. All members can book meeting rooms for $15 per hour. Members who sign up for six months or more receive one month free. New members are welcome to try our space for a day at no cost; simply bring a photo ID to the reception desk.","Private Office ($650/month): A furnished office for up to four people, plus five free hours of meeting room use each month."),
EG_Q('rb24','r_rb_not',3,"What is NOT mentioned as part of the Flex Desk plan?",["A locked drawer","High-speed Wi-Fi","Free drinks","Use of a desk on weekdays"],
 ["鍵付きの引き出しは Dedicated Desk（専用席）に追加されるものです。だからこれが答えです。","Includes high-speed Wi-Fi とあります。","free coffee and tea（無料のコーヒーと紅茶）を drinks とまとめています。","Monday to Friday（月曜から金曜）に席を使えます。"],
 "Includes a locked drawer and everything in the Flex Desk plan. は「鍵付きの引き出しと、フレックス席プランのすべてを含む」という専用席の説明です。つまり鍵付きの引き出しは、フレックス席にはない追加の分です。","フレックス席プランの内容として述べられていないものはどれですか？","「A と、B プランのすべて」という書き方では、A は B プランにない追加分です。",
 "HubSpace Coworking: Membership Plans. Flex Desk ($120/month): Use any open desk in our shared area from 8:00 a.m. to 8:00 p.m., Monday to Friday. Includes high-speed Wi-Fi and free coffee and tea. Dedicated Desk ($220/month): Your own desk that no one else uses, available 24 hours a day, seven days a week. Includes a locked drawer and everything in the Flex Desk plan. Private Office ($650/month): A furnished office for up to four people, plus five free hours of meeting room use each month. All members can book meeting rooms for $15 per hour. Members who sign up for six months or more receive one month free. New members are welcome to try our space for a day at no cost; simply bring a photo ID to the reception desk.","Includes a locked drawer and everything in the Flex Desk plan."),
EG_Q('rb25','r_rb_vocab',2,"The word \"book\" in the web page is closest in meaning to",["reserve","read","write","record"],
 ["book a room は「部屋を予約する」で、reserve と同じ意味です。","名詞の book（本）からの連想で、会議室を「読む」では意味が通りません。","会議室を「書く」では意味が通りません。","「記録する」では、1時間15ドルという料金と合いません。"],
 "book は名詞では「本」ですが、動詞（動作を表す言葉）では「予約する」です。can book meeting rooms for $15 per hour（1時間15ドルで会議室を予約できる）と、後ろに場所と料金が続くことからも分かります。","ウェブページの中の book という単語に最も意味が近いのはどれですか？","よく知っている単語ほど、文の中で別の意味（book＝予約する、address＝取り組む）になっていないか確かめます。",
 "HubSpace Coworking: Membership Plans. Flex Desk ($120/month): Use any open desk in our shared area from 8:00 a.m. to 8:00 p.m., Monday to Friday. Includes high-speed Wi-Fi and free coffee and tea. Dedicated Desk ($220/month): Your own desk that no one else uses, available 24 hours a day, seven days a week. Includes a locked drawer and everything in the Flex Desk plan. Private Office ($650/month): A furnished office for up to four people, plus five free hours of meeting room use each month. All members can book meeting rooms for $15 per hour. Members who sign up for six months or more receive one month free. New members are welcome to try our space for a day at no cost; simply bring a photo ID to the reception desk.","All members can book meeting rooms for $15 per hour."),
EG_Q('rb26','r_rb_intent',4,"At 10:09 a.m., what does Mr. Patel most likely mean when he writes, \"Fair enough\"?",["He accepts Ms. Lin's reason for suggesting Quickprint.","He thinks Quickprint's price is reasonable.","He is satisfied with the current printing company.","He agrees that the trade show should be moved."],
 ["品質の心配に対して「新しい機械を入れた」と説明され、それなら納得だと受け入れています。","値段はまだ聞いていません。直後に値段を問い合わせるよう頼んでいます。","今の印刷会社は金曜までに間に合わないので、満足していません。","展示会の日程を変える話は出ていません。"],
 "Fair enough は「それなら納得です・もっともです」と、相手の意見を受け入れるときの言葉です。直前にパテルさんが品質が良くなかったと心配し、リンさんが they've bought new equipment since then（その後、新しい機械を買った）と答えています。直後にクイックプリントへの問い合わせを頼んでいるのも、この意味と合います。","午前10時9分に、パテルさんが Fair enough と書いているのは、どういう意味だと考えられますか？","短い返事の意図は、「直前の相手の発言」と「直後の行動」の両方とつじつまが合うものを選びます。",
 "Carla Diaz (10:02 a.m.): Quick update on the Westbrook brochure. The printer says they can't finish it by Friday because one of their machines is broken. Raj Patel (10:03 a.m.): That's bad timing. We need the brochures for the trade show on Monday. Carla Diaz (10:04 a.m.): They can deliver on Tuesday at the earliest. Mei Lin (10:06 a.m.): What about Quickprint on Elm Street? We used them last year for the client newsletter. Raj Patel (10:07 a.m.): Their quality wasn't great, though. Mei Lin (10:08 a.m.): True, but they've bought new equipment since then. I saw their samples last month. Raj Patel (10:09 a.m.): Fair enough. Carla, can you ask them for a price and a delivery date? Carla Diaz (10:10 a.m.): I'll call them right after this.","True, but they've bought new equipment since then."),
EG_Q('rb27','r_rb_infer',2,"What will Ms. Diaz most likely do next?",["Contact another printing company","Repair a printing machine","Visit the trade show","Send samples to Ms. Lin"],
 ["パテルさんに頼まれ、「この後すぐに電話する」と答えています。them はクイックプリントのことです。","機械が壊れているのは今の印刷会社で、ディアスさんが直すわけではありません。","展示会は月曜で、次にすることではありません。","見本を見たのはリンさんで、ディアスさんが送るとは書かれていません。"],
 "most likely do next（次に何をする可能性が高いか）の答えは、会話の最後の発言にあることが多いです。I'll call them right after this.（この後すぐに電話します）の them は、直前でパテルさんが話しているクイックプリントです。","ディアスさんは次に何をすると考えられますか？","「次にすること」の質問は、最後の I'll ～ / Let me ～ の文を探し、代名詞（them など）が何を指すかを確かめます。",
 "Carla Diaz (10:02 a.m.): Quick update on the Westbrook brochure. The printer says they can't finish it by Friday because one of their machines is broken. Raj Patel (10:03 a.m.): That's bad timing. We need the brochures for the trade show on Monday. Carla Diaz (10:04 a.m.): They can deliver on Tuesday at the earliest. Mei Lin (10:06 a.m.): What about Quickprint on Elm Street? We used them last year for the client newsletter. Raj Patel (10:07 a.m.): Their quality wasn't great, though. Mei Lin (10:08 a.m.): True, but they've bought new equipment since then. I saw their samples last month. Raj Patel (10:09 a.m.): Fair enough. Carla, can you ask them for a price and a delivery date? Carla Diaz (10:10 a.m.): I'll call them right after this.","I'll call them right after this."),
EG_Q('rb28','r_purpose',2,"Why was the e-mail written?",["To respond to a complaint about a damaged item","To advertise a new coffee maker","To ask Mr. Webb to pay for a replacement","To confirm a change of address"],
 ["割れたガラスポットが届いたという連絡に、おわびと対応を伝えています。","新しい商品の宣伝ではありません。","替えのポットはすでに送ってあり、代金を求める文はありません。","住所の変更の話は出ていません。"],
 "最初の Thank you for contacting ～（ご連絡ありがとうございます）から、客から連絡があったことが分かります。次の文の We are sorry to hear that ～（～と聞いて申し訳なく思います）で、割れた商品についての苦情への返事だと分かります。","このメールはなぜ書かれましたか？","We are sorry to hear that ～ は、苦情への返事のメールでよく使われる合図です。",
 "Dear Mr. Webb, Thank you for contacting Larkfield Home Goods. We are sorry to hear that the coffee maker you ordered arrived with a cracked glass pot. We have already shipped a replacement pot, which should reach you within three business days. There is no need to return the damaged pot; please dispose of it safely. In addition, we have added a $10 credit to your online account, which you can use on your next purchase. If the coffee maker itself does not work properly, please reply to this e-mail with a photo of the problem, and we will send you a new machine. We value your business and hope you continue to enjoy shopping with us. Best regards, Hannah Cole, Customer Support","We are sorry to hear that the coffee maker you ordered arrived with a cracked glass pot."),
EG_Q('rb29','r_detail',3,"What is Mr. Webb asked to do with the cracked pot?",["Throw it away","Send it back to the company","Take a photo of it","Bring it to a store"],
 ["dispose of it safely（安全に処分してください）とあります。","There is no need to return（返送する必要はない）とあります。","写真が必要なのは、コーヒーメーカー本体が動かないときです。","店に持って行く話は出ていません。"],
 "dispose of ～ は「～を処分する・捨てる」で、throw away と同じ意味です。直前の There is no need to return the damaged pot（壊れたポットを返す必要はありません）も、返送の選択肢を消す手がかりになります。","ウェッブさんは割れたポットをどうするように頼まれていますか？","please ～ の文は「相手にしてほしいこと」です。その前の no need to ～（～する必要はない）とセットで読みます。",
 "Dear Mr. Webb, Thank you for contacting Larkfield Home Goods. We are sorry to hear that the coffee maker you ordered arrived with a cracked glass pot. We have already shipped a replacement pot, which should reach you within three business days. There is no need to return the damaged pot; please dispose of it safely. In addition, we have added a $10 credit to your online account, which you can use on your next purchase. If the coffee maker itself does not work properly, please reply to this e-mail with a photo of the problem, and we will send you a new machine. We value your business and hope you continue to enjoy shopping with us. Best regards, Hannah Cole, Customer Support","There is no need to return the damaged pot; please dispose of it safely."),

 ["your online account（あなたのオンラインのアカウント）に10ドル分を加えたとあるので、アカウントを持っていると分かります。","ポットは返す必要がなく、返したとも書かれていません。","10ドルは店が加えたクレジット（次の買い物に使える金額）で、送料ではありません。","you ordered（注文した）と arrived（届いた）から、店で買ったのではありません。"],
 "we have added a $10 credit to your online account（あなたのオンラインアカウントに10ドルのクレジットを加えました）から、ウェッブさんがこの店のオンラインアカウントを持っていることが分かります。credit は「次の買い物で使える金額」です。","ウェッブさんについて何が示唆されていますか？","your ～（あなたの～）という言葉は、相手が持っているものや状況を示す推測問題の根拠になります。",

EG_Q('rb31','r_notice',2,"How often are the workshops held?",["Once a week","Every day for four days","Twice a month","Once a month"],
 ["10月の毎週火曜日（every Tuesday）に開かれるので、週に1回です。","four-week は「4週間の」で、4日間ではありません。","月に2回ではなく、毎週です。","月に1回ではなく、毎週です。"],
 "every Tuesday evening（毎週火曜日の夜）なので、週に1回です。four-week workshop series は「4週間にわたる連続講座」で、合計4回になります。","講座はどれくらいの頻度で開かれますか？","How often（どれくらいの頻度で）の質問は、every ～ / once a ～ / twice a ～ を探します。",
 "Glenmoor Community Center: Small Business Workshop Series. Are you thinking of starting your own business? Join our free four-week workshop series, held every Tuesday evening in October from 7:00 to 8:30 p.m. Local business owners and an accountant from Fairway Accounting will share practical advice. Topics include writing a business plan, managing cash flow, and finding your first customers. Each session builds on the previous one, so participants are encouraged to attend all four. Space is limited to 25 people, and registration closes on September 25. To register, visit www.example.com/glenmoor or stop by the front desk. Light refreshments will be provided. Please note that parking at the center is limited in the evening, so we recommend using the bus.","Join our free four-week workshop series, held every Tuesday evening in October from 7:00 to 8:30 p.m."),
EG_Q('rb32','r_rb_not',3,"What is NOT mentioned as a workshop topic?",["Hiring employees","Preparing a business plan","Managing money coming in and going out","Getting customers"],
 ["社員を雇う話は、取り上げるテーマに入っていません。だからこれが答えです。","writing a business plan（事業計画を書く）とあります。","cash flow（お金の出入り）の管理とあります。","finding your first customers（最初の客を見つける）とあります。"],
 "テーマは Topics include ～ の1文に3つ並んでいます。選択肢では writing → preparing、cash flow → money coming in and going out、finding → getting と言いかえられています。言いかえを見抜いて3つを消すと、残るのは雇用の話です。","講座のテーマとして述べられていないものはどれですか？","NOT問題では、言いかえられた選択肢を「書かれていない」と勘違いしないように、意味で照らし合わせます。",
 "Glenmoor Community Center: Small Business Workshop Series. Are you thinking of starting your own business? Join our free four-week workshop series, held every Tuesday evening in October from 7:00 to 8:30 p.m. Local business owners and an accountant from Fairway Accounting will share practical advice. Topics include writing a business plan, managing cash flow, and finding your first customers. Each session builds on the previous one, so participants are encouraged to attend all four. Space is limited to 25 people, and registration closes on September 25. To register, visit www.example.com/glenmoor or stop by the front desk. Light refreshments will be provided. Please note that parking at the center is limited in the evening, so we recommend using the bus.","Topics include writing a business plan, managing cash flow, and finding your first customers."),
EG_Q('rb33','r_rb_intent',3,"At 3:18 p.m., what does Mr. Lam mean when he writes, \"Don't bother\"?",["Ms. Haines does not need to ask the client for another time.","He does not want to attend the meeting.","Ms. Haines should cancel the contract.","He does not want to be disturbed now."],
 ["「別の時間を聞きましょうか」への返事で、自分が歯医者の予約を動かすので、その必要はないという意味です。","「この契約のほうが大事だ」と言っていて、会議に出るつもりです。","契約を取り消す話はしていません。","「今は話しかけないで」という意味ではありません。会話は続いています。"],
 "Don't bother. は「わざわざそうしなくていいですよ」という意味です。直前にヘインズさんが Should I ask them for another time?（別の時間をお願いしましょうか）と聞き、ラムさんは直後に I'll move my appointment.（自分の予約を動かします）と言っています。","午後3時18分に、ラムさんが Don't bother と書いているのはどういう意味ですか？","Don't bother / No need / That's OK のような短い断りは、直前の申し出を断っています。何を断っているのかを直前の文で確かめます。",
 "Nora Haines (3:15 p.m.): Hi Victor, the client from Delmont Foods just called. They want to move tomorrow's meeting from 10:00 to 2:00. Victor Lam (3:16 p.m.): Hmm, I'm supposed to be at the dentist at 2:00. Nora Haines (3:17 p.m.): Should I ask them for another time? Victor Lam (3:18 p.m.): Don't bother. I'll move my appointment. This contract is more important. Nora Haines (3:19 p.m.): OK. I'll tell them 2:00 works and book Room 5. Victor Lam (3:20 p.m.): Great. Please also print ten copies of the price list.","I'll move my appointment."),
EG_Q('rb34','r_detail',2,"What does Mr. Lam ask Ms. Haines to do?",["Make copies of a document","Call his dentist's office","Change the meeting back to 10:00","Write a new price list"],
 ["価格表を10部印刷するよう頼んでいます。","歯医者の予約はラムさん自身が動かすと言っています。","会議は客の希望どおり午後2時に決まりました。","価格表は印刷するだけで、新しく作るようには頼んでいません。"],

 "Nora Haines (3:15 p.m.): Hi Victor, the client from Delmont Foods just called. They want to move tomorrow's meeting from 10:00 to 2:00. Victor Lam (3:16 p.m.): Hmm, I'm supposed to be at the dentist at 2:00. Nora Haines (3:17 p.m.): Should I ask them for another time? Victor Lam (3:18 p.m.): Don't bother. I'll move my appointment. This contract is more important. Nora Haines (3:19 p.m.): OK. I'll tell them 2:00 works and book Room 5. Victor Lam (3:20 p.m.): Great. Please also print ten copies of the price list.","Please also print ten copies of the price list.")

Object.assign(EG_KN, {
 r_ra_connector:{cat:'reading',t:'空所に入るつなぎ言葉（however / therefore / for instance など）',l:'文と文をつなぐ言葉（ディスコースマーカー：話の流れを示す合図の言葉）は、前後の文の関係で決まります。まず空欄の前の文と後ろの文を読み、関係を4つに分けます。逆の内容なら However（しかし）、原因→結果なら As a result（その結果）・Therefore（それゆえ）、大まかな話→具体的な1つの話なら For instance（たとえば）、2つのものの違いを比べるなら In contrast（対照的に）です。例：It rained all day. As a result, the game was cancelled.（一日中雨だった。その結果、試合は中止された）。全部訳してから選ぶより、「プラス→マイナス」「原因→結果」のように矢印で流れをメモする方が速く正確です。'},
 r_ra_main:{cat:'reading',t:'文章の主旨（いちばん言いたいこと）をつかむ',l:'主旨は1つの細かい情報ではなく、文章全体が言いたいことです。説明文では、最初に「よくある考え」を出し、However や but の後ろで筆者や専門家の考えを示す形がよく使われます。主旨は therefore・in short・This suggests that ～ などの合図がある文や、最後の文にまとめられることが多いです。例：Many people think ～. However, research shows ～. なら、However の後ろが主旨です。選択肢では、本文の一部だけを言う狭すぎるものと、本文にない大きな話をする広すぎるものを外します。'},
 r_ra_view:{cat:'reading',t:'筆者の意見と他人の意見を区別する',l:'意見を問う質問では、まず「だれの意見か」を区別します。Critics argue ～ / Some people believe ～ は他人の意見で、筆者はその後に however や but で自分の考えを述べることが多いです。筆者の意見は should・the most effective・The lesson is ～ などの言葉や、最後のまとめの文に表れます。例：Some say cash is outdated. However, it still matters to many people. では、However の後ろが筆者の意見です。A rather than B（BではなくA）や not A but B（AではなくB）があれば、A rather than B なら A、not A but B なら B が筆者の言いたいことです。'},
 r_ra_study:{cat:'reading',t:'研究・調査の結果を正確に読む',l:'研究を紹介する文章は、「だれが・何と何を比べて・何が分かったか」の順に書かれます。結果は found・showed・When tested ～ の後ろ、研究者の考えは concluded・believe・suggest・raise a concern の後ろに出てきます。例：Those who walked remembered more than those who sat.（歩いた人は座った人より多く覚えていた）のように、どちらのグループの結果かを取り違えないことが大切です。As expected（予想通り）と surprised・unexpectedly（意外にも）を区別すると、研究の新しい発見が見つかります。'},
 r_ra_infer:{cat:'reading',t:'本文から推測できることを選ぶ',l:'推測（infer）の問題は、本文にそのままは書かれていないけれど、本文の情報から確実に言えることを選びます。2つの文を組み合わせたり、Only when ～ did …（～して初めて…した）を「～までは…しなかった」と読みかえたりして考えます。例：Tom bought a ticket but did not go to the concert. からは「トムはチケットを使わなかった」と推測できます。本文にない新しい情報を足した選択肢や、always・never などの言いすぎの選択肢は選びません。最後に「本文のどの文を根拠として指させるか」を確かめます。'}
});
EG_QS.push(
EG_Q('ra1','r_ra_connector',3,"Which word or phrase best fills the blank?",["As a result","In contrast","For instance","However"],
 ["前の文は「木の多い通りは4度涼しい」、空欄の文は「その通りの住民は冷房の電気をあまり使わなかった」。涼しい→電気が少なくて済む、という原因と結果の関係なので As a result（その結果）です。","In contrast（対照的に）は、2つのものの違いを比べるときに使います。ここは涼しさの結果を述べているので合いません。","For instance（たとえば）は、前の内容の具体例を出すときに使います。電気の使用量は「4度涼しい」ことの例ではなく、その結果です。","However（しかし）は前と逆の内容をつなぎます。涼しい→電気が少ない は逆の関係ではありません。"],
 "つなぎ言葉の問題は、空欄の前の文と後ろの文がどんな関係かを先に決めます。前は「木が空の3分の1以上をおおう通りは、午後に平均4度涼しかった」、後ろは「その日陰の通りの住民は、冷房の電気をかなり少なく使った」。涼しい（原因）→電気が少なくて済む（結果）なので、As a result が入ります。","空欄に入る最も適切な語句はどれですか？","空欄の前後を「原因→結果」「逆」「例」「比較」のどれかに分けてから選びます。",
 "For decades, city planners treated trees mainly as decoration, something to add once roads and buildings were finished. That attitude is changing as summers grow hotter. Trees cool the air in two ways: their leaves block sunlight before it reaches the pavement, and they release water vapour, which absorbs heat as it evaporates. A team at the Northvale Institute measured street temperatures in forty neighbourhoods during a heatwave. Streets where trees covered at least a third of the sky were, on average, four degrees cooler in the afternoon than streets with almost no trees. ____, residents of the shaded streets used noticeably less electricity for air conditioning. The researchers warn, however, that planting is only half the task. Young trees need regular watering for their first three years, and many cities plant thousands of saplings without budgeting for this care, so a large share die before they can provide any shade. A city that counts the trees it keeps alive, rather than the trees it plants, is far more likely to stay cool.","____, residents of the shaded streets used noticeably less electricity for air conditioning."),
EG_Q('ra2','r_reason',4,"According to the passage, why do many newly planted trees never provide shade?",["They die because they are not cared for in their first years.","They are planted on streets that are already too hot.","Their leaves release too much water vapour.","Residents remove them to reduce electricity use."],

EG_Q('ra4','r_ra_connector',3,"Which word or phrase best fills the blank?",["Therefore","However","For instance","In contrast"],
 ["前の文までに「現金が使えないと困る人がいる」「停電でも現金は使える」と理由が並び、その結論として「政府が現金の受け入れを求め始めた」と続くので、Therefore（それゆえ）です。","However（しかし）は前と逆の内容をつなぎます。現金の良さの後に現金を守るルールが来るのは、逆ではなく自然な結論です。","For instance（たとえば）は具体例の合図です。政府のルールは「停電でも現金が使える」ことの例ではありません。","In contrast（対照的に）は2つのものの違いを比べるときに使います。ここに比べる相手はありません。"],
 "空欄の前には、現金がないと買い物ができない人がいること、停電やネットの障害でも現金は使えることが書かれています。後ろは「そのため一部の政府は、大きな店に紙幣と硬貨を受け入れ続けるよう求め始めた」。理由→結論 の関係なので Therefore が入ります。","空欄に入る最も適切な語句はどれですか？","前に理由がいくつか並び、後ろがそこから出る結論や対応なら Therefore / As a result です。",
 "In several countries, a growing number of shops no longer accept cash. Supporters of this trend point to clear advantages: card and phone payments are faster at the till, shops no longer need to transport large sums of money to the bank, and theft becomes less attractive when there is little cash on the premises. Yet a cashless society is not equally convenient for everyone. Older people who have never used a smartphone, people without a bank account, and visitors whose cards are rejected by local systems can find themselves unable to buy basic goods. Cash also continues to work when the electricity supply or the network fails, which digital payments cannot do. ____, some governments have begun to require large shops to keep accepting notes and coins. Critics argue that such rules slow down progress. In my view, however, a payment system should be judged by whether it serves the people who find it hardest to use, not only by how efficient it is for the majority.","____, some governments have begun to require large shops to keep accepting notes and coins."),

EG_Q('ra7','r_ra_study',4,"What did the Lindell University study find?",["Students who practised recalling the article remembered much more a week later.","Students who reread the article three times remembered the most.","Both groups remembered about the same amount.","Students remembered more when they took notes while reading."],
 ["見ないで思い出して書いたグループ（2つ目）は、1週間後に約50％多く覚えていました。","3回読み直したグループの方が、覚えていた量は少なかったです。","約50％の差があったので、同じではありません。","読みながらノートを取るという条件は、この実験にありません。"],
 "研究の結果は、When tested ～（～テストされると）や found / showed の後ろに書かれます。the second group は「1回読んだ後、見ないで思い出せることをすべて書いた」グループです。the first（3回読み直したグループ）より約50％多く覚えていました。the first / the second が何を指すかを、前の文で確かめるのが大切です。","リンデル大学の研究では何が分かりましたか？","the first / the second / the former / the latter が出たら、それぞれ何を指すか必ず前に戻って確かめます。",
 "Most students prepare for exams by rereading their notes and textbooks. It feels productive, because the material becomes more familiar each time. However, familiarity is not the same as memory. In a study by psychologists at Lindell University, two groups of students read the same science article. One group then reread the article three times, while the other group read it once and spent the remaining time writing down everything they could recall without looking. When tested a week later, the second group remembered about fifty percent more than the first. Interestingly, the rereading group had predicted that they would perform better. The researchers concluded that the effort of pulling information out of memory strengthens it, whereas rereading mainly creates a comfortable sense of knowing. They suggest that students who want lasting results should spend less time looking at their notes and more time closing them and testing themselves.","When tested a week later, the second group remembered about fifty percent more than the first."),
EG_Q('ra8','r_ra_infer',4,"What can be inferred about the students who reread the article?",["They believed they had learned the material better than they actually had.","They spent less time studying than the other group.","They were tested earlier than the other group.","They knew more about science before the study began."],

 ["研究の結論も最後の提案も、「読み直すより、自分で思い出す練習の方が記憶に残る」という内容です。","最初に紹介される多くの学生のやり方ですが、本文はそれを However で否定する流れです。","記事が難しいという話ではありません。科学の記事は実験の材料にすぎません。","グループ学習の話は出ていません。group は実験の組分けの意味です。"],

EG_Q('ra10','r_ra_connector',4,"Which word or phrase best fills the blank?",["However","Therefore","For instance","As a result"],
 ["前の文は「機械による冷凍は両方の問題を解決した」という良い点、空欄の文は「しかし初めは大きく高価だった」という弱点です。逆の内容なので However（しかし）です。","Therefore（それゆえ）は理由→結論です。「問題を解決した」から「高価だった」という結論は出てきません。","For instance（たとえば）は例の合図です。大きく高価だったことは、問題を解決したことの例ではありません。","As a result（その結果）は原因→結果です。問題を解決した結果として機械が高価になったわけではありません。"],
 "空欄の前は「機械による冷凍は（天候と汚れの）両方の問題を解決した」とプラスの内容、後ろは「機械は最初大きくて高価で、家庭ではなく醸造所や食肉工場で主に使われた」とマイナスの内容です。プラス→マイナスの逆の流れなので However が入ります。","空欄に入る最も適切な語句はどれですか？","前がプラス、後ろがマイナス（またはその逆）なら However です。",
 "Long before electric refrigerators existed, people found ways to keep food cold. In the nineteenth century, workers in cold regions cut large blocks of ice from frozen lakes in winter and stored them in thick-walled buildings packed with sawdust, which slowed melting. The ice was then shipped to warmer cities, where it was delivered to homes and placed in insulated wooden boxes called iceboxes. This trade employed thousands of people, but it had obvious weaknesses. A mild winter meant a poor harvest, and the ice from polluted lakes could make people ill. Mechanical refrigeration, which produced cold by compressing and expanding gases, solved both problems. ____, the machines were large and expensive at first, so they were used mainly by breweries and meat-packing plants rather than by ordinary families. Only when smaller, cheaper models appeared in the twentieth century did the home refrigerator replace the icebox, and the ice-harvesting industry gradually disappeared.","____, the machines were large and expensive at first, so they were used mainly by breweries and meat-packing plants rather than by ordinary families."),

EG_Q('ra13','r_ra_connector',4,"Which word or phrase best fills the blank?",["For instance","However","In contrast","As a result"],
 ["前の文「逆の方法を取った都市もある」の具体例として、マーロウ・ベイ市の話が続くので For instance（たとえば）です。","However（しかし）は逆の内容をつなぎます。マーロウ・ベイの話は、前の文と同じ方向の内容です。","In contrast（対照的に）は違いを比べるときに使います。マーロウ・ベイは「逆の方法を取った都市」そのもので、比べる相手ではありません。","As a result（その結果）は原因→結果です。「逆の方法を取った」ことの結果ではなく、その中身を1つの都市で示しています。"],
 "空欄の前は Some cities（いくつかの都市）が逆の方法を取った、という大まかな文、後ろは the city of Marlow Bay（マーロウ・ベイ市）という1つの都市の具体的な話です。「大まかな話→具体的な1つ」の流れは例の合図なので For instance が入ります。","空欄に入る最も適切な語句はどれですか？","前が some / many などの大まかな話、後ろが固有名詞や数字の入った具体的な話なら For instance / For example です。",
 "When traffic jams become a daily problem, the obvious solution seems to be building more lanes. Yet transport researchers have long observed a pattern that defies this logic. When a congested road is widened, journeys become quicker for a while, and this encourages people who previously avoided the road to start using it. Some switch from trains or buses, others choose to live farther from work, and shops and offices move closer to the new road. Within a few years, the extra lanes are often as crowded as the old ones were. This effect, known as induced demand, explains why many expensive road projects fail to reduce congestion in the long term. Some cities have therefore taken the opposite approach. ____, the city of Marlow Bay closed one lane of its main avenue to cars and turned it into a bus and bicycle lane. Traffic did not collapse, as critics had predicted; instead, a portion of drivers simply changed how or when they travelled.","____, the city of Marlow Bay closed one lane of its main avenue to cars and turned it into a bus and bicycle lane."),

EG_Q('ra16','r_ra_study',3,"What surprised the organisers of the programme?",["The tutors' scores improved about as much as the younger students' scores.","The younger students' scores did not improve.","The tutors received extra mathematics lessons.","The younger students began to teach the older ones."],
 ["年上の生徒の点数も同じくらい上がったことが、主催者を驚かせました。","年下の生徒の点数は予想通り（As expected）上がりました。","年上の生徒は追加の授業を受けていない（received no extra lessons）と書かれています。","年下の生徒が年上の生徒に教えたという話はありません。"],
 "What surprised the organisers was that ～ は「主催者を驚かせたのは～ということだった」。質問の surprised がそのまま本文にあります。その前の As expected（予想通り）の内容（年下の生徒の点数が上がった）とは区別します。","このプログラムの主催者を驚かせたことは何ですか？","As expected（予想通り）と surprised / unexpectedly（意外にも）を区別すると、研究の「新しい発見」が見つかります。",
 "Teachers often assume that tutoring benefits mainly the student who receives help. A two-year programme run by the Harrowgate Education Trust suggests that the tutor may gain just as much. In the programme, fifteen-year-old students spent one hour a week helping twelve-year-olds with mathematics. As expected, the younger students' test scores improved. What surprised the organisers was that the older students' scores rose by a similar amount, even though they received no extra lessons themselves. Interviews offered an explanation: in order to explain a method clearly, the tutors had to understand why it worked, not merely how to apply it. Several said they had discovered gaps in their own knowledge while preparing. The trust also noted that the tutors' attendance improved, perhaps because they felt responsible for someone else. The organisers caution that the benefits depended heavily on training; tutors who were simply told to 'help' without guidance achieved much smaller gains.","What surprised the organisers was that the older students' scores rose by a similar amount, even though they received no extra lessons themselves."),
EG_Q('ra17','r_reason',4,"According to the interviews, why did the tutors' own scores improve?",["Explaining a method made them understand why it worked.","They were given easier tests than before.","They copied the younger students' answers.","Their teachers gave them extra homework."],
 ["方法を分かりやすく説明するには、なぜうまくいくのかを理解する必要があった、と書かれています。","テストが易しくなったという話はありません。","年下の生徒の答えを写したという話はありません。","追加の宿題の話は出ていません。"],

EG_Q('ra18','r_ra_infer',4,"What can be inferred about starting a similar programme?",["Tutors should be trained before they begin.","Only students with the highest scores should be tutors.","Tutors should be given extra mathematics lessons.","Tutors work best when they are simply told to help."],
 ["効果は訓練に大きく左右され、指導なしの生徒は伸びが小さかった、とあるので、始める前に訓練すべきだと推測できます。","成績の最も良い生徒だけを選ぶべきだとは書かれていません。","教える側は追加の授業なしで点数が上がったので、追加の授業が必要とは言えません。","ただ「助けて」と言われただけの生徒は、伸びがずっと小さかった、とあります。"],

EG_Q('ra19','r_ra_connector',4,"Which word or phrase best fills the blank?",["In contrast","As a result","For instance","Therefore"],
 ["座り続けた日（血糖値が大きく上がった）と、歩く休けいのある日（上がり方が約30％小さい）を比べているので、In contrast（対照的に）です。","As a result（その結果）は原因→結果です。座り続けた日に血糖値が上がったことが、別の日の結果の原因ではありません。","For instance（たとえば）は例の合図です。歩いた日の結果は、座り続けた日の例ではありません。","Therefore（それゆえ）も理由→結論の言葉で、2つの日を比べる場面には合いません。"],
 "空欄の前は on the continuous-sitting day（座り続けた日）、後ろは on the day with walking breaks（歩く休けいのある日）の話です。2つの条件の結果を並べて違いを示しているので、In contrast が入ります。On one day ～; on the other ～ のように2つの条件が出てきたら、比較の流れを考えます。","空欄に入る最も適切な語句はどれですか？","前後で「Aの場合」「Bの場合」と条件が入れかわり、結果が違うなら In contrast です。",
 "Office workers can spend more than eight hours a day sitting, and many health researchers now treat long periods of sitting as a risk in themselves, separate from a lack of exercise. A study at Corrin Medical College examined whether short breaks could reduce this risk. Adult volunteers spent two full days in a laboratory office. On one day, they sat continuously; on the other, they stood up and walked slowly for three minutes every hour. After meals, the volunteers' blood sugar rose sharply on the continuous-sitting day. ____, on the day with walking breaks, the rise was about thirty percent smaller. The researchers point out that the breaks added up to less than half an hour of very light activity, far less than a typical gym session. They do not claim that walking breaks can replace regular exercise. Instead, they argue that the two should be seen as working together: exercise builds fitness, while frequent movement prevents the body from staying inactive for too long.","____, on the day with walking breaks, the rise was about thirty percent smaller."),
EG_Q('ra20','r_detail',3,"How much activity did the walking breaks add up to in one day?",["Less than half an hour of light activity","About the same as a typical gym session","Three hours of walking","Thirty percent of the working day"],
 ["the breaks added up to less than half an hour of very light activity（30分未満のごく軽い運動）とあります。","ジムでの運動よりずっと少ない（far less than）と書かれています。","3は「3分間」の歩行で、3時間ではありません。","30％は血糖値の上がり方が小さくなった割合で、時間の長さではありません。"],

 "Office workers can spend more than eight hours a day sitting, and many health researchers now treat long periods of sitting as a risk in themselves, separate from a lack of exercise. A study at Corrin Medical College examined whether short breaks could reduce this risk. Adult volunteers spent two full days in a laboratory office. On one day, they sat continuously; on the other, they stood up and walked slowly for three minutes every hour. After meals, the volunteers' blood sugar rose sharply on the continuous-sitting day. ____, on the day with walking breaks, the rise was about thirty percent smaller. The researchers point out that the breaks added up to less than half an hour of very light activity, far less than a typical gym session. They do not claim that walking breaks can replace regular exercise. Instead, they argue that the two should be seen as working together: exercise builds fitness, while frequent movement prevents the body from staying inactive for too long.","The researchers point out that the breaks added up to less than half an hour of very light activity, far less than a typical gym session."),
EG_Q('ra21','r_ra_view',4,"What is the researchers' view of exercise and walking breaks?",["They play different roles and work best together.","Walking breaks can replace regular exercise.","Exercise is unnecessary for office workers.","Gym sessions are more effective than walking breaks in every way."],
 ["運動は体力をつけ、こまめな動きは体が長く動かないのを防ぐ、と役割を分けたうえで、2つは一緒に働くものだとしています。","walking breaks can replace regular exercise とは主張していない（do not claim）と、はっきり書かれています。","運動が不要とは言っていません。運動は体力をつけるものとされています。","あらゆる点でジムの方が良いとは書かれていません。血糖値の実験では、短い歩行にも効果がありました。"],
 "do not claim ～（～とは主張しない）でまず誤解を打ち消し、Instead（その代わりに）の後ろで本当の意見を述べています。the two should be seen as working together（2つは一緒に働くものと見るべきだ）、そしてコロン以下で exercise builds fitness / frequent movement prevents ～ と、それぞれの役割の違いを説明しています。","運動と歩く休けいについて、研究者の考えはどれですか？","do not claim ～. Instead, ～ の形は、Instead の後ろが本当の主張です。",
 "Office workers can spend more than eight hours a day sitting, and many health researchers now treat long periods of sitting as a risk in themselves, separate from a lack of exercise. A study at Corrin Medical College examined whether short breaks could reduce this risk. Adult volunteers spent two full days in a laboratory office. On one day, they sat continuously; on the other, they stood up and walked slowly for three minutes every hour. After meals, the volunteers' blood sugar rose sharply on the continuous-sitting day. ____, on the day with walking breaks, the rise was about thirty percent smaller. The researchers point out that the breaks added up to less than half an hour of very light activity, far less than a typical gym session. They do not claim that walking breaks can replace regular exercise. Instead, they argue that the two should be seen as working together: exercise builds fitness, while frequent movement prevents the body from staying inactive for too long.","Instead, they argue that the two should be seen as working together: exercise builds fitness, while frequent movement prevents the body from staying inactive for too long."),
EG_Q('ra22','r_reason',4,"Why did sales of large popcorn rise after the medium size was added?",["The large size seemed like good value compared with the medium.","The price of the large size was reduced.","The medium size quickly sold out.","The small size was no longer available."],
 ["中サイズと比べると、50セント高いだけでずっと多い大サイズがお得に見えた、とあります。","大サイズの値段（7ドル）は変わっていません。","中サイズはほとんど誰も買わなかった（Almost nobody bought）ので、売り切れてはいません。","小サイズがなくなったとは書かれていません。"],
 "Next to the medium（中サイズの横に並ぶと）、the large suddenly looked like a bargain（大サイズが急にお買い得に見えた）。コロン以下の only fifty cents more for much more popcorn（たった50セント多く払うだけで、ずっと多いポップコーン）がその中身です。値段そのものではなく、比べる相手が増えたことが原因です。","中サイズが加わった後、大サイズのポップコーンの売上が伸びたのはなぜですか？","good value / bargain などの評価の言葉は、本文の looked like / seemed（～に見えた）の文で確かめます。",
 "Economists once assumed that consumers compare options logically and choose the one that offers the best value. Research in behavioural economics has shown that our choices are far more sensitive to context. Consider the so-called decoy effect. A cinema chain called Brightway once sold small popcorn for three dollars and large popcorn for seven. Most customers bought the small size. The company then added a medium size priced at six and a half dollars. Almost nobody bought the medium, yet sales of the large size rose sharply. Next to the medium, the large suddenly looked like a bargain: only fifty cents more for much more popcorn. The medium option, in other words, existed not to be chosen but to change how the other options were perceived. Critics argue that such tactics manipulate customers, while defenders reply that no one is forced to buy anything. Whatever one's view, the evidence suggests that the way prices are presented can matter as much as the prices themselves.","Next to the medium, the large suddenly looked like a bargain: only fifty cents more for much more popcorn."),
EG_Q('ra23','r_ra_infer',4,"What was the real purpose of the medium size?",["To make customers view the large size differently","To increase sales of the small size","To offer customers the best value","To replace the small size"],
 ["選ばれるためではなく、ほかの選択肢の見え方を変えるために置かれた、とあります。実際に大サイズがお得に見えるようになりました。","実際に売上が伸びたのは大サイズで、小サイズを売るためではありません。","中サイズは6.5ドルで割高に見えるサイズで、最もお得な選択肢として置かれたのではありません。","小サイズの代わりにするという話はありません。"],
 "in other words（言いかえれば）は、前の内容をまとめ直す合図です。existed not to be chosen but to change how the other options were perceived は「選ばれるためではなく、ほかの選択肢の受け取られ方を変えるために存在した」。not A but B（AではなくB）の B が本当の目的で、直前の文から、見え方が変わったのは大サイズだと分かります。","中サイズの本当の目的は何でしたか？","in other words の文は筆者のまとめです。not A but B があれば B が答えです。",
 "Economists once assumed that consumers compare options logically and choose the one that offers the best value. Research in behavioural economics has shown that our choices are far more sensitive to context. Consider the so-called decoy effect. A cinema chain called Brightway once sold small popcorn for three dollars and large popcorn for seven. Most customers bought the small size. The company then added a medium size priced at six and a half dollars. Almost nobody bought the medium, yet sales of the large size rose sharply. Next to the medium, the large suddenly looked like a bargain: only fifty cents more for much more popcorn. The medium option, in other words, existed not to be chosen but to change how the other options were perceived. Critics argue that such tactics manipulate customers, while defenders reply that no one is forced to buy anything. Whatever one's view, the evidence suggests that the way prices are presented can matter as much as the prices themselves.","The medium option, in other words, existed not to be chosen but to change how the other options were perceived."),
EG_Q('ra24','r_ra_connector',3,"Which word or phrase best fills the blank?",["In contrast","As a result","For instance","Therefore"],
 ["町の鳥（高い声）と森の鳥（低い音も含む広い音域）を比べているので、In contrast（対照的に）です。","As a result（その結果）は原因→結果です。町の鳥の歌い方が、森の鳥の歌い方の原因ではありません。","For instance（たとえば）は例の合図です。森の鳥は町の鳥の例ではありません。","Therefore（それゆえ）は理由→結論で、2つの場所の鳥を比べる文には合いません。"],
 "空欄の前は The city birds（町の鳥）、後ろは birds in the forests（森の鳥）の話です。2つのグループの違い（高い声 ⇔ 低い音も多い）を並べているので、In contrast が入ります。","空欄に入る最も適切な語句はどれですか？","前後で主語が「町の～」「森の～」のように対になっていたら、比較の In contrast を考えます。",
 "Birds that live in cities face a problem their countryside relatives do not: constant noise from traffic, construction and machinery. Because most of this noise is low-pitched, it tends to cover the lower notes of birdsong. Researchers have noticed that several species respond by adjusting their songs. A team led by Dr. Amara Senn at Westbrook University recorded great tits in a busy city centre and in nearby forests. The city birds sang at a noticeably higher pitch, and some also sang earlier in the morning, before rush-hour traffic began. ____, birds in the forests used a wider range of notes, including many low ones. The researchers believe the change helps city birds' songs be heard by possible mates and rivals. However, they also raise a concern: females of some species appear to prefer lower songs, which are often produced by larger, healthier males. If city males are forced to sing higher, they may be less attractive, even if they are in good condition.","____, birds in the forests used a wider range of notes, including many low ones."),
EG_Q('ra25','r_reason',4,"Why do many city birds sing at a higher pitch?",["City noise is mostly low and covers low notes.","Higher songs attract more females.","Larger birds live in the city.","They sing before the traffic starts."],
 ["騒音の多くは低い音なので、歌の低い音がかき消される、と書かれています。","メスはむしろ低い歌を好むことがある、とあります。","町に大きな鳥が住んでいるという話はありません。","朝早く歌うのは、高い声とは別のもう1つの変化で、高く歌う理由ではありません。"],
 "Because most of this noise is low-pitched（この騒音のほとんどは低い音なので）、it tends to cover the lower notes of birdsong（鳥の歌の低い音をおおいがちだ）。低い音が聞こえにくいから高く歌う、という原因と結果の関係です。研究者も、高い歌は相手に聞こえやすくするためだと考えています。","多くの町の鳥が高い声で歌うのはなぜですか？","Because ～ が文の最初にあるときは、コンマの前までが理由です。",
 "Birds that live in cities face a problem their countryside relatives do not: constant noise from traffic, construction and machinery. Because most of this noise is low-pitched, it tends to cover the lower notes of birdsong. Researchers have noticed that several species respond by adjusting their songs. A team led by Dr. Amara Senn at Westbrook University recorded great tits in a busy city centre and in nearby forests. The city birds sang at a noticeably higher pitch, and some also sang earlier in the morning, before rush-hour traffic began. ____, birds in the forests used a wider range of notes, including many low ones. The researchers believe the change helps city birds' songs be heard by possible mates and rivals. However, they also raise a concern: females of some species appear to prefer lower songs, which are often produced by larger, healthier males. If city males are forced to sing higher, they may be less attractive, even if they are in good condition.","Because most of this noise is low-pitched, it tends to cover the lower notes of birdsong."),

EG_Q('ra27','r_ra_main',4,"What is the main point of the passage?",["A grammar mistake can show that a child is learning rules.","Parents should correct children's mistakes immediately.","Irregular verbs are impossible for children to learn.","Children learn language mainly by copying adults."],

 "文章は「親は心配するが、言語学者は進歩のしるしと見る」と始まり、therefore（それゆえ）の文で「この間違いは、子どもがまねではなく一般的な規則を見つけた証拠だ」とまとめています。最後の文の active builders of grammar（文法を自分で組み立てる者）も同じ主旨です。","本文の要点は何ですか？","主旨は、but で始まる専門家の見方と、therefore / suggests の文にまとめられます。",
 "Young children learning English often make a curious mistake. After correctly saying 'went' for some time, many suddenly begin to say 'goed' instead. Parents may worry that their child's language is getting worse, but linguists see this as a sign of progress. At first, children memorise 'went' as a single word, without understanding how it relates to 'go'. Later, they notice that most verbs form the past tense by adding '-ed', and they begin to apply this rule to every verb they know, including irregular ones. The mistake therefore shows that the child has discovered a general rule rather than simply copying what adults say. Indeed, children hear 'goed' very rarely, if ever, so they cannot have learned it by imitation. Eventually, through continued exposure, they learn which verbs are exceptions, and 'went' returns. This pattern, observed in many languages, suggests that children are active builders of grammar, not passive recorders of speech.","The mistake therefore shows that the child has discovered a general rule rather than simply copying what adults say."),

EG_Q('ra30','r_ra_connector',3,"Which word or phrase best fills the blank?",["As a result","However","In contrast","Similarly"],

 "空欄の前は「慈善団体は売れる量よりはるかに多くの服を受け取る」、後ろは「寄付された服の大部分が海外に送られるか、埋め立て地へ行く」。売り切れない（原因）から、余った服がよそへ回される（結果）という関係なので As a result が入ります。","空欄に入る最も適切な語句はどれですか？","後ろの文が、前の文の「その後どうなるか」を表していたら As a result です。",
 "Clothing has never been cheaper. Many retailers now release new designs every few weeks, and shoppers in wealthy countries buy far more garments than they did a generation ago, while keeping each item for a shorter time. The environmental cost of this pattern is considerable. Growing cotton requires large amounts of water, and synthetic fabrics such as polyester are made from oil and shed tiny plastic fibres every time they are washed. Donating unwanted clothes may seem like a solution, but charities receive far more than they can sell. ____, a large portion of donated clothing is shipped abroad or sent to landfill. Some brands have responded by offering repair services or collecting old garments for recycling, although turning mixed fabrics back into usable fibre remains technically difficult. Perhaps the most effective step is also the simplest: buying fewer, better-made clothes and wearing them for longer.","____, a large portion of donated clothing is shipped abroad or sent to landfill."),

EG_Q('ra33','r_ra_connector',4,"Which word or phrase best fills the blank?",["However","As a result","For instance","Therefore"],
 ["前の文は「行員の数は大きく減ると予想された」、空欄の文は「実際には何年も減らなかった」。予想と事実が逆なので However（しかし）です。","As a result（その結果）だと「減ると予想された結果、減らなかった」となり、意味が通りません。","For instance（たとえば）は例の合図です。減らなかったことは、予想の例ではありません。","Therefore（それゆえ）も理由→結論の言葉で、予想と逆の事実をつなぐことはできません。"],
 "空欄の前は expected the number of bank clerks to fall sharply（行員の数が急に減ると予想した）、後ろは did not fall for years（何年も減らなかった）。expected（予想した）の後に、それと逆の実際の結果が来る流れなので However が入ります。","空欄に入る最も適切な語句はどれですか？","expected / thought / believed（予想した・思われていた）の次の文には、予想と逆の事実が来やすく、However の出番です。",
 "Whenever a new machine appears in the workplace, people fear that it will take away jobs. The history of automatic cash machines offers a more complicated picture. When these machines spread through banks, many observers expected the number of bank clerks to fall sharply, since counting and handing out cash had been a large part of their work. ____, the number of clerks in many places did not fall for years. Because each branch now needed fewer clerks, banks could afford to open more branches, and the clerks who remained spent more time advising customers and selling services. The job did not disappear; it changed. This does not mean that automation never destroys jobs. Some tasks vanish completely, and workers who cannot learn new skills may suffer. The lesson is that predictions based only on which tasks a machine can do are often mistaken, because they ignore how businesses and workers adapt.","____, the number of clerks in many places did not fall for years."),

const egPassageHtml = text => {
  let sentences = [];

    sentences = [...new Intl.Segmenter('en', { granularity: 'sentence' }).segment(String(text))].map(x => x.segment.trim()).filter(Boolean);
  } catch (e) {
    sentences = (String(text).match(/[^.!?]+[.!?]+|[^.!?]+$/g) || []).map(x => x.trim()).filter(Boolean);
  }
  if (!sentences.length) sentences = [String(text)];

  choose() {
    const S = this.S, now = Date.now(), cat = this.storyCat(true), g = this.goal();
    const catOk = k => cat === 'all' || this.catOf(k) === cat;
    const si = this.sw.findIndex(w => this.count >= w.at && catOk(w.k));
    if (si >= 0) { const w = this.sw.splice(si, 1)[0]; const q = this.build(w.k); if (q) return Object.assign(q, { weak: true, src: 'sw' }); }
    const due = Object.keys(S.rev).filter(k => S.rev[k].due <= now && catOk(k) && !this.recent.includes(k));
    if (due.length && chance(0.4)) { const q = this.build(pick(due)); if (q) return Object.assign(q, { weak: true, src: 'due' }); }
    const c = cat === 'all' ? wpick([[g.cat[0], 'vocab'], [g.cat[1], 'grammar'], [g.cat[2], 'idiom'], [g.cat[3], 'reading']].filter(e => e[0] > 0)) : cat;
    if (c === 'vocab' || (c === 'idiom' && chance(0.65))) return Object.assign(this.fromItem(this.pickItem(c === 'vocab' ? 'w' : 'i')), { weak: false, src: 'new' });
    const rcap = c === 'reading' ? this.readingCap(g) : 4;
    const allowed = q => q.cat === c && g.d[q.d - 1] > 0 && (c !== 'reading' || q.d <= rcap);
    let pool = EG_QS.filter(q => allowed(q) && !this.recentQ.includes(q.id));
    if (!pool.length) pool = EG_QS.filter(allowed);
    if (!pool.length) pool = EG_QS.filter(q => q.cat === c);
    return Object.assign(this.fromCurated(wpick(pool.map(q => [g.d[q.d - 1] || 0.2, q]))), { weak: false, src: 'new' });
  },
  record(Q, ok) {
    const S = this.S, now = Date.now(), d = egDayKey();
    const day = S.daily[d] || (S.daily[d] = { a: 0, c: 0, sec: 0, goal: this.goalCount() }); day.a++; if (ok) day.c++;
    const t = S.tot[Q.cat] || (S.tot[Q.cat] = { a: 0, c: 0 }); t.a++; if (ok) t.c++;
    S.n++;
    S.mast[Q.key] = ok ? Math.min(9, (S.mast[Q.key] || 0) + 1) : 0;
    if (!ok) {
      S.miss[Q.key] = (S.miss[Q.key] || 0) + 1; S.rev[Q.key] = { st: 0, due: now + EG_DAY };
      if (!this.sw.some(w => w.k === Q.key)) this.sw.push({ k: Q.key, at: this.count + 3 });
    } else if (Q.src === 'due' && S.rev[Q.key]) {
      const r = S.rev[Q.key]; r.st++; if (r.st >= 3) delete S.rev[Q.key]; else r.due = now + [1, 3, 7][r.st] * EG_DAY;
    }
    this.save();
  },
  noteCause(k, id, previous) {
    if (!this.keyOk(k) || !EG_CAUSES.some(x => x.id === id)) return;
    const c = this.S.cause[k] || (this.S.cause[k] = { last: '', n: {}, at: 0 });
    if (!c.n || typeof c.n !== 'object') c.n = {};
    if (previous && previous !== id && c.n[previous]) c.n[previous]--;
    if (previous !== id) c.n[id] = (c.n[id] || 0) + 1;
    c.last = id; c.at = Date.now(); this.save();
  },
  causeName(k) {
    const c = this.S.cause[k], d = c && EG_CAUSES.find(x => x.id === c.last);
    return d ? d.n : '';
  },
  progress(g) {
    g = g || this.goal();
    const set = EG_ITEMS.filter(x => g.tiers[x.lv]), m = this.S.mast;
    const words = set.filter(x => x.kind === 'w'), idioms = set.filter(x => x.kind === 'i');
    const kn = Object.keys(EG_KN).filter(k => EG_QS.some(q => q.k === k && g.d[q.d - 1] > 0));
    const done = a => a.filter(x => (m[x.key] || 0) >= 2).length;
    return { w: done(words), wt: words.length, i: done(idioms), it: idioms.length, k: kn.filter(k => (m[k] || 0) >= 2).length, kt: kn.length };
  },

  /* ---------- the question window shown in battle ---------- */
  ask(o = {}) {
    if (!this.S) this.load();
    const Q = this.choose();
    this.cur = Q; this.count++;
    this.recent.push(Q.key); if (this.recent.length > 14) this.recent.shift();
    if (Q.id) { this.recentQ.push(Q.id); if (this.recentQ.length > 10) this.recentQ.shift(); this.lastId[Q.key] = Q.id; }
    if (Q.dir != null) this.lastDir[Q.key] = Q.dir;
    const S = this.S, base = [20, 40, 0][S.set.time] * 60 * (Q.passage ? Math.max(2.5, Q.passage.split(' ').length / 45) : Q.cat === 'reading' ? 2.5 : 1), lim = base ? base + 5 * 60 : 0;
    const voice = this.canSpeak() && S.set.voice;
    const rd = !!Q.passage, win = mkWin('qz' + (rd ? ' rd' : ''), 6, rd ? 4 : 46, 244); win.style.maxHeight = px(rd ? 228 : 172);
    const stars = '★'.repeat(Q.d) + '☆'.repeat(Math.max(0, 3 - Q.d));
    const sayBtn = (lab, target = 'answer') => voice ? `<button type="button" class="qsay" data-say="${target}" aria-label="英語の発音を聞く">${lab}</button>` : '';
    win.innerHTML =
      `<div class="qh"><span class="chip">${EG_CATS[Q.cat].c}・${EG_CATS[Q.cat].n}</span><span class="st" aria-label="難しさ${Q.d}">${stars}</span>${Q.weak ? '<span class="wk">苦手</span>' : ''}` +
      `<span class="who">${esc(o.who ? o.who.name : '')}の言葉</span><span class="tm num">${lim ? Math.ceil(lim / 60) + '秒' : ''}</span></div>` +
      (lim ? '<div class="qbar"><i></i></div>' : '') +
      (Q.passage ? `<div class="qp"><div class="qptop"><b>本文</b><span>一文ずつ読もう</span>${sayBtn('本文を聞く', 'passage')}</div><div class="qbody" lang="en">${egPassageHtml(Q.passage)}</div></div>` : '') +
      `<div class="qq${Q.dir === 1 ? ' ja' : ''}">${Q.prompt}${Q.sub ? ` <small>${Q.sub}</small>` : ''}${Q.dir === 0 ? sayBtn('発音') : ''}</div>` +
      (Q.passage && Q.ja ? `<div class="qja"><span>質問の意味</span>${esc(Q.ja)}</div>` : '') +
      (Q.passage && Q.lk ? `<div class="qreadhint"><span>探し方</span>${esc(Q.lk)}</div>` : '') +
      `<div class="qos${Q.long && !rd ? ' g1' : ''}">${Q.opts.map((op, i) => `<div class="qo" data-i="${i}" role="button" aria-label="${i + 1}番 ${esc(op.t)}"><span class="k">${i + 1}</span><span class="w"${op.en ? ' lang="en"' : ''}>${esc(op.t)}</span></div>`).join('')}</div>` +
      (S.n < 3 && !Q.passage ? '<div class="qhint">正解すると攻撃が決まり、間違えると反動でダメージを受けます。<br>（↑↓←→と決定ボタン、数字キー、タップで答えられます）</div>' : '');
    const bindSay = () => win.querySelectorAll('.qsay').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); this.speak(b.dataset.say === 'passage' ? Q.passage : Q.say); }));
    bindSay();
    return new Promise(res => {
      const startedAt = Date.now();
      let sel = 0, el = 0, phase = 'q', ansAt = 0, hold = false, result = null;
      const ops = [...win.querySelectorAll('.qo')], per = Q.long && !rd ? 1 : 2;
      const bar = win.querySelector('.qbar'), barI = bar && bar.querySelector('i'), tm = win.querySelector('.tm');
      const drawSel = () => ops.forEach((e, i) => e.classList.toggle('sel', i === sel));
      drawSel();
      const finish = () => { if (phase === 'done') return; phase = 'done'; if (result) this.addStudyTime((Date.now() - startedAt) / 1000); UI.pop(h); win.remove(); this.active = null; try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { } res(result); };
      const decide = i => {
        if (phase !== 'q') return;
        phase = 'r'; ansAt = el;
        const ok = i === Q.ans, timeout = i < 0;
        const fastCap = (Q.cat === 'reading' ? 15 : 6) * 60;
        const fast = ok && el <= (lim ? Math.min(base * 0.3, fastCap) : 4 * 60);
        result = { ok, timeout, fast, weak: ok && Q.weak, cat: Q.cat };
        const before = (S.mast[Q.key] || 0) >= 2;
        this.record(Q, ok);
        const learned = !before && (S.mast[Q.key] || 0) >= 2 && EG_IBY[Q.key];
        Snd.fx(ok ? (fast ? 'light' : 'ok') : 'buzz');
        const vd = ok ? (fast ? '◎ すばやく正解！' : '○ 正解！') : timeout ? '⏱ 時間切れ' : '× 不正解';
        const ef = ok ? (learned ? '覚えた言葉に追加' : (fast ? '会心の力が宿った' : '言葉の力が宿った')) + (Q.weak ? '・苦手克服' : '') : '灯の力が跳ね返る';
        const A = Q.opts[Q.ans], C = i >= 0 ? Q.opts[i] : null;
        win.classList.add('res');
        win.innerHTML =
          `<div class="qh"><span class="vd ${ok ? 'ok' : 'ng'}">${vd}</span><span class="ef">${ef}</span></div>` +
          `<div class="qr">` +
          (Q.filled ? `<div class="fl">${Q.filled}</div>` : '') +
          `<div class="an"><span class="lb ok">正解</span><b${A.en ? ' lang="en"' : ''}>${Q.ans + 1}. ${esc(A.t)}</b>${sayBtn('発音')}</div>` +
          (C && !ok ? `<div class="an"><span class="lb ng">あなた</span><b${C.en ? ' lang="en"' : ''}>${i + 1}. ${esc(C.t)}</b></div><p class="why">${esc(C.why)}</p>` : '') +
          `<p>${esc(Q.ex)}</p>` +
          (Q.ja ? `<p><span class="lb">${Q.passage ? '質問の意味' : '文の意味'}</span>${esc(Q.ja)}</p>` : '') +
          (Q.ev ? `<p><span class="lb">根拠</span><span lang="en">${esc(Q.ev).replace('____', '<mark>' + esc(Q.opts[Q.ans].t) + '</mark>')}</span></p>` : '') +
          `<p class="lk"><span class="lb">次はここを見る</span>${esc(Q.lk)}</p></div>` +
          (!ok ? `<div class="qcause"><div class="qcl">分からなかった原因を1つ選ぶ</div><div class="qcopts">${EG_CAUSES.map(c => `<button type="button" class="qcbtn" data-cause="${c.id}" aria-pressed="false">${c.n}</button>`).join('')}</div><p class="qctip">選ぶと、次にやることを表示します。</p></div>` : '') +
          `<div class="qf"><span class="qhint">↑↓でスクロール${ok && S.set.auto ? '・Bで一時停止' : ''}</span><a class="qrep" href="${egReportUrl(Q, C)}" target="_blank" rel="noopener">誤りを報告</a><button type="button" class="qnext">次へ ▶</button></div>`;
        bindSay();
        let selectedCause = '';
        win.querySelectorAll('.qcbtn').forEach(b => b.addEventListener('click', ev => {
          ev.stopPropagation();
          const id = b.dataset.cause, c = EG_CAUSES.find(x => x.id === id); if (!c) return;
          this.noteCause(Q.key, id, selectedCause); selectedCause = id;
          win.querySelectorAll('.qcbtn').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
          const tip = win.querySelector('.qctip'); if (tip) tip.textContent = c.tip;
          Snd.fx('cur'); hold = true;
        }));
        win.querySelector('.qnext').addEventListener('click', ev => { ev.stopPropagation(); if (el - ansAt > 8) { Snd.fx('cur'); finish(); } });
        win.querySelector('.qr').addEventListener('pointerdown', () => { hold = true; });
        win.querySelector('.qrep').addEventListener('click', ev => { ev.stopPropagation(); hold = true; });
        win.querySelector('.qrep').addEventListener('pointerdown', ev => { ev.stopPropagation(); hold = true; });
        if (voice && !ok) hold = true;
      };
      const h = {
        update: () => {
          el++;
          if (phase === 'q') {
            if (lim) {
              const rem = Math.max(0, lim - el);
              if (barI) barI.style.transform = `scaleX(${rem / lim})`;
              const warn = rem <= 5 * 60; if (bar) bar.classList.toggle('warn', warn); if (tm) { tm.textContent = Math.ceil(rem / 60) + '秒'; tm.classList.toggle('warn', warn); }
              if (rem <= 0) { decide(-1); return; }
            }
            let s = sel;
            if (per === 2) {
              if (In.repeat('right') || In.repeat('left')) s = sel ^ 1;
              else if (In.repeat('down') || In.repeat('up')) s = sel ^ 2;
            } else {
              if (In.repeat('down')) s = (sel + 1) % 4; else if (In.repeat('up')) s = (sel + 3) % 4;
            }
            if (s !== sel) { sel = s; Snd.fx('cur'); drawSel(); }
            if (In.pressed('a') && el > 6) decide(sel);
          } else if (phase === 'r') {
            const qr = win.querySelector('.qr');
            if (In.repeat('down')) { qr.scrollTop += U * 14; hold = true; }
            else if (In.repeat('up')) { qr.scrollTop -= U * 14; hold = true; }
            if (In.pressed('b')) hold = true;
            if (el - ansAt > 10 && In.pressed('a')) { Snd.fx('cur'); finish(); }
            else if (result.ok && S.set.auto && !hold && el - ansAt > 200 + 5 * 60) finish();
          }
        },
      };
      ops.forEach((e, i) => e.addEventListener('click', ev => { ev.stopPropagation(); if (phase === 'q' && el > 6) { sel = i; drawSel(); decide(i); } }));
      this.active = { pick: i => { if (phase === 'q' && el > 6 && i < ops.length) { sel = i; drawSel(); decide(i); } } };
      UI.push(h);
    });
  },

  /* ---------- goal picker ---------- */
  goalHtml(g) {
    const p = this.progress(g), tiers = Object.keys(g.tiers).map(t => EG_TIER[t]).join('・');
    return `${esc(g.note)}<br><small>出題の中心：${tiers}　単語${p.wt}語・熟語${p.it}個（覚えた数：${p.w + p.i}）</small>`;
  },
  async chooseGoal(first) {
    if (!this.S) this.load();
    if (first) { await say(first === 'new' ? '最後に、英語の目標を選んでください。\f選んだ目標に合わせて、戦闘で出る問題の難しさが変わります。' : 'この記録には、英語の目標がまだ設定されていません。\f戦闘で出る問題の難しさを決めるため、目標を選んでください。'); Msg.close(); }
    const cur = EG_GOALS.findIndex(g => g.id === this.S.set.goal);
    const desc = mkWin('desc gd', 6, 126, 244, 92);
    const lw = new ListWin({ x: 6, y: 6, w: 244, rows: 6, title: '目標', cancel: !first, sel: cur >= 0 ? cur : 1,
      items: EG_GOALS.map((g, i) => ({ t: g.n, r: i === cur ? '選択中' : '' })), onMove: i => { desc.innerHTML = this.goalHtml(EG_GOALS[i]); } });
    const r = await lw.choose(); lw.close(); desc.remove();
    if (r < 0) return false;
    this.S.set.goal = EG_GOALS[r].id; this.save();
    Snd.fx('save');
    await say(`目標を[y]「${EG_GOALS[r].n}」[/]に設定しました。\f${first ? 'あとからメニューの「英語」→「目標」でいつでも変更できます。' : '次の戦闘から出題が変わります。'}`); Msg.close();
    return true;
  },

  /* ---------- field menu: records, lectures, weak list, settings ---------- */
  async view(html, title, onBind) {
    const wv = mkWin('statusv egv', 6, 6, 244, 212);
    wv.innerHTML = (title ? `<div class="ttl">${esc(title)}</div>` : '') + `<div class="egb">${html}</div><div class="egc">Aボタン・ここをタップで閉じる　↑↓でスクロール</div>`;
    const b = wv.querySelector('.egb');
    if (onBind) onBind(wv);
    await new Promise(res => {
      const h = { update() { if (In.repeat('down')) b.scrollTop += U * 14; else if (In.repeat('up')) b.scrollTop -= U * 14; else if (In.pressed('a') || In.pressed('b') || In.pressed('menu') || UI.tapped()) { Snd.fx('cancel'); UI.pop(h); res(); } } };
      UI.push(h);
    });
    wv.remove();
  },
  streak() {
    const S = this.S; let n = 0; const d = new Date();
    if (!(S.daily[egDayKey(d.getTime())] || {}).a) d.setDate(d.getDate() - 1);
    for (; ;) { const k = egDayKey(d.getTime()); if ((S.daily[k] || {}).a > 0) { n++; d.setDate(d.getDate() - 1); } else break; }
    return n;
  },
  recordHtml() {
    const S = this.S, today = S.daily[egDayKey()] || { a: 0, c: 0 }, g = this.goal(), p = this.progress(g);
    const pct = (c, a) => a ? Math.round(c / a * 100) + '%' : '―';
    const all = Object.values(S.tot).reduce((s, x) => ({ a: s.a + (x.a || 0), c: s.c + (x.c || 0) }), { a: 0, c: 0 });
    const now = Date.now(), dueN = Object.values(S.rev).filter(r => r.due <= now).length;
    const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push({ lab: i ? '日月火水木金土'[d.getDay()] : '今日', a: (S.daily[egDayKey(d.getTime())] || {}).a || 0 }); }
    const mx = Math.max(5, ...days.map(d => d.a));
    const row = (k, v) => `<div class="k"><b>${k}</b><span class="num">${v}</span></div>`;
    const meter = (lab, a, b) => `<div class="egc2"><span>${lab}</span><div class="bar"><i style="width:${b ? Math.round(a / b * 100) : 0}%"></i></div><span class="num">${a}/${b}</span></div>`;
    return this.dailyHtml() + `<div class="egh">学習目標：${esc(g.n)}</div>${meter('単語', p.w, p.wt)}${meter('熟語', p.i, p.it)}${meter('文法・読解', p.k, p.kt)}<p class="egm">2回続けて正解した言葉を「覚えた」と数えます。間違えると数え直しになります。</p>` +
      `<div class="eg2">${row('今日の回答', today.a + '問')}${row('今日の正解', today.c + '問（' + pct(today.c, today.a) + '）')}${row('累計の回答', all.a + '問')}${row('累計の正答率', pct(all.c, all.a))}${row('連続学習', this.streak() + '日')}${row('復習待ち', dueN + '件（全' + Object.keys(S.rev).length + '件）')}</div>` +
      `<div class="egh">直近7日の回答数</div><div class="egw">${days.map(d => `<div><span class="num">${d.a}</span><i style="height:${Math.max(2, Math.round(d.a / mx * 34))}px"></i><small>${d.lab}</small></div>`).join('')}</div>` +
      `<div class="egh">分野ごとの正答率</div>${Object.keys(EG_CATS).map(c => { const t = S.tot[c] || { a: 0, c: 0 }; return `<div class="egc2"><span>${EG_CATS[c].n}</span><div class="bar"><i style="width:${t.a ? Math.round(t.c / t.a * 100) : 0}%"></i></div><span class="num">${pct(t.c, t.a)}</span></div>`; }).join('')}` +
      `<p class="egn">本作の英語の問題・解説はすべて独自に作成したものです。特定の試験団体とは関係がなく、試験の点数や合格を保証するものではありません。練習できるのは「読む力」（単語・熟語・文法・長文）で、聞く・話す・書く練習は含みません。</p>`;
  },
  lectureHtml(k) {
    const K = EG_KN[k], n = EG_QS.filter(q => q.k === k).length, m = this.S.miss[k] || 0;
    const cause = this.causeName(k);
    return `<p class="egl">${esc(K.l)}</p><p class="egm">この知識の問題：${n}問${m ? `　これまでのミス：${m}回` : ''}${cause ? `　最近の原因：${esc(cause)}` : ''}${this.S.rev[k] ? '　（復習待ち）' : ''}</p>`;
  },
  itemHtml(w) {
    const m = this.S.miss[w.key] || 0, r = this.S.rev[w.key], ms = this.S.mast[w.key] || 0;
    const cause = this.causeName(w.key);
    return `<p class="egl"><span lang="en" style="font-size:${px(13)};font-weight:700">${esc(w.en)}</span>　<span class="egm">${esc(EG_POS[w.pos])}・${EG_TIER[w.lv]}</span>${this.canSpeak() ? ' <button type="button" class="qsay">発音</button>' : ''}</p><p class="egl">意味：${esc(w.ja)}</p>` +
      `<p class="egm">${ms >= 2 ? '覚えた言葉' : 'まだ覚えていない'}　これまでのミス：${m}回${cause ? `　最近の原因：${esc(cause)}` : ''}${r ? '　次の復習：' + (r.due <= Date.now() ? '今日' : Math.ceil((r.due - Date.now()) / EG_DAY) + '日後') : ''}</p>`;
  },
  showItem(w) { return this.view(this.itemHtml(w), w.kind === 'i' ? '熟語' : '単語', wv => { const b = wv.querySelector('.qsay'); if (b) b.addEventListener('pointerdown', ev => { ev.stopPropagation(); this.speak(w.en); }); }); },
  async lectures() {
    const keys = Object.keys(EG_KN);
    const lw = new ListWin({ x: 6, y: 6, w: 244, rows: 9, cls: 'eglist', title: '講義', items: keys.map(k => ({ t: EG_KN[k].t, r: EG_CATS[EG_KN[k].cat].c })) });
    for (; ;) { const r = await lw.choose(); if (r < 0) break; lw.el.hidden = true; await this.view(this.lectureHtml(keys[r]), EG_KN[keys[r]].t); lw.el.hidden = false; }
    lw.close();
  },
  async weakList() {
    const S = this.S, keys = Object.keys(S.miss).sort((a, b) => S.miss[b] - S.miss[a]).slice(0, 60);
    if (!keys.length) { await say('まだ間違えた言葉はありません。\f戦闘で間違えた問題がここに記録されます。'); Msg.close(); return; }
    const lab = k => EG_IBY[k] ? `${EG_IBY[k].en} ＝ ${EG_IBY[k].ja}` : EG_KN[k].t;
    const lw = new ListWin({ x: 6, y: 6, w: 244, rows: 9, cls: 'eglist', title: '苦手', items: keys.map(k => ({ t: lab(k), r: (S.mast[k] || 0) >= 2 ? '克服' : '×' + S.miss[k] })) });
    for (; ;) {
      const r = await lw.choose(); if (r < 0) break;
      const k = keys[r]; lw.el.hidden = true;
      if (EG_IBY[k]) await this.showItem(EG_IBY[k]); else await this.view(this.lectureHtml(k), EG_KN[k].t);
      lw.el.hidden = false;
    }

  idx() { const i = this.CH.findIndex(c => !c.done()); return i < 0 ? this.CH.length : i; },
  cur() { return this.CH[this.idx()] || null; },
  goalText(c) { c = c || this.cur(); if (!c) return '朝がもどった世界を、自由に歩いてみよう'; return typeof c.goal === 'function' ? c.goal() : c.goal; },
  nm(s) { return fillName(s); },
  logHtml() {

    const c = this.cur();

    out.push(Eigo.dailyHtml());
    out.push('<p class="egh">これまでのあらすじ</p>');
    for (let k = 0; k < Math.min(i, this.CH.length); k++) { const h = this.CH[k]; out.push(`<p><span class="lb">${h.no}</span><b>${h.t}</b><br>${esc(this.nm(h.sum()))}</p>`); }
    if (i === 0) out.push(`<p>${esc(this.nm(this.CH[0].sum()).split('。')[0])}。……旅は、まだ始まったばかりだ。</p>`);
    out.push(`<p class="egm">灯の数：${['翠', '蒼', '紅'].filter((n, j) => F(['flameG', 'flameB', 'flameR'][j])).join('・') || 'まだない'}　／　仲間：${G.party.map(m => m.name).join('・')}</p>`);

  },
  async log() { await Eigo.view(this.logHtml(), '旅の記録'); },
  // on-screen goal bar + chapter card when the goal changes
  bar: null, card: null, lastKey: null, shownOnce: false,
  tick() {

    if (!this.bar) { this.bar = document.createElement('div'); this.bar.className = 'objbar'; this.bar.addEventListener('pointerdown', e => { e.stopPropagation(); if (fieldIdle()) Field.run(() => Story.log()); }); scr.appendChild(this.bar); }
    if (!ok || !G || !G.party) { this.bar.hidden = true; return; }
    const c = this.cur(), key = c ? c.k : 'dawn';
    this.bar.hidden = false;
    const txt = `<i>目的</i>${esc(this.goalText(c))}<small>${esc(Eigo.dailyShort())}</small>`;
    if (this.bar._t !== txt) { this.bar.innerHTML = txt; this.bar._t = txt; }
    if (this.lastKey !== key) {
      const first = this.lastKey === null; this.lastKey = key;

  },
  showCard(c, resume) {

    const el = document.createElement('div'); el.className = 'chapcard';

    scr.appendChild(el); this.card = el;
    if (!resume) Snd.fx('light');
    setTimeout(() => el.classList.add('out'), 3600);
    setTimeout(() => { if (this.card === el) { el.remove(); this.card = null; } }, 4400);
  },
};

/* ---------- AI full-clear smoke test (only runs with ?ai-clear=1) ---------- */
async function aiFullClear() {
  const started = Date.now();
  const report = { status: 'running', maps: [], battles: [], flags: [], errors: [] };
  const show = (status, title, detail) => {
    let el = document.getElementById('ai-clear-report');
    if (!el) {
      el = document.createElement('section'); el.id = 'ai-clear-report'; document.body.appendChild(el);
      Object.assign(el.style, { position: 'fixed', zIndex: 9999, inset: 'auto 12px 12px 12px', maxWidth: '620px', margin: 'auto', padding: '18px 20px', border: '2px solid #d8b276', borderRadius: '10px', background: 'rgba(9,10,18,.96)', color: '#fff6df', fontFamily: 'sans-serif', boxShadow: '0 20px 70px #000', lineHeight: '1.55' });
    }
    el.dataset.status = status;
    el.innerHTML = `<strong style="display:block;color:${status === 'passed' ? '#9ce6ae' : status === 'failed' ? '#ff9b82' : '#f2c06a'};font-size:20px">${esc(title)}</strong><span style="font-size:13px;color:#c8cedd">${esc(detail)}</span>`;
  };
  const loadMap = (id, x, y) => {
    if (!MAPS[id]) throw new Error(`map missing: ${id}`);
    Field.load(id, x || 2, y || 2, 'down'); Scene.set(Field); report.maps.push(id);
  };
  const setLevel = (lv) => {
    for (const m of G.party) { m.lv = lv; m.exp = EXP_AT(lv); clampHM(m); }
    healAll();
  };
  const fight = async (id, map, bg, level) => {
    setLevel(level); loadMap(map, 8, 8); healAll();
    show('running', `AI通しプレイ中… ${report.battles.length + 1}/6`, ENEMIES[id].name);
    const result = await Battle.run([id], { boss: true, bg, bgm: id.startsWith('nox') ? 'final' : 'boss', noFlee: true, noAmbush: true, noTrans: true, noMusicResume: true });
    report.battles.push({ id, result, turns: Battle.turn });
    if (result !== 'win') throw new Error(`${id}: ${result}`);
  };
  try {
    show('running', 'AI通しプレイを開始', '通常のセーブデータには影響しません。');
    Snd.stop(0); TURBO = true; endCinematic(); UI.clear(); setFade(0); newGame('AIテスト'); G.clock = true;
    Battle.auto = true; Battle.aiLearning = true; Battle.aiAnswers = 0; Battle.aiCats = {};
    addItem('lantern'); addItem('hipotion', 40); addItem('hiether', 40); addItem('feather', 20);
    G.gold = 9999; G.flags.elder = true;
    loadMap('leaf', 13, 17); loadMap('world', 9, 35); loadMap('cave1', 15, 21);
    await fight('treant', 'cave1', 'cave', 8); G.flags.boss1 = G.flags.flameG = true; addItem('flameG');

    loadMap('marina', 10, 9); joinMember('mira'); G.flags.mira = true;
    loadMap('shrine1', 14, 20); loadMap('shrine2', 14, 18);
    await fight('serpent', 'shrine2', 'shrine', 14); G.flags.boss2 = G.flags.flameB = true; addItem('flameB');

    loadMap('lux', 14, 20); joinMember('sena'); G.flags.sena = true;
    loadMap('volcano1', 14, 20); loadMap('volcano2', 14, 18);
    await fight('dragon', 'volcano2', 'volcano', 22); G.flags.boss3 = G.flags.flameR = true; addItem('flameR');

    G.flags.bridge = true; loadMap('tower1', 11, 18); loadMap('tower2', 11, 18); loadMap('tower3', 11, 18);
    await fight('varga', 'tower3', 'tower', 28); G.flags.varga = true;
    await fight('nox1', 'tower3', 'throne', 34);
    await fight('nox2', 'tower3', 'throne', 34); G.flags.nox = G.flags.dawn = true;

    Battle.aiLearning = false; Battle.auto = false; TURBO = false; G.clock = false;
    loadMap('world', 27, 31); Field.ending = 1; Scene.set(Field); setFade(0);
    report.flags = ['elder', 'flameG', 'mira', 'flameB', 'sena', 'flameR', 'bridge', 'varga', 'nox', 'dawn'].filter(k => G.flags[k]);
    report.questions = Battle.aiAnswers; report.categories = Object.assign({}, Battle.aiCats); report.elapsedMs = Date.now() - started; report.status = 'passed';
    window.__AI_CLEAR_RESULT__ = report;
    show('passed', 'AI全クリア成功', `${report.questions}問正解（単語${report.categories.vocab || 0}・熟語${report.categories.idiom || 0}・文法${report.categories.grammar || 0}・長文${report.categories.reading || 0}）・${report.maps.length}マップ・6ボスを通過。`);
  } catch (e) {
    Battle.aiLearning = false; Battle.auto = false; TURBO = false;
    report.status = 'failed'; report.errors.push(String(e && e.stack || e)); report.elapsedMs = Date.now() - started;
    window.__AI_CLEAR_RESULT__ = report;
    console.error('AI full clear failed', e);
    show('failed', 'AI通しプレイ失敗', String(e && e.message || e));
  }
  return report;
}

function compareHtml(id) {
  const eq = EQUIP[id]; if (!eq) return itemDescHtml(id) + `<br><small>もっている数：${count(id)}</small>`;
  const key = eq.slot === 'w' ? 'atk' : eq.slot === 'a' ? 'def' : null;
  return `<div style="font-size:${px(7.5)};line-height:1.45">` + G.party.map(m => {
    if (eq.who && !eq.who.includes(m.id)) return `<div class="k"><b>${esc(m.name)}</b><span style="color:var(--dim)">装備できない</span></div>`;
    const tmp = Object.assign({}, m, { eq: Object.assign({}, m.eq, { [eq.slot]: id }) });
    const a = mstats(m), b = mstats(tmp);
    if (key) { const d = b[key] - a[key]; return `<div class="k"><b>${esc(m.name)}</b><span class="${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">${key === 'atk' ? '攻撃力' : '守備力'} ${d >= 0 ? '+' : ''}${d}</span></div>`; }
    const tot = ['atk', 'def', 'mag', 'spd'].reduce((s, k) => s + (b[k] - a[k]), 0);
    return `<div class="k"><b>${esc(m.name)}</b><span class="${tot > 0 ? 'up' : tot < 0 ? 'dn' : ''}">${m.eq.c === id ? '装備中' : tot >= 0 ? '↑' : '↓'}</span></div>`;
  }).join('') + `<div style="margin-top:${px(2)}">${itemDescHtml(id)}</div></div>`;
}
async function pickQty(max, price, x, y) {
  if (max <= 1) return max;
  const w = mkWin('qty', x, y, 92); let n = 1;
  const draw = () => { w.innerHTML = `<div class="k num" style="display:flex;justify-content:space-between"><span>× ${n}</span><span class="hl">${n * price}G</span></div><div style="font-size:${px(6.5)};color:var(--mist)">↑↓で 数を えらぶ</div>`; };
  draw();
  const r = await new Promise(res => {
    const h = { update() { let d = 0; if (In.repeat('up') || In.repeat('right')) d = In.repeat('right') ? 10 : 1; if (In.repeat('down') || In.repeat('left')) d = In.repeat('left') ? -10 : -1; if (d) { n = clamp(n + d, 1, max); if (d === 1 && n === max && false) n = 1; Snd.fx('cur'); draw(); } if (In.pressed('a') || UI.tapped()) { Snd.fx('ok'); UI.pop(h); res(n); } if (In.pressed('b')) { Snd.fx('cancel'); UI.pop(h); res(0); } } };
    UI.push(h);
  });
  w.remove(); return r;
}
async function shopBuy(id, gw) {
  const list = SHOPS[id];
  const info = mkWin('desc', 140, 30, 110, 124);
  const lw = new ListWin({ x: 6, y: 30, w: 130, rows: 9, title: '買う', items: list.map(i => ({ t: itemName(i), r: itemDef(i).price })), onMove: i => { info.innerHTML = compareHtml(list[i]); } });
  for (; ;) {
    lw.setItems(list.map(i => ({ t: itemName(i), r: itemDef(i).price, dis: itemDef(i).price > G.gold })));
    const r = await lw.choose(); if (r < 0) break;
    const iid = list[r], d = itemDef(iid), price = d.price;
    if (price > G.gold) { await say('おっと、 お金が 足りないみたいだね。'); Msg.close(); continue; }
    lw.el.classList.add('dimmed');
    const max = EQUIP[iid] ? 1 : Math.min(99 - count(iid), Math.floor(G.gold / price));
    if (max <= 0) { lw.el.classList.remove('dimmed'); await say('それ以上は もう 持てないよ。'); Msg.close(); continue; }
    const n = max > 1 ? await pickQty(max, price, 140, 156) : 1;
    lw.el.classList.remove('dimmed');
    if (!n) continue;
    G.gold -= price * n; addItem(iid, n); gw.refresh(); Snd.fx('coin');
    if (EQUIP[iid]) {
      const can = G.party.filter(m => !d.who || d.who.includes(m.id));
      await say(can.length ? `${d.name}だね。 まいど！\fいま ここで そうびしていくかい？` : `${d.name}だね。 まいど！`);
      if (can.length && (await ask(['はい', 'いいえ'])) === 0) {
        let m = can[0];
        if (can.length > 1) { Msg.close(); m = await pickMember({ title: '誰が？', x: 140, y: 30 }); }
        if (m && (!d.who || d.who.includes(m.id))) { if (m.eq[d.slot]) addItem(m.eq[d.slot]); m.eq[d.slot] = iid; removeItem(iid); clampHM(m); Snd.fx('item'); await say(`${m.name}は ${d.name}を そうびした！`); }
        else if (m) { await say(`${m.name}には そうびできないよ。`); }
      }
      Msg.close();
    } else { await say(`${d.name}を ${n}こ だね。 まいど！`); Msg.close(); }
    info.innerHTML = compareHtml(list[lw.sel]);
  }
  lw.close(); info.remove();
}
async function shopSell(gw) {
  for (; ;) {
    const list = G.inv.slice();
    const info = mkWin('desc', 140, 30, 110, 124);
    const lw = new ListWin({ x: 6, y: 30, w: 130, rows: 9, title: '売る', empty: '売れる ものが ない', items: list.map(e => ({ t: itemName(e.id), r: sellPrice(e.id), dis: !sellPrice(e.id) })), onMove: i => { info.innerHTML = list[i] ? itemDescHtml(list[i].id) + `<br><small>もっている数：${list[i].n}</small>` : ''; } });
    const r = await lw.choose();

    const e = list[r], p = sellPrice(e.id);

    if (ok) { removeItem(e.id, n); G.gold += p * n; gw.refresh(); Snd.fx('coin'); await say(`${itemName(e.id)}を ${n}こ、 ${p * n}ゴールドで 買いとったよ。`); Msg.close(); }
    lw.close(); info.remove();
  }
}

/* ---------- boot ---------- */
function boot(data) {
  Eigo.load();
  R3.init();
  layout(); bindPad();
  addEventListener('resize', layout);
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  applySettings(loadSettings());
  requestAnimationFrame(frameLoop);
  const go = () => {
    const testMode = new URLSearchParams(location.search);
    if (testMode.get('name-preview') === '1') { namePreview(); return; }
    if (testMode.get('reading-preview') === '1') { readingPreview(); return; }
    if (testMode.get('ai-clear') === '1') { aiFullClear(); return; }
    if (data && data.save) { continueGame(JSON.parse(data.save)).then(ok => { if (!ok) titleFlow(); }); }
    else {
      let toTitle = false; try { toTitle = !!sessionStorage.getItem('himori_to_title'); sessionStorage.removeItem('himori_to_title'); } catch (e) { }
      const sv = toTitle ? null : readSave();
      if (sv) continueGame(sv).then(ok => { if (!ok) titleFlow(); }); else titleFlow();
    }
  };
  if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('16px "DotGothic16"'), new Promise(r => setTimeout(r, 1500))]).then(go, go); else go();
}
