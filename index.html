Object.assign(EG_KN, {
 g_tb_partadj:{cat:'grammar',t:'～ing と ～ed の形容詞（interesting / interested）',l:'動詞の ～ing 形と ～ed 形（過去分詞）は、形容詞のように名詞を説明できます。感情を表す語では、～ing は「（人を）～させる側」、～ed は「～させられた側（そう感じている人）」です。例：The report was disappointing.（報告書はがっかりする内容だった）／The staff were disappointed.（スタッフはがっかりした）。感情以外でも、名詞が自分で「～している」なら ～ing（a growing company 成長している会社）、「～される」なら ～ed（the attached file 添付されたファイル）を使います。'},
 g_tb_wh:{cat:'grammar',t:'whoever / whichever / whatever / whether',l:'whoever は「～する人は誰でも」で、後ろの動詞の主語になります（Whoever arrives first gets a prize.）。whichever は「～するどれでも」で、決まった選択肢の中から選ぶときに使い、後ろに名詞を置けます（whichever plan you like）。whatever は「何であっても」で、Whatever the weather（天気がどうであれ）のように使います。whether は「～かどうか」で、whether to ～（～すべきかどうか）や whether A or B の形をとります。if も「～かどうか」の意味がありますが、if to ～ という形はありません。'},
 g_tb_pair:{cat:'grammar',t:'セットで使う接続詞（both A and B / either A or B）',l:'2つの言葉がセットになる接続詞（相関接続詞）は、片方が見えたらもう片方を探します。both A and B（AとBの両方）、either A or B（AかBのどちらか）、neither A nor B（AもBも～ない）、not only A but also B（AだけでなくBも）。動詞の形は、both A and B なら複数扱いです。either A or B・neither A nor B・not only A but also B では、動詞に近い方の B に合わせます。例：Neither the manager nor her assistants were there.'},
 g_tb_quant:{cat:'grammar',t:'数と量の言葉（each / every / much / many / few / little）',l:'数や量を表す言葉は、後ろの名詞が数えられるかどうかで決まります。many・few・a few は数えられる名詞の複数形（seats・visitors）、much・little・a little は数えられない名詞（time・information・interest）に使います。each・every は単数の名詞を取り、動詞も単数扱いです（Every employee has ～）。Each of the＋複数名詞 も単数扱いですが、every of という形はありません。a few・a little は「少しある」、few・little は「ほとんどない」という気持ちになります。'},
 v_tb_verb:{cat:'vocab',t:'仕事の動詞（postpone / implement / reimburse など）',l:'仕事の英語によく出る動詞は、後ろの名詞とのセットで覚えると選びやすくなります。postpone a meeting（会議を延期する）、implement a plan（計画を実施する）、reimburse expenses（経費を払い戻す）、accommodate guests（客を収容する）、submit a report（報告書を提出する）。最初の文字が同じ「似た見た目の動詞」が選択肢に並ぶことが多いので、空欄に入れて後ろの名詞や前置詞と自然につながるかを確かめます。'},
 v_tb_noun:{cat:'vocab',t:'仕事の名詞（invoice / itinerary / warranty など）',l:'ビジネスの文書によく出る名詞です。invoice（請求書）、receipt（領収書）、estimate（見積もり）、itinerary（旅程表）、agenda（会議の議題）、refund（返金）、warranty（保証）、inventory（在庫）、applicant（応募者）。同じ場面で使う名詞が選択肢に並ぶので、文の中の手がかり（pay・flight times・repairs など）から「何についての書類・話か」をつかんで選びます。'}
});
EG_QS.push(
EG_Q('tb1','g_pos',2,"Ms. Ortiz reviewed the contract ____ before signing it.",["thoroughly","thorough","thoroughness","more thorough"],
 ["reviewed（見直した）という動詞を「どのように」と説明するので、副詞の thoroughly（徹底的に）です。","thorough は形容詞で、名詞を説明する形です。動詞を説明するには ly を付けます。","thoroughness は「徹底ぶり」という名詞です。文の終わりに名詞を付け足すと形が崩れます。","more thorough は形容詞の比較の形で、動詞を説明できません。比べる相手（than）もありません。"],
 "Ms. Ortiz reviewed the contract（オルティスさんは契約書を見直した）で文はもう完成しています。そこに「どのように見直したか」を付け足すのは副詞（動詞などを説明する言葉）です。","オルティスさんは署名する前に、契約書を徹底的に見直した。","主語・動詞・目的語がそろった後ろの空欄は、ly の付いた副詞を探します。"),
EG_Q('tb2','g_pos',2,"The hotel offers a free shuttle bus for the ____ of its guests.",["convenience","convenient","conveniently","convene"],
 ["the と of の間で、前置詞 for の後ろに置く名詞が必要なので、名詞の convenience（便利さ）です。","convenient は「便利な」という形容詞で、the の後ろに名詞なしで置けません。","conveniently は副詞で、the の後ろには置けません。","convene は「（会議を）招集する」という動詞で、the の後ろには置けません。"],
 "the ＿ of its guests は「宿泊客の～」という名詞のまとまりです。the と of にはさまれた空欄には名詞が入ります。-ence は名詞によくある語尾です。for the convenience of ～ で「～の便宜のために」です。","そのホテルは宿泊客の便宜のため、無料のシャトルバスを用意している。","the ＿ of のはさまれた空欄は名詞。-tion・-ment・-ence・-ness を探します。"),
EG_Q('tb3','g_pos',3,"The new software has made the billing process much more ____.",["efficient","efficiently","efficiency","efficiencies"],
 ["make＋もの＋形容詞 で「ものを～の状態にする」。the billing process が efficient（効率的な）状態になる、という意味です。","efficiently は副詞で、make＋もの の後ろの「どんな状態か」を表す位置には置けません。","efficiency は「効率」という名詞で、more efficiency だと「処理＝効率」という関係になり、意味が通りません。","efficiencies は名詞の複数形で、efficiency と同じ理由で合いません。"],
 "has made the billing process ＿ は make＋目的語（「何を」）＋補語（その目的語がどんな状態かを表す言葉）の形です。補語の位置には形容詞が入ります。more が前にあっても、形容詞を選ぶ考え方は同じです。","新しいソフトウェアで、請求の手続きがずっと効率的になった。","make / keep / find＋もの＋空欄 は、ly の付かない形容詞を選びます。"),
EG_Q('tb4','g_pos',3,"Our support staff are ____ trained to answer technical questions.",["highly","high","height","higher"],
 ["trained（訓練された）という過去分詞を説明するので、副詞の highly（高度に・とても）です。","high は主に「高い」という形容詞で、副詞として使っても「高い所に」という位置の意味です。「高度に訓練された」は highly trained です。","height は「高さ」という名詞で、are と trained の間には入りません。","higher は形容詞の比較の形で、trained を説明できず、than もありません。"],
 "are trained（訓練されている）は受け身（be動詞＋過去分詞）です。be動詞と過去分詞の間に入って「どのくらい」を説明するのは副詞です。highly trained で「高度な訓練を受けた」というよく使うまとまりになります。","当社のサポートスタッフは、技術的な質問に答えられるよう高度な訓練を受けています。","be動詞と過去分詞の間の空欄は、副詞（ly）を探します。"),
EG_Q('tb5','g_perfect',2,"Mr. Grant ____ at the firm since it opened in 2015.",["has worked","works","worked","will work"],
 ["since（～以来ずっと）があり、2015年から今まで続いていることなので、現在完了の has worked です。","works は今の習慣を表す形で、since と組み合わせて「ずっと」の意味を出せません。","worked は過去形で、今とつながっていません。since ～ とは一緒に使いません。","will work は未来の形で、2015年からの話と合いません。"],
 "since it opened in 2015（2015年に開業して以来）は、過去から今まで続いている期間を表します。過去から今まで続くことは現在完了（have / has＋過去分詞）で表します。","グラントさんは、その会社が2015年に開業して以来ずっとそこで働いている。","since ～ があれば、まず have / has＋過去分詞 を探します。"),
EG_Q('tb6','g_passive',3,"All visitors ____ to sign in at the front desk.",["are required","require","requiring","have required"],
 ["来訪者は「求められる」側なので、受け身の are required（求められている）です。be required to ～ で「～することが求められる」です。","require だと来訪者が何かを求める側になり、後ろに求める内容（名詞）がありません。","requiring だけでは文の動詞になりません。","have required は「求めてきた」という能動の形で、来訪者が求める側になってしまいます。"],
 "require は「（人に）～を求める」という動詞です。主語の All visitors（すべての来訪者）は、受付で記帳することを「求められる」側です。受け身（be動詞＋過去分詞）にして are required to ～ とします。","すべての来訪者は、受付で記帳することが求められています。","be required to ～（～しなければならない）は、お知らせによく出るまとまりです。"),
EG_Q('tb7','g_passive',3,"The quarterly report ____ to all shareholders last Friday.",["was sent","sent","has been sent","is sending"],
 ["報告書は「送られる」側で、last Friday（先週の金曜日）は過去なので、過去の受け身の was sent です。","sent（送った）だと、報告書が自分で何かを送ったことになります。","has been sent は現在完了で、last Friday のようなはっきりした過去の時とは一緒に使いません。","is sending は「送っている」で、報告書が送る側になり、時も合いません。"],
 "2つの点を確かめます。①主語 The quarterly report（四半期報告書）は送る側か送られる側か → 送られる側なので受け身。②いつのことか → last Friday なので過去。両方を満たすのは was sent です。","四半期報告書は先週の金曜日、すべての株主に送られた。","「する側・される側」と「いつ」の2つを、順番に確かめます。"),
EG_Q('tb8','g_tense',4,"By the time the merger is finalized, the two companies ____ together for nearly ten years.",["will have worked","have worked","worked","are working"],
 ["By the time ～（～するころには）は未来の時点です。その時点まで続いている期間なので、未来完了の will have worked です。","have worked は今の時点までの話で、基準が未来の時点の文に合いません。","worked は過去形で、これから先の時点の話と合いません。","are working は「今している最中」で、for nearly ten years（10年近く）という期間と合いません。"],
 "the merger is finalized（合併がまとまる）は未来のことですが、by the time の中なので現在形です。「その未来の時点までに～していることになる」は will have＋過去分詞（未来完了）で表します。for ～（～の間）の期間もヒントです。","合併がまとまるころには、2社は10年近く一緒に仕事をしていることになる。","By the time＋現在形 と for＋期間 がそろえば、will have＋過去分詞 です。"),
EG_Q('tb9','g_agree',3,"One of our biggest clients ____ asked for a meeting next week.",["has","have","having","to have"],
 ["主語の中心は One（1社）なので単数扱いで、has asked です。","have は複数の主語に使う形です。直前の clients につられないようにします。","having だけでは文の動詞になりません。","to have では文の動詞になりません。"],
 "主語は One of our biggest clients（最大の顧客のうちの1社）です。中心になる言葉は One で、of 以下はその説明です。主語が単数なので、現在完了は has＋過去分詞 にします。","最大の顧客のうちの1社から、来週の打ち合わせを求められた。","One of ～s が主語なら、動詞は One に合わせて単数です。"),
EG_Q('tb10','g_agree',3,"Information about the new parking rules ____ been posted on the bulletin board.",["has","have","are","were"],
 ["information（情報）は数えられない名詞で単数扱いなので、has been posted です。","have は複数の主語に使う形です。直前の rules につられないようにします。","are been という形はありません。been の前には have / has が必要です。","were been という形はありません。"],
 "主語の中心は Information です。about the new parking rules は「新しい駐車ルールについての」という説明なので、動詞の形には関係ありません。information は数えられない名詞なので単数扱いです。","新しい駐車ルールについての情報が、掲示板に貼り出されている。","主語と動詞の間に前置詞のまとまりがあれば、かっこに入れて主語の中心を探します。"),
EG_Q('tb11','g_agree',3,"The sales manager, along with her team members, ____ attending the trade show next week.",["is","are","were","be"],
 ["主語は The sales manager（1人）なので、単数の is です。along with ～ は付け足しの説明です。","are は複数の主語に使う形です。along with her team members は主語に数えません。","were は複数の主語に使う形で、過去の形でもあるので next week とも合いません。","be は原形で、主語の後ろにそのまま置けません。"],
 "along with ～（～と一緒に）、as well as ～、together with ～ は、主語に付け足した説明です。動詞は最初の主語 The sales manager に合わせて単数にします。and でつないだ場合（The manager and her team）とは違います。","営業部長は、チームのメンバーと一緒に、来週の展示会に参加する予定だ。","along with / as well as のまとまりは、カンマごと消して主語を見ます。"),
EG_Q('tb12','g_pron',2,"Employees may use the meeting rooms, but they must reserve ____ in advance.",["them","it","their","themselves"],
 ["reserve の目的語で、前の the meeting rooms（複数）を指すので them です。","it は1つのものを指します。meeting rooms は複数です。","their は「彼らの」で、後ろに名詞が必要です。","themselves は「彼ら自身」で、従業員が自分自身を予約することになってしまいます。"],
 "空欄は reserve（予約する）の目的語（「何を」）で、予約するのは会議室です。the meeting rooms は複数なので、目的語の形の them を使います。","従業員は会議室を使えますが、前もって予約しなければなりません。","代名詞の空欄は、何を指すかを探し、その単数・複数を確かめます。"),
EG_Q('tb13','g_pron',3,"Ms. Novak's sales figures were higher than ____ of any other team member.",["those","that","them","these"],
 ["比べているのは sales figures（売上の数字、複数）なので、同じ名詞のくり返しを避ける those です。","that も名詞のくり返しを避けますが、単数の名詞の代わりです。figures は複数です。","them は動詞や前置詞の目的語で、後ろに of ～ を付けて名詞の代わりにはできません。","these は「これら」で、the ～ of の代わりとして of を後ろに付ける形では使いません。"],
 "比べるものは「ノヴァクさんの売上の数字」と「ほかのメンバーの売上の数字」です。2回目の sales figures を those of ～（～のそれら）で言いかえます。単数の名詞なら that of ～ です。","ノヴァクさんの売上の数字は、チームのほかの誰の数字よりも高かった。","than / as の後ろの空欄＋of は、前の名詞が単数なら that、複数なら those です。"),
EG_Q('tb14','g_pron',3,"The interns completed the survey analysis on ____ own.",["their","them","themselves","theirs"],
 ["on one's own で「自分たちだけで」。one's の位置には my・their などの「～の」の形が入るので their です。","them は「彼らを」の形で、名詞 own の前には置けません。","themselves は「彼ら自身」で、on themselves own という形はありません。","theirs は「彼らのもの」で、後ろに名詞（own）を置けません。"],
 "on ＿ own は「自分（たち）だけで・ひとりで」というまとまりです。own の前には「誰の」を表す形（my・your・his・her・their）を置きます。主語が The interns（実習生たち）なので their です。by themselves とほぼ同じ意味です。","実習生たちは、調査の分析を自分たちだけで仕上げた。","on ＿ own の空欄は、主語に合わせた「～の」の形です。"),
EG_Q('tb15','g_prep',2,"____ the delay in shipping, the store offered customers a discount.",["Because of","Because","Although","Even though"],
 ["後ろが the delay in shipping（発送の遅れ）という名詞のまとまりで、理由を表すので、前置詞の Because of（～のために）です。","Because は接続詞で、後ろに主語と動詞のある文が必要です。","Although は接続詞で後ろに文が必要です。また「遅れたけれども割引した」では意味も合いません。","Even though も接続詞で、後ろに文が必要です。意味も逆の内容をつなぐ言葉です。"],
 "まず意味から、「発送が遅れた」と「割引をした」は理由と結果の関係です。次に後ろの形を見ると、the delay in shipping は名詞のまとまりで、主語と動詞がありません。名詞の前に置ける Because of（前置詞）を選びます。","発送の遅れのため、その店は客に割引を提供した。","because＋文、because of＋名詞。後ろに動詞があるかで見分けます。"),
EG_Q('tb16','g_conj',3,"Please keep your receipt ____ you need to return the item.",["in case","in case of","due to","so that"],
 ["in case＋文 で「～する場合に備えて」。返品が必要になるときのために、で意味が通ります。","in case of は前置詞のまとまりで、後ろに名詞を置きます。you need ～ という文は置けません。","due to（～のために）は前置詞のまとまりで、後ろに文を置けません。","so that は「～するように」という目的です。「返品しなければならないように保管する」では意味が通りません。"],
 "空欄の後ろは you need to return the item という主語と動詞のある文です。文をつなげるのは接続詞（文と文をつなぐ言葉）で、in case（～するといけないので・～の場合に備えて）がぴったりです。in case of fire（火事の場合は）のように、名詞なら of が付きます。","商品を返品する必要がある場合に備えて、レシートは保管しておいてください。","in case＋文、in case of＋名詞。of の有無を後ろの形で決めます。"),
EG_Q('tb17','g_prep',3,"The shop will remain open ____ the renovation work is being carried out.",["while","during","throughout","among"],
 ["while（～している間）は接続詞なので、後ろに主語 the renovation work と動詞 is being carried out のある文を置けます。","during は「～の間」の前置詞で、後ろに名詞は置けますが、主語と動詞のある文は置けません。","throughout（～の間ずっと）も前置詞で、後ろに文を置けません。","among は「（3つ以上）の間で」という場所や仲間の意味の前置詞で、時を表せません。"],
 "空欄の後ろには、主語（the renovation work）と動詞（is being carried out 行われている）があります。文をつなぐのは接続詞なので while です。during を使うなら during the renovation work のように名詞だけにします。","改装工事が行われている間も、その店は営業を続ける。","「～の間」は、後ろが文なら while、名詞なら during / throughout です。"),
EG_Q('tb18','g_conj',3,"____ the weather improves, the outdoor reception will be moved indoors.",["Unless","Despite","Otherwise","Without"],
 ["Unless は「～しない限り」の接続詞で、後ろに文を置けます。「天気がよくならない限り屋内に移す」で意味が通ります。","Despite（～にもかかわらず）は前置詞で、後ろに主語と動詞のある文を置けません。","Otherwise は「さもなければ」という副詞で、文と文をつなぐ接続詞として前に置けません。","Without は前置詞で、後ろに文を置けません。"],
 "後ろに the weather improves という文があるので、接続詞を選びます。意味を見ると「天気がよくならなければ、屋外の歓迎会は屋内に移される」なので、unless（＝if ～ not）が合います。条件の文の中なので、未来でも現在形の improves です。","天気がよくならない限り、屋外の歓迎会は屋内に移されます。","選択肢に前置詞と副詞が混ざっていたら、後ろが文かどうかでまず接続詞に絞ります。"),
EG_Q('tb19','g_rel',2,"The printer ____ we bought last month has already broken down.",["that","who","whose","what"],
 ["The printer（物）を後ろから説明し、bought の目的語（「何を」）の役割なので、that です（which も使えます）。","who は人を説明するときに使います。printer は物です。","whose は「その～の」で、後ろに名詞が必要です。","what は「～するもの」で、前に説明する名詞（printer）があるときは使いません。"],
 "The printer ＿ we bought last month（先月買ったプリンター）が主語、has broken down が動詞です。空欄は前の printer を説明する文をつなぐ関係代名詞（前の名詞を説明する文をつなぐ言葉）で、物なので that か which を使います。","先月買ったプリンターが、もう壊れてしまった。","前に名詞があれば what は使えません。物なら which / that、人なら who です。"),
EG_Q('tb20','g_what',3,"____ the customers want most is faster delivery.",["What","That","Which","Who"],
 ["What は「～すること・もの」で、前に名詞がなくても使えます。What the customers want most（客が最も望むこと）が主語になります。","That は「～ということ」で、後ろは文として完成している必要があります。want の目的語が抜けているので合いません。","Which は「どちら」と選ぶ言葉で、この位置で「～するもの」の意味になりません。","Who は人について使います。客が望むのは人ではありません。"],
 "文の動詞は is で、＿ the customers want most がその主語です。want（望む）の目的語（「何を」）が抜けていて、前に説明する名詞もありません。この場合は、the thing which と同じ意味の what を使います。","客が最も望んでいるのは、より速い配達だ。","前に名詞がなく、後ろの文に「何を」が抜けていれば what です。"),
EG_Q('tb21','g_where',3,"The department ____ Mr. Silva works is on the fifth floor.",["in which","which","whose","what"],
 ["work in the department（その部署で働く）の in が前に出た形で、in which です（where と同じ働き）。","which だけだと、Mr. Silva works the department となり、in が足りません。","whose は「その～の」で、後ろに名詞が必要です。","what は前に名詞があるときは使いません。"],
 "元の文は Mr. Silva works in the department（シルバさんはその部署で働いている）です。works は後ろに目的語を取らないので、the department の前には in が必要です。この in を関係代名詞の前に出すと in which になります。","シルバさんが働いている部署は5階にある。","後ろの文が目的語なしで完成していたら、which ではなく前置詞＋which か where です。"),
EG_Q('tb22','g_rel',4,"The candidates, most of ____ have management experience, will be interviewed next week.",["whom","them","who","which"],
 ["前置詞 of の後ろで、人（candidates）を指す関係代名詞なので whom です。most of whom で「そのうちのほとんど」です。","them を使うと、2つの文をカンマだけでつなぐことになり、文の形が崩れます。","who は主語の形で、前置詞 of の後ろには置けません。","which は物に使います。candidates は人です。"],
 "The candidates が主語、will be interviewed が動詞で、カンマにはさまれた部分は説明の付け足しです。この部分は and most of them have ～ を関係代名詞でまとめた形で、them が whom に変わります。前置詞の後ろの人は whom、物は which です。","候補者たちは、そのほとんどが管理職の経験を持っており、来週面接を受ける。","カンマの間の most of / some of / all of ＿ は、人なら whom、物なら which です。"),
EG_Q('tb23','g_inf_ger',2,"The company plans ____ a new branch in Osaka next year.",["to open","opening","open","opened"],
 ["plan は後ろに to＋動詞の原形 を取るので to open です。","plan の後ろに ～ing は使いません。","動詞の原形だけを plans の後ろに続けることはできません。","opened は過去形で、plans の後ろに続けられません。"],
 "plan to ～ で「～する計画だ」です。plan・decide・hope・want など、これから先のことに向かう動詞は to＋動詞の原形 を後ろに取ります。","その会社は来年、大阪に新しい支店を開く計画だ。","これからのことを表す動詞（plan・decide・hope）の後ろは to＋原形です。"),
EG_Q('tb24','g_inf_ger',3,"Mr. Chen is considering ____ his contract with the supplier.",["renewing","to renew","renew","renewed"],
 ["consider は後ろに ～ing（動名詞）を取るので renewing です。","consider の後ろに to＋動詞の原形 は使いません。","動詞の原形だけを considering の後ろに続けることはできません。","renewed は過去形・過去分詞で、consider の目的語になりません。"],
 "consider ～ing で「～することを検討する」です。consider・enjoy・finish・avoid・suggest は、後ろに to ではなく ～ing（動名詞：動詞を名詞のように使う形）を取ります。","チェンさんは、その仕入れ先との契約を更新することを検討している。","consider・suggest・avoid の後ろは ～ing。まとめて覚えておきます。"),
EG_Q('tb25','g_inf_ger',3,"The new policy is aimed at ____ paper waste.",["reducing","reduce","reduced","be reduced"],
 ["at は前置詞なので、後ろの動詞は ～ing にして reducing です。","reduce は動詞の原形で、前置詞の後ろに置けません。","reduced は過去形・過去分詞で、at の後ろに置いても「減らすこと」の意味になりません。","be reduced は受け身の原形で、前置詞の後ろには置けません。"],
 "be aimed at ～ は「～を目的としている」で、at は前置詞（名詞の前に置く言葉）です。前置詞の後ろに動詞を置くときは ～ing の形にします。","新しい方針は、紙のむだを減らすことを目的としている。","be aimed at / be committed to / be used for の後ろの動詞は ～ing です。"),
EG_Q('tb26','g_inf_ger',3,"The manager asked all staff ____ the safety training by Friday.",["to complete","completing","complete","completed"],
 ["ask＋人＋to＋動詞の原形 で「人に～するよう頼む」なので to complete です。","ask＋人 の後ろに ～ing は使いません。","動詞の原形だけを置く形は、make・let など一部の動詞に限られます。","completed は過去形・過去分詞で、「完了するよう頼む」の意味になりません。"],
 "asked all staff ＿ は「全スタッフに～するよう頼んだ」という形です。ask・tell・want・encourage・remind は、人の後ろに to＋動詞の原形 を置きます。","部長は全スタッフに、金曜日までに安全研修を終えるよう求めた。","ask / tell / want＋人 の後ろは to＋原形です。"),
EG_Q('tb27','g_comp',2,"This year's trade fair attracted ____ visitors than last year's.",["more","most","much","many"],
 ["後ろに than（～より）があるので、比べる形の more です。more visitors で「より多くの来場者」です。","most は「最も多くの」で、than とは一緒に使いません。","much は数えられない名詞に使います。visitors は数えられる名詞で、than とも合いません。","many はそのままの形で、than と組み合わせられません。"],
 "than last year's（去年のものより）があるので、2つを比べる形を選びます。many・much の比べる形はどちらも more です。last year's は last year's trade fair（去年の見本市）のことです。","今年の見本市は、去年よりも多くの来場者を集めた。","than があれば、まず more か ～er を探します。"),
EG_Q('tb28','g_comp',3,"The new laptop is ____ lighter than the previous model.",["much","very","more","most"],
 ["much は比べる形（lighter）を強めて「ずっと軽い」の意味になります。","very は lighter のような比べる形を強められません。","lighter はすでに比べる形なので、more を重ねられません。","most は「最も」で、than と一緒に使いません。"],
 "lighter than ～ はすでに比べる形です。比べる形を「ずっと・はるかに」と強めるのは much・far・even・a lot で、very は使いません。","新しいノートパソコンは、前のモデルよりずっと軽い。","～er than の前の空欄は、very ではなく much / far / even です。"),
EG_Q('tb29','g_comp',2,"Please reply to this e-mail as ____ as possible.",["soon","sooner","soonest","more soon"],
 ["as ～ as possible で「できるだけ～」。as と as の間は元の形なので soon です。","sooner は比べる形で、as と as の間には入りません。","soonest は「最も」の形で、as ～ as には入りません。","more soon という形はなく、as と as の間にも入りません。"],
 "as soon as possible は「できるだけ早く」という決まった言い方で、メールでよく使います。as と as の間には、er も more も付けない元の形を置きます。","できるだけ早く、このメールに返信してください。","as ＿ as の空欄は、何も付けない元の形です。"),
EG_Q('tb30','g_comp',3,"Of the three proposals, Ms. Ruiz's was by far ____.",["the most practical","more practical","practical","the more practical"],
 ["Of the three proposals（3つの提案の中で）と範囲が示されているので「最も～」の形です。by far は最上級を強めます。","more practical は2つを比べる形で、than もありません。","practical は元の形で、by far（はるかに）とは組み合わせません。","the more practical は2つのうち「より～な方」に使う形で、3つの中から選ぶときには使いません。"],
 "Of the three ～（3つのうちで）は、3つ以上の中で比べている合図です。「最も実用的」なので the most practical です。by far は「断然」という意味で、最上級を強めます。Ms. Ruiz's は Ms. Ruiz's proposal のことです。","3つの提案のうち、ルイスさんのものが断然最も実用的だった。","Of the three / in the company など範囲があれば、最上級（the most / ～est）です。"),
EG_Q('tb31','g_tb_partadj',2,"The staff were ____ with the results of the customer survey.",["pleased","pleasing","please","pleasure"],
 ["スタッフは結果に「喜ばされた」側なので、～ed の pleased です。be pleased with ～ で「～に満足している」です。","pleasing は「（人を）喜ばせるような」で、スタッフが何かを喜ばせる側になってしまいます。","please は動詞の原形で、were の後ろに置けません。","pleasure は「喜び」という名詞で、with とつながる形になりません。"],
 "感情を表す語は、主語が「その気持ちを感じている人」なら ～ed の形にします。The staff（スタッフ）が満足しているので pleased です。調査の結果そのものを説明するなら The results were pleasing. になります。","スタッフは顧客調査の結果に満足していた。","主語が人で、その人の気持ちなら ～ed の形を選びます。"),
EG_Q('tb32','g_tb_partadj',2,"Sales of the new product were ____, so the company changed its marketing plan.",["disappointing","disappointed","disappoint","disappointment"],
 ["売上は人を「がっかりさせる」側なので、～ing の disappointing（期待外れの）です。","disappointed は「がっかりした」で、感じている人について使います。売上ががっかりするわけではありません。","disappoint は動詞の原形で、were の後ろに置けません。","disappointment は名詞です。were a disappointment なら言えますが、a がないので合いません。"],
 "主語は Sales（売上）で、人ではありません。売上の数字が会社の人たちを「がっかりさせた」ので、～ing の形を使います。The managers were disappointed.（部長たちはがっかりした）と区別します。","新製品の売上が期待外れだったので、会社は販売の計画を変えた。","主語が物・できごとなら ～ing、人の気持ちなら ～ed です。"),
EG_Q('tb33','g_tb_partadj',3,"Please review the ____ document and sign it by Friday.",["attached","attaching","attaches","attach"],
 ["書類は（メールに）「添付された」側なので、過去分詞の attached です。","attaching は「添付している」で、書類が自分で何かを添付することになります。","attaches は動詞の形で、the と名詞の間には入りません。","attach は動詞の原形で、名詞の前には置けません。"],
 "the ＿ document の空欄は、名詞 document を説明する形容詞の位置です。書類は誰かによって「添付される」ので、過去分詞（～ed）を使います。the attached file（添付ファイル）もメールでよく使う形です。","添付の書類をご確認のうえ、金曜日までに署名してください。","名詞が「される」側なら ～ed、「している」側なら ～ing です。"),
EG_Q('tb34','g_tb_partadj',3,"There is a ____ demand for electric vehicles in the region.",["growing","grown","grow","grows"],
 ["需要は自分で「増えている」ので、～ing の growing です。a growing demand で「高まる需要」です。","grown は「育てられた・成長し終えた」の意味で、需要を説明するのには使いません。","grow は動詞の原形で、a と名詞の間には入りません。","grows は動詞の形で、a と名詞の間には入りません。"],
 "a ＿ demand の空欄は、名詞 demand（需要）を説明する位置です。grow は「増える・育つ」という意味で、需要は自分で増えていく側です。自分で「～している」ものを説明するときは ～ing を使います。","その地域では、電気自動車への需要が高まっている。","a growing number of ～（ますます多くの～）もよく出るまとまりです。"),
EG_Q('tb35','g_if',3,"If we ____ the order earlier, the parts would have arrived on time.",["had placed","placed","have placed","would place"],
 ["後ろが would have arrived（届いていただろう）なので、過去の事実と違う想像です。if の中は had＋過去分詞 の had placed です。","placed は過去形で、今の事実と違う想像（後ろは would＋原形）に使う形です。","have placed は現在完了で、過去の想像の if の中には使いません。","if の中には、普通 would を使いません。"],
 "would have arrived（届いていただろう）は「実際は届かなかった」過去の話です。過去の事実と違うことを想像するときは、If＋had＋過去分詞, ～ would have＋過去分詞 の形（仮定法過去完了）にします。","もっと早く注文していれば、部品は時間どおりに届いていただろう。","後ろに would have＋過去分詞 があれば、if の中は had＋過去分詞 です。"),
EG_Q('tb36','g_if',2,"If I ____ you, I would ask the supplier for a discount.",["were","am","have been","will be"],
 ["私があなたになることはありえないので、事実と違う想像の形の were です。主語が I でも were を使います。","am は事実を表す形で、「私があなた（である）」という、ありえない想像には使いません。","have been は現在完了で、仮定法の形になりません。","if の中では will を使わないのが普通で、想像の形にもなりません。"],
 "If I were you（もし私があなたなら）は、相手にアドバイスするときの決まった言い方です。今の事実と違う想像は、if の中を過去形、後ろを would＋動詞の原形 にします。be動詞は主語に関係なく were を使うのが基本です。","私があなたなら、仕入れ先に値引きを頼むでしょう。","If I were you, I would ～ でアドバイスの形として覚えます。"),
EG_Q('tb37','g_if',3,"____ you have any questions about your invoice, please contact our billing department.",["Should","Would","Had","Were"],
 ["Should you have ～ は If you should have ～ の if を省いた形で、「万一～があれば」です。後ろが動詞の原形 have なので合います。","Would を文の先頭に置いても、条件の意味になりません。","Had で始めるなら Had you had ～ のように過去分詞が必要です。have（原形）とは合いません。","Were で始めるなら Were you to have ～ のように to が必要です。"],
 "お客様あてのお知らせで、「万一～があれば」と丁寧に言うとき、if を省いて Should を先頭に出すことがあります（倒置：言葉の順番を入れかえること）。後ろが please ～ という依頼の文なのもヒントです。","請求書についてご質問があれば、請求担当部署までご連絡ください。","文の先頭の空欄＋主語＋動詞の原形, please ～ なら Should です。"),
EG_Q('tb38','g_if',4,"Had the train not been delayed, Mr. Ito ____ the opening session.",["would have attended","will attend","had attended","would attend"],
 ["Had the train not been delayed は If the train had not been delayed の if を省いた形です。過去の想像なので would have attended です。","will attend は未来のことで、過去の事実と違う想像に合いません。","had attended だけでは「～しただろう」という想像の意味になりません。","would attend は今の事実と違う想像の形で、電車が遅れたという過去の話と合いません。"],
 "文の先頭が Had＋主語＋過去分詞 になっているのは、if を省いて順番を入れかえた形（倒置）です。「電車が遅れていなければ」という過去の事実と違う想像なので、後ろは would have＋過去分詞 にします。","電車が遅れていなければ、伊藤さんは開会の部に出席していただろう。","文の先頭の Had＋主語 は if のしるし。後ろは would have＋過去分詞 です。"),
EG_Q('tb39','g_tb_wh',3,"____ submits the best idea will receive a gift card.",["Whoever","Whomever","Anyone","Who"],
 ["Whoever は「～する人は誰でも」で、submits の主語になります。Whoever submits the best idea 全体が文の主語です。","Whomever は目的語（「誰を」）の形で、submits の主語にはなれません。","Anyone を使うなら Anyone who submits ～ のように who が必要です。","Who だけでは「誰が～するのか」という疑問の意味になり、文の主語として使えません。"],
 "文の動詞は will receive で、＿ submits the best idea がその主語です。「最高のアイデアを出した人は誰でも」なので Whoever を使います。Whoever＝Anyone who と考えると分かりやすくなります。","最高のアイデアを出した人は、誰でもギフトカードがもらえます。","空欄のすぐ後ろに動詞が来て、全体が主語なら Whoever です。"),
EG_Q('tb40','g_tb_wh',3,"You may choose ____ payment method is most convenient for you.",["whichever","whoever","whether","wherever"],
 ["whichever＋名詞 で「どの～でも」。決まった支払い方法の中から選ぶので whichever payment method です。","whoever は人について使い、後ろに名詞を置きません。","whether は「～かどうか」で、後ろに payment method is ～ と続けても意味が通りません。","wherever は「どこでも」で、場所について使います。"],
 "choose の目的語は ＿ payment method is most convenient for you（あなたに最も便利な支払い方法）です。いくつかある選択肢から「どれでも」を表し、後ろに名詞を置けるのは whichever です。","お客様にとって最も便利な支払い方法を、どれでもお選びいただけます。","空欄の後ろに名詞があり、「選ぶ」話なら whichever を探します。"),
EG_Q('tb41','g_tb_wh',3,"The committee has not decided ____ to hold the event in May or June.",["whether","if","what","that"],
 ["whether to ～ で「～すべきかどうか」。May or June と組み合わせて「5月か6月か」を表せます。","if も「～かどうか」の意味がありますが、if to ～ という形はありません。","what to ～ は「何を～すべきか」で、hold の目的語 the event がすでにあるので合いません。","that の後ろに to＋動詞の原形 を続けることはできません。"],
 "has not decided（まだ決めていない）の後ろに、「5月に開くか6月に開くか」という内容が入ります。「～かどうか」は whether ですが、すぐ後ろに to＋動詞の原形 が来るときは if を使えません。","委員会は、そのイベントを5月に開くか6月に開くか、まだ決めていない。","「～かどうか」で後ろが to＋原形 なら whether です。"),
EG_Q('tb42','g_tb_wh',4,"____ the weather, the outdoor market will open as scheduled.",["Whatever","Whether","However","Whoever"],
 ["Whatever the weather で「天気がどうであれ」。後ろに名詞だけを置いて「～が何であっても」を表せます。","Whether を使うなら Whether it rains or not のように、主語と動詞と or が必要です。","However を使うなら However bad the weather is のように、形容詞と動詞が必要です。","Whoever は人について使い、「天気がどうであれ」の意味になりません。"],
 "空欄の後ろは the weather という名詞だけで、動詞がありません。Whatever＋名詞 で「～がどうであれ」という意味になり、Whatever the weather はよく使う言い方です。予定どおり開く理由として自然につながります。","天気がどうであれ、屋外マーケットは予定どおり開かれます。","後ろが名詞だけで「どうであれ」なら Whatever、文が続くなら Whether ～ or です。"),
EG_Q('tb43','g_tb_pair',2,"The workshop is open to both new employees ____ experienced staff.",["and","or","nor","but"],
 ["both A and B で「AとBの両方」なので and です。","or は either A or B（AかBのどちらか）の組み合わせで使います。","nor は neither A nor B（AもBも～ない）の組み合わせで使います。","but は not only A but also B などの組み合わせで使い、both とは組み合わせません。"],
 "空欄より前に both があるので、相方の and を探します。both new employees and experienced staff で「新入社員と経験のあるスタッフの両方」です。","その講習会は、新入社員と経験のあるスタッフの両方が参加できる。","both を見たら and、either なら or、neither なら nor です。"),
EG_Q('tb44','g_tb_pair',2,"You can contact us either by phone ____ by e-mail.",["or","and","nor","but"],
 ["either A or B で「AかBのどちらか」なので or です。","and は both A and B（両方）の組み合わせで使います。","nor は neither A nor B（どちらも～ない）の組み合わせで使います。","but は either とは組み合わせません。"],
 "空欄の前に either があるので、相方の or を探します。by phone（電話で）と by e-mail（メールで）のどちらか、という意味です。","電話かメールのどちらかで、ご連絡いただけます。","either があれば、空欄は or です。"),
EG_Q('tb45','g_tb_pair',3,"The new software is not only faster ____ easier to use.",["but also","and also","as well","or else"],
 ["not only A but also B で「AだけでなくBも」なので but also です。","not only の相方は but (also) で、and also とは組み合わせません。","as well は文の終わりに置いて「～も」を表す言葉で、not only の相方になりません。","or else は「さもないと」で、意味も形も合いません。"],
 "空欄の前に not only があるので、相方の but also を探します。faster（より速い）と easier to use（より使いやすい）の2つをつないでいます。","新しいソフトウェアは、速いだけでなく、使いやすくもある。","not only を見たら、but (also) を探します。"),
EG_Q('tb46','g_tb_pair',4,"Neither the manager nor her assistants ____ aware of the schedule change.",["were","was","is","has been"],
 ["neither A nor B では、動詞を近い方の B（her assistants、複数）に合わせるので were です。","was は単数の形です。動詞に近い her assistants は複数です。","is は単数の形で、her assistants（複数）に合いません。","has been は単数の形で、her assistants（複数）に合いません。"],
 "neither A nor B（AもBも～ない）が主語のとき、動詞は動詞に近い方の B に合わせます。B は her assistants（彼女の助手たち）で複数なので、were を選びます。either A or B も同じ考え方です。","部長も彼女の助手たちも、予定の変更を知らなかった。","neither A nor B / either A or B の動詞は、近い方の B を見て決めます。"),
EG_Q('tb47','g_tb_quant',2,"We do not have ____ time before the deadline, so let's start now.",["much","many","few","a few"],
 ["time（時間）は数えられない名詞なので much です。not much で「あまり～ない」です。","many は数えられる名詞の複数形に使います。","few は数えられる名詞の複数形に使います。","a few も数えられる名詞の複数形に使います。"],
 "time は「時間」という意味では数えられない名詞です。数えられない名詞の量を表すのは much・little で、many・few は使いません。not much time で「あまり時間がない」です。","締め切りまであまり時間がないので、今すぐ始めましょう。","後ろの名詞に s がなく数えられないものなら、much / little を探します。"),
EG_Q('tb48','g_tb_quant',3,"Only a ____ seats are left for tonight's performance, so please book soon.",["few","little","much","less"],
 ["seats（座席）は数えられる名詞の複数形なので、a few（少しの）です。","a little は数えられない名詞に使います。seats は数えられます。","much は数えられない名詞に使い、a much という形もありません。","less は数えられない名詞の比べる形で、a less という形はありません。"],
 "空欄の後ろの seats は s の付いた複数形で、数えられる名詞です。「少しの」は、数えられる名詞なら a few、数えられない名詞なら a little です。Only a few で「ほんの少しだけ」です。","今夜の公演の席は残りわずかなので、早めにご予約ください。","a ＿ の後ろが複数形なら few、数えられない名詞なら little です。"),
EG_Q('tb49','g_tb_quant',3,"There was very ____ interest in the proposal, so it was dropped.",["little","few","many","a lot"],
 ["interest（関心）は数えられない名詞で、「ほとんどない」なので little です。very little で「ごくわずか」です。","few は数えられる名詞の複数形に使います。interest は数えられない名詞です。","many は数えられる名詞の複数形に使い、意味も「取りやめた」と合いません。","a lot を very の後ろに置くことはできず、意味も「取りやめた」と合いません。"],
 "so it was dropped（だから取りやめになった）から、関心は「ほとんどなかった」と分かります。interest は数えられない名詞なので、few ではなく little を使います。a のない little は「ほとんどない」という否定の気持ちです。","その提案への関心はほとんどなかったので、取りやめになった。","文の後半の結果から、「ある」のか「ほとんどない」のかを先に決めます。"),
EG_Q('tb50','g_tb_quant',3,"____ of the applicants has been contacted by the HR department.",["Each","Every","All","Both"],
 ["Each of the＋複数名詞 で「～のそれぞれ」。単数扱いなので has とも合います。","every は後ろに of を置けません。every applicant のように直接名詞を続けます。","All of the applicants は複数扱いなので、動詞は have になります。","Both of the applicants は複数扱いなので、動詞は have になります。"],
 "動詞が has（単数）になっていることが最大のヒントです。of the applicants（応募者の）の前に置けて、単数扱いになるのは Each です。every は形容詞として名詞の前に置く言葉で、every of という形はありません。","応募者一人一人に、人事部から連絡があった。","＿ of the ～s＋単数の動詞 なら Each です。every of はありません。"),
EG_Q('tb51','v_tb_verb',2,"Because of the storm, the meeting has been ____ until next Tuesday.",["postponed","prevented","persuaded","provided"],
 ["postpone は「延期する」。until next Tuesday（来週の火曜日まで）と合います。","prevent は「防ぐ・妨げる」で、until ～ とつなげて会議の日を動かす意味になりません。","persuade は「説得する」で、人に使う動詞です。会議を説得することはできません。","provide は「提供する」で、会議を来週まで提供する、では意味が通りません。"],
 "嵐のために、会議が「来週の火曜日まで」どうなったかを考えます。until ～ と組み合わせて「先に延ばす」を表す postpone が合います。postpone は put off と同じ意味です。","嵐のため、会議は来週の火曜日まで延期された。","会議・イベント＋until / to＋日付 なら、postpone（延期する）を探します。"),
EG_Q('tb52','v_tb_verb',3,"The city plans to ____ a new recycling program in April.",["implement","imply","impress","inquire"],
 ["implement は「（計画・制度を）実施する」。a new recycling program（新しいリサイクル制度）と自然につながります。","imply は「ほのめかす」で、制度を目的語にしても意味が通りません。","impress は「（人を）感心させる」で、制度を感心させることはできません。","inquire は「たずねる」で、about などが必要なうえ、意味も合いません。"],
 "目的語は a new recycling program（新しいリサイクルの取り組み）です。計画・制度・方針を「実行に移す」動詞が implement です。implement a plan / a policy / a system の形でよく出ます。","市は4月に、新しいリサイクルの取り組みを実施する予定だ。","program・plan・policy の前の空欄は、implement（実施する）を当てはめてみます。"),
EG_Q('tb53','v_tb_verb',3,"The company will ____ employees for their travel expenses within two weeks.",["reimburse","remind","reserve","resign"],
 ["reimburse＋人＋for＋費用 で「人に費用を払い戻す」。出張の経費を払い戻す、で意味が通ります。","remind は「思い出させる」で、remind 人 for ～ という形はなく、意味も合いません。","reserve は「予約する」で、従業員を予約することはできません。","resign は「辞職する」で、従業員を目的語に取れず、意味も合いません。"],
 "for their travel expenses（出張の経費について）がヒントです。会社が立て替えた経費を従業員に「払い戻す」のは reimburse です。経費の精算の話でよく使います。","会社は2週間以内に、従業員に出張の経費を払い戻す。","expenses（経費）と一緒に出たら、reimburse（払い戻す）を思い出します。"),
EG_Q('tb54','v_tb_verb',3,"The main hall can ____ up to 300 guests.",["accommodate","accompany","accumulate","acknowledge"],
 ["accommodate は「（人数を）収容できる」。up to 300 guests（最大300人の客）と合います。","accompany は「（人に）付き添う」で、ホールが客に付き添うことはできません。","accumulate は「ためる・蓄積する」で、客をためる、では意味が通りません。","acknowledge は「認める・受け取ったことを知らせる」で、意味が合いません。"],
 "主語は The main hall（大ホール）、目的語は up to 300 guests（最大300人の客）です。建物や部屋が「何人入れるか」を表す動詞は accommodate です。hold も同じ意味で使えます。","大ホールは最大300人の客を収容できる。","建物・部屋が主語で人数が目的語なら、accommodate（収容する）です。"),
EG_Q('tb55','v_tb_noun',3,"Before the trip, the travel agent sent us a detailed ____ with flight times and hotel information.",["itinerary","inventory","warranty","applicant"],
 ["itinerary は「旅程表」。飛行機の時刻とホテルの情報が入った書類にぴったりです。","inventory は「在庫（一覧）」で、旅行の書類ではありません。","warranty は「保証（書）」で、製品の修理などに使う言葉です。","applicant は「応募者」という人で、送る書類になりません。"],
 "Before the trip（旅行の前に）と flight times and hotel information（飛行機の時刻とホテルの情報）がヒントです。旅の予定をまとめた書類は itinerary（旅程表）です。","旅行の前に、旅行会社が飛行機の時刻とホテルの情報が入った詳しい旅程表を送ってくれた。","trip・flight・hotel が出てきたら、itinerary（旅程表）を探します。"),
EG_Q('tb56','v_tb_noun',3,"The printer comes with a two-year ____, so repairs are free during that period.",["warranty","refund","receipt","estimate"],
 ["warranty は「保証」。2年間の保証が付いているので、その間の修理が無料、で意味が通ります。","refund は「返金」で、「修理が無料になる」理由になりません。","receipt は「領収書」で、2年間という期間とも修理とも合いません。","estimate は「見積もり」で、修理を無料にするものではありません。"],
 "so repairs are free during that period（その期間は修理が無料）がヒントです。製品に付いていて、一定の期間の修理を約束するものは warranty（保証）です。comes with ～ は「～が付いてくる」です。","そのプリンターには2年間の保証が付いているので、その期間は修理が無料だ。","repair・free・期間 がそろったら、warranty（保証）です。"),
EG_Q('tb57','v_tb_noun',2,"Please check the ____ carefully and pay the full amount by the end of the month.",["invoice","itinerary","agenda","applicant"],
 ["invoice は「請求書」。内容を確かめて代金を支払う書類なので、pay the full amount と合います。","itinerary は「旅程表」で、代金を支払うための書類ではありません。","agenda は「会議の議題」で、支払いとは関係ありません。","applicant は「応募者」という人で、確認して支払う対象になりません。"],
 "pay the full amount（全額を支払う）がヒントです。金額が書かれていて、支払う前に確認する書類は invoice（請求書）です。receipt（領収書）は支払った後にもらう書類なので区別します。","請求書をよくご確認のうえ、月末までに全額をお支払いください。","pay・amount・payment があれば、invoice（請求書）を探します。")
);
EG_QS.forEach(q => EG_QBY[q.id] = q);

Object.assign(EG_KN, {
 g_gx_there:{cat:'grammar',t:'There is / There are（～がある・いる）',l:'「～がある・～がいる」と、物や人があることを伝えるときは There is / There are を使います。後ろの名詞が1つなら is、2つ以上なら are です。There are two cats.（ネコが2匹いる）。疑問文は is・are を文の先頭に出して Is there ～? / Are there ～? にします。後ろの名詞を見てから is か are を決めるのがポイントです。'},
 g_gx_modal:{cat:'grammar',t:'助動詞（can / must / must not）',l:'助動詞（動詞の前に置いて意味を付け足す言葉）は、can（～できる）、must（～しなければならない）、must not（～してはいけない）などです。助動詞の後ろの動詞は、主語が he や she でも必ず原形（s も ed も付かない元の形）にします。She can swim.（○）／She can swims.（×）。また、助動詞の後ろに to は付けません。'},
 g_gx_future:{cat:'grammar',t:'未来の言い方（will / be going to）',l:'これから先のことは will＋動詞の原形 か be going to＋動詞の原形 で表します。be going to は「もう決めている予定」や「目の前の様子から、もうすぐ起こりそうなこと」によく使います。Look at the clouds. It is going to rain.（雲を見て。雨が降りそう）。is・am・are を忘れないこと、to の後ろは原形にすることが大切です。'},
 g_gx_prog:{cat:'grammar',t:'過去進行形（was / were＋～ing）',l:'「（そのとき）～しているところだった」は過去進行形（was・were＋～ing）で表します。主語が I や he・she など1人なら was、you や2人以上なら were です。I was watching TV when you called.（あなたが電話をくれたとき、私はテレビを見ていた）。疑問文は was・were を前に出して What were you doing? にします。'},
 g_gx_wh:{cat:'grammar',t:'疑問詞（how many / when / whose）',l:'疑問詞（質問の内容をはっきりさせる言葉）は、何を聞きたいかで選びます。数なら How many＋名詞の複数形、量や値段なら How much、時なら When、場所なら Where、持ち主なら Whose＋名詞（だれの～）です。答えの文を見ると、何を聞いているのかが分かります。It is mine.（私のです）なら持ち主を聞いているので Whose です。'},
 g_gx_perfprog:{cat:'grammar',t:'現在完了進行形と過去完了',l:'「（今まで）ずっと～し続けている」は現在完了進行形（have been＋～ing）で表します。I have been waiting for an hour.（1時間ずっと待っている）。一方、過去のある時点よりさらに前に終わっていたことは過去完了（had＋過去分詞）です。When we arrived, the train had left.（着いたときには、電車はもう出ていた）。基準が「今」なら have、基準が「過去のある時」なら had と考えます。'},
 g_gx_modalperf:{cat:'grammar',t:'助動詞＋have＋過去分詞（should have done など）',l:'過去のことについて気持ちや推量を言うときは、助動詞＋have＋過去分詞 を使います。should have＋過去分詞は「～すべきだったのに（しなかった）」という後悔、shouldn\'t have＋過去分詞は「～すべきではなかったのに（してしまった）」です。must have＋過去分詞は「～したに違いない」、can\'t have＋過去分詞は「～したはずがない」という推量です。'},
 g_gx_letget:{cat:'grammar',t:'使役の let と get（～させてあげる・～してもらう）',l:'let＋人＋動詞の原形 は「（人が望むことを）～させてあげる・許す」です。My mother let me go.（母は行かせてくれた）。get＋人＋to＋動詞の原形 は「（頼んだり説得したりして）人に～してもらう」です。I got him to help me.（彼に手伝ってもらった）。let は原形、get は to が必要、と形の違いで覚えます。'},
 g_gx_sothat:{cat:'grammar',t:'so ～ that / too ～ to / ～ enough to',l:'so＋形容詞＋that ～ は「とても…なので～だ」です。too＋形容詞＋to＋動詞の原形 は「…すぎて～できない」で、否定の言葉がなくても「できない」意味になります。形容詞＋enough to＋動詞の原形 は「～できるくらい十分…だ」で、enough は形容詞の後ろに置きます。old enough（○）／enough old（×）。'},
 g_gx_indq:{cat:'grammar',t:'間接疑問（文の中に入った疑問文の語順）',l:'Where does she live? のような疑問文を Do you know や I wonder などの後ろに入れると、間接疑問（文の一部になった疑問文）になります。このとき語順は「疑問詞＋主語＋動詞」の普通の文の形に戻り、do・does・did は消えます。Do you know where she lives?（○）。疑問詞がない Yes・No の疑問文を入れるときは、if か whether（～かどうか）を使います。'},
 g_gx_subj:{cat:'grammar',t:'仮定法の発展（if only / as if / It is time）',l:'仮定法（事実と違うことを想像する言い方）は if 以外でも使います。If only＋過去形 は「～でさえあればなあ」という強い願い、as if＋過去完了 は「（まるで）～したかのように」、It is time＋主語＋過去形 は「もう～してもいいころだ（まだしていない）」です。どれも「今の事実と違う」ので過去形、「過去の事実と違う」ので過去完了、と時を1つずらすのがポイントです。'},
 g_gx_relx:{cat:'grammar',t:'関係副詞と、カンマの付いた関係詞',l:'関係副詞（時・場所・理由・方法を表す名詞を説明する言葉）は、時なら when、方法なら how を使います。the day when I met her（彼女に会った日）。how は the way と一緒には使わず、どちらか片方だけにします。また、名詞の後ろにカンマを置いて補足するときは who・which を使い、that は使えません。前の文全体を受けて「そしてそれは～」と言うときも , which を使います。'},
 g_gx_emph:{cat:'grammar',t:'強調構文（It is ～ that …）',l:'It is（was）＋強調したい言葉＋that ～ の形で、「～なのは…だ」と1つの部分を目立たせることができます。It was in this park that I lost my key.（鍵をなくしたのは、この公園でだ）。強調する言葉が人なら that の代わりに who も使えます。It と that を外すと普通の文に戻るのが、見分けるコツです。'},
 g_gx_soneither:{cat:'grammar',t:'So do I / Neither do I（～もそうだ）',l:'相手の話を受けて「私もそうです」と言うとき、肯定の文には So＋（助）動詞＋主語、否定の文には Neither＋（助）動詞＋主語 を使います。動詞は相手の文に合わせます。be動詞の文なら am・is、一般動詞の文なら do・does・did、can の文なら can です。I\'m tired. ― So am I.／I didn\'t go. ― Neither did I.'},
 g_gx_with:{cat:'grammar',t:'with＋名詞＋分詞（～を…したままで）',l:'with＋名詞＋分詞 で「～が…した状態で」と、そのときの様子を付け加えられます。名詞が「する側」なら ～ing（現在分詞）、「される側」なら過去分詞にします。with tears running down（涙が流れ落ちる状態で）、with his arms folded（腕を組まれた状態で＝腕組みをして）。名詞と分詞の間に「は・が」を入れて意味が通るかで判断します。'},
 g_gx_nomatter:{cat:'grammar',t:'no matter ～ / whatever（たとえ何が～でも）',l:'Whatever（＝No matter what）は「たとえ何が（何を）～しても」、However（＝No matter how）は「たとえどんなに～でも」です。Whatever happens, I will help you.（何が起きても、手伝います）。No matter how の後ろは、how のすぐ後ろに形容詞を置き、続けて主語＋動詞 の普通の語順にします。No matter how tired you are（どんなに疲れていても）。'},
 g_gx_ifomit:{cat:'grammar',t:'if を省いた仮定法（Had I known / Were it not for / Should you）',l:'仮定法の if は省くことができ、そのときは動詞を前に出して疑問文の語順にします。If I had known → Had I known（もし知っていたら）、If it were not for → Were it not for（もし～がなければ）、If it had not been for → Had it not been for（もし～がなかったら）。If you should ～（万一～なら）は Should you ～ になります。文頭が Had・Were・Should で、後ろにカンマと would などがあれば、この形を疑います。'},
 g_gx_mandate:{cat:'grammar',t:'要求・提案の that 節（insist that he stop）',l:'insist（強く求める）、suggest（提案する）、demand（要求する）、recommend（すすめる）などの後ろの that 節では、動詞を原形にします。主語が he でも、元の文が過去でも原形のままです。The doctor insisted that he stop smoking.（医者は彼にたばこをやめるよう強く求めた）。イギリス英語では should stop の形も使い、その should が省かれた形だと考えると覚えやすいです。受け身なら be＋過去分詞 になります。'},
 g_gx_front:{cat:'grammar',t:'強調のための倒置（Only after / Little did）',l:'Only＋時や条件を表す語句（Only after ～・Only then など）や、Little（少しも～ない）を文の先頭に置くと、その後ろは疑問文の語順になります。Only after the storm had passed were we allowed to leave.（嵐が過ぎた後になって初めて、外に出ることを許された）。Little did he know ～.（彼は～だとは少しも知らなかった）。一般動詞の文では do・does・did を前に出し、後ろの動詞は原形にします。'},
 g_gx_nominal:{cat:'grammar',t:'名詞構文（文の内容を名詞で表す）',l:'He refused the offer.（彼は申し出を断った）を「彼の申し出の断り」のように名詞でまとめた形を名詞構文といいます。動詞を名詞にして（refuse → refusal、arrive → arrival）、主語は his のような「～の」の形、目的語は of ～ で表します。名詞の前には形容詞を置くので、副詞の late（遅れて）は形容詞の late（遅い）として名詞の前に来ます。英語らしい硬めの書き方で、長文でもよく出ます。'},
 g_gx_thecomp:{cat:'grammar',t:'the＋比較級, the＋比較級（～すればするほど…）',l:'The＋比較級 ～, the＋比較級 … で「～すればするほど、ますます…」です。The more you practice, the better you become. 比較級は文の先頭に移動しているので、stubborn のような長い語なら the more stubborn と more ごと前に出します。また、この形では be動詞が省かれることもあります。The harder the question (is), the longer it takes.'},
 g_gx_article:{cat:'grammar',t:'数えられる名詞・数えられない名詞',l:'advice（助言）・information（情報）・furniture（家具）などは数えられない名詞で、a を付けたり s を付けたりしません。数えたいときは a piece of advice（1つの助言）のように言います。一方、experience は「経験（全体）」なら数えられませんが、「1つ1つの体験」の意味では数えられ、many experiences のように s が付きます。意味によって数え方が変わる名詞に注意します。'}

 "空欄の後ろに hot that ～ と続いています。「とても熱かったので飲めなかった」は so＋形容詞＋that ～ で表します。that の前に形容詞だけがあるときは so を選びます。","スープがとても熱かったので、私は飲めなかった。","形容詞＋that があれば so。such は後ろに名詞があるときに使います。"),
EG_Q('gx23','g_gx_sothat',2,"This box is ____ heavy for me to carry.",["too","so","enough","such"],
 ["後ろに for me to carry があるので、too＋形容詞＋to ～（…すぎて～できない）の形です。","so は so＋形容詞＋that ～ の形で使い、to とは組みません。","enough は形容詞の後ろに置く言葉で、heavy の前には来ません。","such は後ろに名詞が必要で、heavy だけの前には置きません。"],
 "空欄の後ろが heavy for me to carry と、形容詞の後ろに to＋動詞の原形 が続いています。「重すぎて運べない」は too＋形容詞＋to ～ です。for me は「だれが運ぶのか」を表します。","この箱は重すぎて私には運べない。","形容詞の後ろに to＋原形 があれば too を考えます。not がなくても「できない」意味です。"),
EG_Q('gx24','g_gx_sothat',2,"Ken turned eighteen last month, so now he is ____ to get a driver's license.",["old enough","enough old","too old","so old"],
 ["形容詞＋enough to ～ で「～できるくらい十分…だ」です。18歳になったので免許を取れる年齢になったと意味も合います。","enough は形容詞の後ろに置きます。enough old の語順は誤りです。","too old to ～ は「年をとりすぎて～できない」で、18歳になった話と合いません。","so old は so ～ that の形で使い、後ろに to は続きません。"],
 "18歳になったので「免許を取れる年齢になった」という文です。「～できるほど十分…」は 形容詞＋enough to＋動詞の原形 で表します。enough は形容詞の後ろに置くのがポイントです。","ケンは先月18歳になったので、今は運転免許を取れる年齢だ。","形容詞と enough の語順に注意。old enough（○）、enough old（×）。"),
EG_Q('gx25','g_gx_indq',2,"Do you know where ____?",["she lives","does she live","lives she","is she living"],
 ["Do you know の後ろに疑問文が入ると、疑問詞＋主語＋動詞 の普通の語順になるので she lives です。","does she live は疑問文の語順です。文の中に入ると does は消えます。","lives she は動詞と主語が逆になっていて誤りです。","is she living も疑問文の語順なので、文の中では使えません。"],
 "Where does she live?（彼女はどこに住んでいますか）が Do you know の後ろに入った間接疑問（文の一部になった疑問文）です。このとき does は消え、where she lives と普通の語順になります。","彼女がどこに住んでいるか知っていますか。","Do you know / I wonder の後ろは「疑問詞＋主語＋動詞」の語順です。"),
EG_Q('gx26','g_gx_indq',2,"Could you tell me what time ____?",["the museum opens","does the museum open","opens the museum","is the museum open"],
 ["Could you tell me の後ろは間接疑問なので、what time＋主語＋動詞 の普通の語順 the museum opens です。","does the museum open は疑問文の語順で、文の中では does が消えます。","opens the museum は主語と動詞が逆で誤りです。","is the museum open は疑問文の語順なので、文の中に入れるときは使えません。"],
 "What time does the museum open?（博物館は何時に開きますか）を Could you tell me の後ろに入れると、does が消えて what time the museum opens になります。主語が1つなので opens と s が付きます。","博物館が何時に開くか教えていただけますか。","間接疑問では does が消える分、動詞に s が戻ってくることに注意します。"),
EG_Q('gx27','g_gx_indq',2,"I wonder ____ it will be sunny tomorrow.",["if","what","that","which"],
 ["Will it be sunny?（晴れるか）は Yes・No で答える疑問文なので、文の中に入れるときは if（～かどうか）を使います。","what は「何が・何を」で、後ろの文に足りない部分がないので使えません。","wonder の後ろに that ～ を置いても「～かなあ」という意味にはなりません。「～かどうか」を表すには if か whether が必要です。","which は「どちら」で、選ぶものが文中にないので合いません。"],
 "I wonder（～かなあと思う）の後ろに「明日晴れるかどうか」が入っています。疑問詞のない Yes・No の疑問文を文の中に入れるときは、if か whether（～かどうか）を使います。","明日は晴れるかなあ。","後ろの文が完成していて「～かどうか」の意味なら if / whether です。"),

EG_Q('gx28','g_gx_subj',3,"If only I ____ his phone number now!",["knew","know","will know","have known"],
 ["If only（～でさえあればなあ）は、今の事実と違う願いなので過去形 knew を使います。","know は現在形で、「今は知らない」という事実と違う願いを表せません。","will know は未来の形で、If only の後ろには使いません。","have known は現在完了で、仮定法の形ではありません（過去への願いなら had known）。"],
 "If only ～! は「～でさえあればなあ」という強い願いです。now（今）の事実と違うこと（本当は知らない）を願うので、仮定法（事実と違うことを想像する言い方）の過去形 knew を使います。","今、彼の電話番号を知ってさえいればなあ。","If only / I wish の後ろは、今の願いなら過去形、過去への願いなら had＋過去分詞。"),
EG_Q('gx29','g_gx_subj',3,"She looked at me as if she ____ a ghost.",["had seen","has seen","sees","will see"],
 ["見つめた（looked）時点より前に「幽霊を見たかのように」なので、as if＋過去完了 had seen です。","has seen は現在完了で、過去の話と時がずれ、仮定法の形にもなりません。","sees は現在形で、過去の話と合いません。","will see は未来の形で、as if の後ろの想像に合いません。"],
 "as if は「まるで～かのように」です。本当は幽霊を見ていないので仮定法を使い、見つめた時点よりさらに前のことなので過去完了（had＋過去分詞）にします。","彼女はまるで幽霊でも見たかのように私を見た。","as if の後ろは、時を1つ過去にずらします。それより前のことなら had＋過去分詞。"),
EG_Q('gx30','g_gx_subj',3,"It's already eleven. It's time you ____ to bed.",["went","going","will go","have gone"],
 ["It's time＋主語＋過去形 で「もう～してもいいころだ（まだしていない）」です。過去形 went が入ります。","going だけでは文の動詞になりません。","will go は未来の形で、It's time の後ろには使いません。","have gone は現在完了で、「もう寝ているべき時間なのに、まだ寝ていない」という仮定法の意味になりません。"],
 "It's time＋主語＋～ は「もう～してもいいころだ」です。まだ寝ていないという今の事実と違うことを言うので、仮定法で動詞を過去形にします。go の過去形 went です。","もう11時だよ。そろそろ寝る時間だよ。","It's time の後ろに主語＋動詞が続いたら、動詞は過去形です。"),
EG_Q('gx31','g_gx_relx',3,"I still remember the day ____ I first met her.",["when","which","what","where"],
 ["the day（日）という時を表す名詞を、後ろの完成した文で説明するので関係副詞 when です。","which を使うなら on which のように前置詞が必要です。I first met her は欠けた部分がない文なので、which だけでは入りません。","what は前に名詞を置かずに使う言葉で、the day の後ろには置けません。","where は場所を表す名詞に使います。the day は時です。"],
 "空欄の前は the day（日）という時を表す名詞、後ろは I first met her と欠けた部分のない文です。時の名詞を完成した文で説明するときは関係副詞（時・場所などの名詞を説明する言葉）の when を使います。","彼女に初めて会った日を、今でも覚えている。","前が時の名詞で、後ろの文が完成していれば when です。"),
EG_Q('gx32','g_gx_relx',3,"This is ____ I solved the problem.",["how","the way how","what","which"],
 ["how は「～する方法」で、This is how ～ は「こうやって～した」です。","the way と how は一緒に使いません。the way か how のどちらか片方にします。","what は「～するもの・こと」で、後ろの文 I solved the problem は欠けた部分がないので使えません。","which は前に名詞が必要で、ここには説明される名詞がありません。"],
 "後ろの I solved the problem は欠けた部分のない完成した文です。「私がその問題を解いた方法」は how ～ で表します。the way how という組み合わせは使わない点に注意します。","こうやって私はその問題を解いた。","「方法」を表すのは how か the way の片方だけ。両方並べたら誤りです。"),
EG_Q('gx33','g_gx_relx',3,"He said he was sick, ____ was not true.",["which","that","what","it"],
 ["カンマの後ろで「そしてそれは～」と前の文全体（病気だと言ったこと）を受けるのは , which です。","that はカンマの後ろでは使えません。","what は前に説明する内容を置かずに使う言葉で、カンマの後ろで前の文を受けることはできません。","it を入れると2つの文をカンマだけでつなぐことになり、文の形として誤りです。"],
 "「彼は病気だと言った」という前の文全体を受けて「しかしそれは本当ではなかった」と付け加えています。カンマの後ろで前の文の内容を受けるのは , which（関係代名詞の非制限用法：カンマを付けて補足する使い方）です。","彼は病気だと言ったが、それは本当ではなかった。","カンマの後ろで前の文全体を受けるのは which。that は使えません。"),
EG_Q('gx34','g_gx_relx',3,"My uncle, ____ lives in Hokkaido, sent us some potatoes.",["who","that","which","whom"],
 ["My uncle（人）をカンマを付けて補足し、後ろに動詞 lives が続くので who です。","that はカンマの後ろでは使えません。","which は物や動物に使います。my uncle は人です。","whom は「～を・～に」の役割で使います。後ろに主語がなく lives が続くので、主語になる who が必要です。"],
 "My uncle（おじ）は人で、カンマで区切って「北海道に住んでいる」と補足しています。後ろは lives（動詞）から始まるので、主語の役割をする who を使います。カンマの後ろでは that が使えない点も大切です。","北海道に住んでいるおじが、私たちにジャガイモを送ってくれた。","カンマ＋関係詞 では that は使いません。人なら who、物なら which です。"),
EG_Q('gx35','g_gx_emph',3,"It was in this park ____ I lost my key.",["that","where","which","what"],
 ["It was＋in this park＋that ～ は強調構文で、「鍵をなくしたのはこの公園でだ」と場所を強調しています。","in this park にすでに in があるので、さらに場所の where を置くと重なってしまいます。","which は前に名詞が必要です。in this park は前置詞から始まるまとまりなので、which で受けられません。","what は「～すること・もの」で、It was ～ の強調構文には使いません。"],
 "It was と that を外すと I lost my key in this park. という完成した文に戻ります。このように It is（was）～ that … で一部を強調する形を強調構文といいます。強調しているのは in this park（この公園で）です。","私が鍵をなくしたのは、この公園でだった。","It is / was と空欄を外して文が完成すれば、強調構文の that です。"),
EG_Q('gx36','g_gx_emph',3,"It was Mika, not Ken, ____ broke the window.",["who","which","what","whose"],
 ["It was＋Mika＋who ～ で「窓を割ったのはミカだ」と人を強調しています。人のときは that の代わりに who も使えます。","which は物に使う言葉で、Mika（人）を強調するときには使いません。","what は強調構文には使いません。","whose は「だれの」で、後ろに名詞が必要です。broke（動詞）が続くので合いません。"],
 "It was と空欄を外すと Mika broke the window. という文に戻るので強調構文です。強調しているのが Mika（人）なので、that の代わりに who を使うことができます。","窓を割ったのはケンではなくミカだった。","強調構文で強調するのが人なら that か who。物なら that（which）です。"),
EG_Q('gx37','g_gx_soneither',3,"I'm hungry. — So ____ I.",["am","do","have","is"],
 ["相手の文が I'm hungry.（be動詞 am の文）なので、So am I.（私もです）です。","do は一般動詞の文を受けるときに使います。相手の文は be動詞の文です。","have は現在完了などの文を受けるときに使います。","主語が I なので is ではなく am です。"],
 "「私も」と同意するときは So＋（助）動詞＋主語 です。動詞は相手の文に合わせます。I'm hungry. は be動詞（am）の文なので、So am I. になります。","おなかがすいた。― 私もです。","相手の文が be動詞なら be動詞、一般動詞なら do / does / did で受けます。"),
EG_Q('gx38','g_gx_soneither',3,"I didn't like the movie. — ____ did I.",["Neither","So","Either","Too"],
 ["相手の文が didn't like（否定）なので、「私も～ない」は Neither did I. です。","So did I. は肯定の文（I liked ～）に同意するときに使います。","either は I didn't either. のように文の最後に置くもので、先頭に置いて倒置にはしません。","Too は肯定の文の最後に置く言葉で、文の先頭には来ません。"],
 "相手の文は didn't like（好きではなかった）という否定の文です。否定の文に「私も～ない」と同意するときは Neither＋（助）動詞＋主語 にします。過去の一般動詞の文なので did を使います。","その映画は好きじゃなかった。― 私もです。","否定に同意するなら Neither、肯定に同意するなら So。"),
EG_Q('gx39','g_gx_with',3,"He listened to the speech with his arms ____.",["folded","folding","fold","to fold"],
 ["arms（腕）は「組まれる」側なので過去分詞 folded です。with his arms folded で「腕を組んで」です。","folding は「腕が（自分で）組む」となり、意味が合いません。","fold（原形）は with＋名詞 の後ろに置けません。","to fold は「これから組む」で、そのときの様子を表せません。"],
 "with＋名詞＋分詞 で「～が…した状態で」です。腕は自分で組むのではなく「組まれる」側なので、過去分詞（受け身の意味の分詞）の folded を使います。","彼は腕を組んでスピーチを聞いた。","with＋名詞 の後ろは、名詞が「する側」なら ～ing、「される側」なら過去分詞。"),
EG_Q('gx40','g_gx_with',3,"She ran out of the room with tears ____ down her face.",["running","run","ran","to run"],
 ["tears（涙）が「流れ落ちる」という動作をする側なので、現在分詞 running です。","run は過去分詞としても使えますが、「涙が流される」となり意味が合いません。","ran は過去形で、with＋名詞 の後ろには置けません。","to run は「これから流れる」で、そのときの様子を表せません。"],
 "with＋名詞＋分詞 で、部屋を出たときの様子を表しています。涙は自分で「流れ落ちる」側なので、現在分詞（～ing）の running を使います。","彼女は涙を流しながら部屋を飛び出した。","名詞と分詞の間に「が」を入れ、「涙が流れる」と通じれば ～ing です。"),
EG_Q('gx41','g_gx_nomatter',3,"____ happens, I will be on your side.",["Whatever","However","Whenever","Wherever"],
 ["後ろの happens の主語が欠けているので、「何が～しても」の Whatever（＝No matter what）が入ります。","However は「どんなに～でも」で、後ろに形容詞や副詞が必要です。主語にはなれません。","Whenever は「いつ～しても」で、主語になれないので happens の主語が欠けたままになります。","Wherever は「どこで～しても」で、主語になれません。"],
 "空欄の後ろは happens（起こる）だけで、「何が」起こるのかという主語がありません。主語になれて「たとえ何が起きても」の意味になるのは Whatever（＝No matter what）です。","何が起きても、私はあなたの味方です。","後ろの文に主語や目的語が欠けていれば Whatever。欠けていなければ When / Wherever などです。"),
EG_Q('gx42','g_gx_nomatter',3,"No matter how ____, you must finish your homework.",["tired you are","you are tired","tired are you","are you tired"],
 ["No matter how の後ろは、how のすぐ後ろに形容詞、続けて主語＋動詞の普通の語順なので tired you are です。","how と tired を離すことはできません。形容詞は how のすぐ後ろに置きます。","tired are you は疑問文の語順で、この形では使いません。","are you tired は疑問文の語順で、how とも離れてしまっています。"],
 "No matter how（たとえどんなに～でも）は、how＋形容詞 をひとまとまりにして、その後ろに主語＋動詞を普通の語順で置きます。How tired you are と同じ並び方です。","どんなに疲れていても、宿題は終わらせなければいけない。","No matter how / However の後ろは「形容詞＋主語＋動詞」の順です。"),

EG_Q('gx43','g_gx_ifomit',4,"____ I known about the party, I would have gone.",["Had","If","Have","Did"],
 ["If I had known の if を省いて had を前に出した形が Had I known です。","If を使うなら If I had known になります。If I known では had が足りません。","後ろの would have gone と合わせるには過去完了が必要で、have では合いません。","did の後ろは動詞の原形なので、known（過去分詞）は続きません。"],
 "後ろが would have gone（行っただろうに）なので、過去の事実と違うことを想像する仮定法です。本来は If I had known ですが、if を省くと had が前に出て Had I known になります。","パーティーのことを知っていたら、行ったのに。","文頭の空欄の後ろが 主語＋過去分詞 で、後半に would have があれば Had です。"),
EG_Q('gx44','g_gx_ifomit',4,"____ it not for your help, I would still be lost.",["Were","Was","If","Had"],
 ["If it were not for（もし～がなければ）の if を省いて were を前に出した形が Were it not for です。","仮定法の if 省略の形では was ではなく were を使います。","If を使うなら If it were not for になり、If it not for では動詞がありません。","Had を使うなら Had it not been for で been が必要です。また後半の would still be（今のこと）とも時が合いません。"],
 "後半が would still be lost（今も迷っているだろう）なので、今の事実と違う仮定法です。If it were not for ～（もし～がなければ）の if を省くと were が前に出て Were it not for ～ になります。","あなたの助けがなければ、私は今でも途方に暮れているだろう。","Were it not for＝今の話、Had it not been for＝過去の話、と後半の形で見分けます。"),
EG_Q('gx45','g_gx_ifomit',4,"____ you change your mind, just let me know.",["Should","Would","Could","Did"],
 ["If you should change（万一気が変わったら）の if を省いて should を前に出した形が Should you change です。","Would you ～ は「～していただけますか」という依頼で、後ろの just let me know とつながりません。","Could you ～ も依頼の形で、文の前半として「もし～なら」の意味になりません。","Did you change は過去の疑問文で、後ろの命令文とつながりません。"],
 "後ろに just let me know（知らせてね）という命令文があるので、前半は「もし～なら」という条件です。If you should ～（万一～なら）は、if を省くと Should you ～ という形になります。","万一気が変わったら、知らせてね。","文頭の Should＋主語＋原形, の後ろに命令文があれば「万一～なら」です。"),
EG_Q('gx46','g_gx_mandate',4,"The doctor insisted that he ____ smoking.",["stop","stops","to stop","stopping"],
 ["insist（強く求める）の後ろの that 節は、動詞を原形にするので stop です。","that 節の中は、主語が he でも s を付けない原形にします。","that の後ろは主語＋動詞の文なので、to stop は入りません。","stopping だけでは文の動詞になりません。"],
 "insisted that ～（～するよう強く求めた）は要求を表します。要求・提案の that 節の中では、主語が he でも、元の文が過去でも、動詞は原形（should が省かれた形）にします。","医者は彼にたばこをやめるよう強く求めた。","insist / suggest / demand の that 節は「原形」。主語や時制に引っ張られないこと。"),
EG_Q('gx47','g_gx_mandate',4,"She suggested that the trip ____ until next month.",["be postponed","is postponed","postpones","was postponing"],
 ["suggest（提案する）の that 節は原形にします。旅行は「延期される」側なので受け身の原形 be postponed です。","that 節の中は原形にするので is は使いません。","postpones は「（旅行が）延期する」となり、旅行は延期される側なので意味が合いません。","was postponing も「旅行が延期していた」となり、主語と動作の関係が合いません。"],
 "suggested that ～（～しようと提案した）なので、that 節の動詞は原形です。主語 the trip（旅行）は「延期される」側なので受け身にし、原形の be＋過去分詞 で be postponed になります。","彼女は旅行を来月まで延期しようと提案した。","提案の that 節で受け身なら be＋過去分詞。is / was にはしません。"),
EG_Q('gx48','g_gx_front',4,"Only after the storm had passed ____ to leave the house.",["were we allowed","we were allowed","allowed we","did we allowed"],
 ["Only after ～ が文の先頭にあるので、後ろは疑問文の語順 were we allowed になります。","普通の語順です。Only＋時を表す語句が先頭にあるときは語順を入れかえます。","be動詞がなく、文の形になりません。","did の後ろは原形なので allowed は続きません。また受け身には be動詞が必要です。"],
 "Only after ～（～して初めて）が文の先頭に出ているので、強調のための倒置が起こり、後ろは疑問文の語順になります。普通の文 We were allowed to leave ～ の were を前に出して were we allowed です。","嵐が過ぎた後になって初めて、私たちは家を出ることを許された。","Only＋時・条件の語句が文頭なら、カンマのない次の部分は疑問文の語順です。"),
EG_Q('gx49','g_gx_front',4,"Little ____ that his life was about to change.",["did he know","he knew","he did know","knew he"],
 ["Little（少しも～ない）が文の先頭にあるので疑問文の語順にします。一般動詞 know の過去の文なので did he know です。","普通の語順です。Little が先頭のときは語順を入れかえます。","he did know は強調の形で、疑問文の語順になっていません。","一般動詞の文は動詞そのものを前に出さず、did を前に出します。"],
 "Little（少しも～ない）という否定の意味の言葉が文頭にあるので、後ろは疑問文の語順になります。He knew little ～ の一般動詞 knew は、did＋原形 know に分けて did he know とします。","自分の人生が大きく変わろうとしているとは、彼は少しも知らなかった。","一般動詞の倒置は do / does / did を前に出し、動詞は原形に戻します。"),
EG_Q('gx50','g_gx_nominal',4,"His ____ of the offer surprised everyone.",["refusal","refuse","refused","refuses"],
 ["His の後ろ、of の前で、文の主語になるので名詞 refusal（断ること）です。","refuse は「断る」という動詞で、His の後ろに主語として置けません。","refused は過去形・過去分詞で、名詞の位置に入りません。","refuses は動詞の現在形で、His の後ろの名詞の位置には入りません。"],
 "He refused the offer.（彼は申し出を断った）を名詞でまとめた名詞構文（文の内容を名詞で表す形）です。主語 he は his、動詞 refuse は名詞 refusal、目的語は of the offer になります。","彼がその申し出を断ったことに、みんなが驚いた。","His ＿ of ～ の空欄は名詞。動詞を名詞にした形（-al・-tion・-ment）を探します。"),
EG_Q('gx51','g_gx_nominal',4,"Her late ____ meant that we missed the first part of the show.",["arrival","arrive","arrives","arrived"],
 ["Her late の後ろで、形容詞 late（遅い）が説明する名詞なので arrival（到着）です。","arrive は「到着する」という動詞で、形容詞の後ろには置けません。","arrives は動詞の現在形で、形容詞 late の後ろの名詞の位置には入りません。","arrived は過去形・過去分詞で、名詞の位置に入りません。"],
 "She arrived late.（彼女は遅れて着いた）を名詞でまとめると Her late arrival（彼女の遅い到着）になります。副詞の late は、名詞の前では形容詞の late として働くので、後ろには名詞が必要です。","彼女が遅れて来たので、私たちはショーの最初の部分を見逃した。","Her＋形容詞＋空欄 の空欄は名詞。動詞から作った名詞（arrive → arrival）を探します。"),
EG_Q('gx52','g_gx_thecomp',4,"The older he grew, ____ he became.",["the more stubborn","the more stubbornly","more stubborn","the most stubborn"],
 ["The＋比較級, the＋比較級 の形です。stubborn（頑固な）は長い語なので the more stubborn です。","became（～になった）の後ろには「どんな状態か」を表す形容詞が必要です。stubbornly は副詞なので使えません。","後半にも the が必要です。the＋比較級 の形がそろっていません。","the most は「最も」で、「～するほどますます」の形には使いません。"],
 "前半が The older he grew（年をとるにつれて）と The＋比較級 の形なので、後半も the＋比較級 にして「ますます頑固になった」とします。比較級は文の先頭に移るので、more stubborn をまとめて前に出します。","彼は年をとるほど、ますます頑固になった。","前半が The＋比較級 なら、後半も the＋比較級。more ～ はひとまとまりで前に出します。"),
EG_Q('gx53','g_gx_thecomp',4,"The ____ the question, the longer it takes to answer.",["harder","hardest","more hard","hard"],
 ["The＋比較級 の形なので harder です。後ろの is が省かれて The harder the question (is) になっています。","hardest は「最も」の形で、the＋比較級 の文には使いません。","hard は短い語なので more ではなく er を付けます。","hard は元の形で、「～ほど」の比較の意味になりません。"],
 "後半が the longer（より長く）と the＋比較級 なので、前半も The＋比較級 にします。この形では be動詞が省かれることがあり、The harder the question (is) は「問題が難しいほど」という意味です。","問題が難しいほど、答えるのに時間がかかる。","動詞が見当たらなくても、the＋比較級 が2つあれば be動詞の省略を疑います。"),
EG_Q('gx54','g_gx_article',4,"My teacher gave me a useful piece of ____.",["advice","advices","an advice","advise"],
 ["advice（助言）は数えられない名詞で、a piece of advice（1つの助言）の形で数えます。","advice は数えられない名詞なので s は付きません。","数えられない名詞に an は付きません。また of の後ろに an を重ねることもできません。","advise は「助言する」という動詞で、of の後ろには置けません。"],
 "a piece of ～ は数えられない名詞を「1つ」と数えるときの形です。advice（助言）は数えられない名詞なので、s も a も付けずにそのまま advice を使います。動詞の advise（助言する）と区別します。","先生は私に役に立つ助言をくれた。","a piece of の後ろは数えられない名詞（advice・information など）のそのままの形です。"),
EG_Q('gx55','g_gx_article',4,"He has had many interesting ____ while traveling abroad.",["experiences","experience","an experience","experiencing"],
 ["many（多くの）の後ろなので複数形 experiences です。「1つ1つの体験」の意味では experience は数えられる名詞になります。","many の後ろには数えられる名詞の複数形が必要で、単数の形は使えません。","many の後ろに an は付けません。","experiencing は動名詞で、many や interesting の後ろには置きません。"],
 "experience は「経験（全体）」なら数えられませんが、「旅先でのいろいろな体験」のように1つ1つの出来事を指すときは数えられる名詞です。many＋数えられる名詞の複数形 なので experiences になります。","彼は海外旅行中に、たくさんのおもしろい体験をしてきた。","many / few の後ろは複数形。意味によって数えられるようになる名詞に注意します。")
);

Object.assign(EG_KN, {
 r_rb_not:{cat:'reading',t:'NOT問題（本文に「ない」ものを選ぶ）',l:'What is NOT mentioned ～?（～として書かれていないものは？）や What is NOT true ～?（正しくないものは？）の質問は、4つの選択肢のうち3つが本文に「ある」問題です。答えを1つ探すのではなく、選択肢を1つずつ本文と照らし合わせて、見つかったものを消していきます。本文では、例えば Topics include A, B, and C. のように3つが1文にまとめて並ぶことが多いので、その並びを探すと早く解けます。選択肢は本文の言葉を言いかえていることが多く（managing cash flow → お金の出入りを管理する）、言葉が違うだけで「書かれていない」と決めつけないことが大切です。'},
 r_rb_infer:{cat:'reading',t:'推測問題（suggested / implied / most likely）',l:'What is suggested about ～?（～について何が分かりますか）や What will ～ most likely do next?（次に何をする可能性が高いですか）の質問は、本文にそのままの答えは書かれていません。でも、本文の1文から「ここまでは確実に言える」ことを選ぶ問題で、想像をふくらませる問題ではありません。例えば Loyalty discount（お得意様割引）とあれば「前にも買ったことがある」と言えます。選択肢を選んだら、それを支える本文の1文を指させるかを確かめます。指させない選択肢は、どんなにありそうでも不正解です。'},
 r_rb_vocab:{cat:'reading',t:'文中の単語の意味（closest in meaning to）',l:'The word "address" in the e-mail is closest in meaning to ～ の質問は、その単語の辞書の意味ではなく、その文の中での意味を聞いています。address は「住所」が有名ですが、address the problem なら「問題に取り組む」です。解くときは、その単語を消して選択肢を1つずつ当てはめ、文の意味が通るものを選びます。よく知っている意味の選択肢（address → write on）は、わざと置かれたひっかけであることが多いので注意します。'},
 r_rb_intent:{cat:'reading',t:'チャットの発言の意図をつかむ',l:'At 10:09 a.m., what does Mr. Patel most likely mean when he writes, "Fair enough"? のような質問は、短い一言がその場面で何を言いたいのかを聞いています。Fair enough（それならいいでしょう）、Don\'t bother（それには及びません）のような短い表現は、文字通りの意味だけでは決められません。必ずその発言の直前の相手の発言と、直後のやりとりを読みます。直前の発言への「返事」として何を表しているか、直後の行動とつじつまが合うかで答えを決めます。'}
});

EG_Q('rb3','r_rb_vocab',3,"The word \"address\" in the e-mail is closest in meaning to",["deal with","write on","speak to","send to"],

EG_Q('rb9','r_rb_infer',3,"What is implied about some applicants?",["They will not hear back from the hotel.","They will be interviewed by phone.","They must speak two languages.","They can apply after April 30."],
 ["面接に選ばれた人だけに連絡がある（Only ～ will be contacted）ので、選ばれなかった人には連絡がありません。","面接はホテルで行われる（at the hotel）とあります。","2つ目の言語は a plus but not essential（あれば有利だが必須ではない）です。","応募の締め切りは4月30日です。"],
 "Only candidates selected for an interview will be contacted. は「面接に選ばれた候補者にだけ連絡します」。裏を返すと、選ばれなかった応募者には連絡が来ない、ということになります。implied（それとなく示されている）の質問では、このように裏側の意味を読み取ります。","一部の応募者について何が示唆されていますか？","Only ～（～だけ）の文は、「それ以外はそうではない」という裏の意味を読み取る問題によく使われます。",
 "Front Desk Supervisor, Seabrook Harbor Hotel. Seabrook Harbor Hotel, a 120-room hotel near the city waterfront, is looking for a full-time Front Desk Supervisor. The successful candidate will train new front desk staff, create weekly work schedules, and handle guest complaints. Applicants must have at least two years of experience in hotel reception and be able to work on weekends. Knowledge of a second language is a plus but not essential. We offer a competitive salary, free meals during shifts, and a staff discount at our partner hotels. To apply, send a cover letter and resume to hr@example.com by April 30. Only candidates selected for an interview will be contacted. Interviews will be held at the hotel during the first week of May.","Only candidates selected for an interview will be contacted."),
EG_Q('rb10','r_purpose',2,"What is the purpose of the memo?",["To explain a new way to submit expense reports","To announce an increase in salaries","To ask employees to travel less for work","To introduce a new member of the finance team"],
 ["10月1日から、経費報告を紙ではなく新しいオンラインのシステムで出すことを説明しています。","給料は支払いのタイミングの話に出るだけで、上がるとは書かれていません。","出張を減らすようには頼んでいません。","新しい社員の紹介はありません。"],
 "memo（社内連絡）の目的は、最初の文に書かれることが多いです。Starting October 1（10月1日から）、経費報告（expense report）は紙の用紙ではなく ExpensePoint というオンラインシステムで提出する、と新しい決まりを伝えています。","この社内連絡の目的は何ですか？","社内連絡の目的は、最初の文の Starting ～ / From ～（～から）で始まる「変更点」に注目します。",
 "To: All Employees. From: Priya Nair, Finance Department. Subject: Changes to Expense Reports. Starting October 1, all expense reports must be submitted through our new online system, ExpensePoint, instead of on paper forms. Receipts should be photographed with your phone and uploaded with each report. Reports must be submitted within 30 days of the purchase; reports received after that will not be reimbursed. Payments will be made to your bank account with your monthly salary. The finance team will hold two 30-minute training sessions on how to use ExpensePoint on September 20 and September 27 in Meeting Room B. Attendance is optional, but it is strongly recommended for anyone who travels for work. Paper forms will still be accepted until September 30.","Starting October 1, all expense reports must be submitted through our new online system, ExpensePoint, instead of on paper forms."),
EG_Q('rb11','r_detail',3,"What will happen to a report submitted 40 days after a purchase?",["It will not be paid.","It will be paid with the next salary.","It must be sent on a paper form.","It will be checked at a training session."],
 ["30日を過ぎて届いた報告は払い戻されない（will not be reimbursed）とあります。","給料と一緒に支払われるのは、期限内に出した報告だけです。","紙の用紙は9月30日まで受け付けるという話で、期限を過ぎた報告とは関係ありません。","研修はシステムの使い方を学ぶためのもので、報告を確認する場ではありません。"],
 "within 30 days は「30日以内に」。40日後は期限を過ぎているので、after that（その後）に当たります。reimburse は「（立て替えたお金を）払い戻す」です。","購入から40日後に提出された報告はどうなりますか？","日数の質問は、within ～（～以内）の範囲に入るかどうかを確かめます。",
 "To: All Employees. From: Priya Nair, Finance Department. Subject: Changes to Expense Reports. Starting October 1, all expense reports must be submitted through our new online system, ExpensePoint, instead of on paper forms. Receipts should be photographed with your phone and uploaded with each report. Reports must be submitted within 30 days of the purchase; reports received after that will not be reimbursed. Payments will be made to your bank account with your monthly salary. The finance team will hold two 30-minute training sessions on how to use ExpensePoint on September 20 and September 27 in Meeting Room B. Attendance is optional, but it is strongly recommended for anyone who travels for work. Paper forms will still be accepted until September 30.","Reports must be submitted within 30 days of the purchase; reports received after that will not be reimbursed."),
EG_Q('rb12','r_rb_vocab',2,"The word \"optional\" in the memo is closest in meaning to",["not required","very popular","free of charge","held online"],
 ["optional は「任意の・自由に選べる」で、not required（必須ではない）と同じです。","人気があるという意味はありません。","「無料の」という意味ではありません。研修が無料かどうかは書かれていません。","研修は Meeting Room B で行われるので、オンラインではありません。"],
 "optional は option（選択肢）の形容詞（名詞を説明する言葉）で、「参加するかどうかを自分で選べる」という意味です。直後の but it is strongly recommended（でも強くすすめます）とも合います。","社内連絡の中の optional という単語に最も意味が近いのはどれですか？","知らない単語は、but の前後の「反対の関係」から意味を推測できます（自由だけれど、強くすすめる）。",
 "To: All Employees. From: Priya Nair, Finance Department. Subject: Changes to Expense Reports. Starting October 1, all expense reports must be submitted through our new online system, ExpensePoint, instead of on paper forms. Receipts should be photographed with your phone and uploaded with each report. Reports must be submitted within 30 days of the purchase; reports received after that will not be reimbursed. Payments will be made to your bank account with your monthly salary. The finance team will hold two 30-minute training sessions on how to use ExpensePoint on September 20 and September 27 in Meeting Room B. Attendance is optional, but it is strongly recommended for anyone who travels for work. Paper forms will still be accepted until September 30.","Attendance is optional, but it is strongly recommended for anyone who travels for work."),
EG_Q('rb13','r_purpose',2,"What is the article mainly about?",["A bakery's plan to expand","A new shopping center in Mapleton","Rising prices of flour and butter","Changes to train services at Mapleton Central Station"],
 ["パン屋が今年の秋に新しい店を2つ開く、という話が記事の中心です。","ショッピングセンターは新しい店の場所として出てくるだけです。","小麦粉とバターの値上がりは最後に少し触れているだけです。","駅は新しい店の場所で、電車の運行の話ではありません。"],
 "記事の主な内容は、最初の文に書かれることがほとんどです。will open two new locations（新しい店舗を2つ開く）を、選択肢では expand（事業を広げる）と1語で言いかえています。","この記事は主に何についてですか？","記事の主題は、最初の文の主語と動詞をつかみ、それをまとめた選択肢を選びます。一部分だけの話は不正解です。",
 "MAPLETON (June 3) - Hartley's Bakery, which opened its first shop on Mapleton's Main Street eight years ago, will open two new locations this fall. One will be in the Riverside Shopping Center, and the other will be inside Mapleton Central Station. Owner Rosa Hartley said that the company's online orders have tripled over the past two years. \"Many of our online customers live outside the downtown area, so we wanted to be closer to them,\" she explained. The station shop will focus on coffee and quick breakfast items for commuters, while the Riverside shop will offer the full menu, including the cakes that made the bakery famous. To staff the new shops, Hartley's plans to hire about 25 workers. The company will hold a hiring event at its Main Street shop on July 12. Ms. Hartley added that the bakery has no plans to raise prices this year despite higher costs for flour and butter.","Hartley's Bakery, which opened its first shop on Mapleton's Main Street eight years ago, will open two new locations this fall."),
EG_Q('rb14','r_reason',3,"Why did Hartley's Bakery decide to open new shops?",["To be nearer to customers who order online","Because its Main Street shop is too small","Because it has raised its prices","Because a train company asked it to"],
 ["オンラインの客の多くが中心街の外に住んでいるので、近くに行きたかった、と店主が説明しています。","本店が狭いという話はありません。","今年は値上げをする予定はない（no plans to raise prices）とあります。","鉄道会社に頼まれたとは書かれていません。"],
 "理由は so（だから）の前に書かれています。オンラインの客が中心街の外に住んでいる → so → 客の近くに行きたかった、という流れです。closer to them を、選択肢では nearer to customers と言いかえています。","ハートリーズ・ベーカリーはなぜ新しい店を開くことに決めたのですか？","Why の質問は because の後ろだけでなく、so の前にも理由があることを覚えておきます。",
 "MAPLETON (June 3) - Hartley's Bakery, which opened its first shop on Mapleton's Main Street eight years ago, will open two new locations this fall. One will be in the Riverside Shopping Center, and the other will be inside Mapleton Central Station. Owner Rosa Hartley said that the company's online orders have tripled over the past two years. \"Many of our online customers live outside the downtown area, so we wanted to be closer to them,\" she explained. The station shop will focus on coffee and quick breakfast items for commuters, while the Riverside shop will offer the full menu, including the cakes that made the bakery famous. To staff the new shops, Hartley's plans to hire about 25 workers. The company will hold a hiring event at its Main Street shop on July 12. Ms. Hartley added that the bakery has no plans to raise prices this year despite higher costs for flour and butter.","\"Many of our online customers live outside the downtown area, so we wanted to be closer to them,\" she explained."),
EG_Q('rb15','r_rb_infer',4,"What is suggested about the Riverside shop?",["It will sell more kinds of products than the station shop.","It will open before the station shop.","It will hold a hiring event on July 12.","It will be the company's first shop."],
 ["駅の店はコーヒーと簡単な朝食が中心、リバーサイドの店は全メニューなので、品数が多いと言えます。","2つの店のどちらが先に開くかは書かれていません。","採用イベントを開くのは Main Street の店です。","最初の店は8年前に Main Street に開いた店です。"],
 "while は「一方で」と2つを比べる言葉です。駅の店は focus on coffee and quick breakfast items（コーヒーと簡単な朝食に絞る）、リバーサイドの店は the full menu（全メニュー）なので、リバーサイドの店のほうが多くの種類を売ると推測できます。","リバーサイドの店について何が示唆されていますか？","2つを比べる while / whereas の文は、推測問題の根拠になりやすいので、左右の違いを整理して読みます。",
 "MAPLETON (June 3) - Hartley's Bakery, which opened its first shop on Mapleton's Main Street eight years ago, will open two new locations this fall. One will be in the Riverside Shopping Center, and the other will be inside Mapleton Central Station. Owner Rosa Hartley said that the company's online orders have tripled over the past two years. \"Many of our online customers live outside the downtown area, so we wanted to be closer to them,\" she explained. The station shop will focus on coffee and quick breakfast items for commuters, while the Riverside shop will offer the full menu, including the cakes that made the bakery famous. To staff the new shops, Hartley's plans to hire about 25 workers. The company will hold a hiring event at its Main Street shop on July 12. Ms. Hartley added that the bakery has no plans to raise prices this year despite higher costs for flour and butter.","The station shop will focus on coffee and quick breakfast items for commuters, while the Riverside shop will offer the full menu, including the cakes that made the bakery famous."),
EG_Q('rb16','r_detail',2,"What must participants do to attend Mr. Haddad's workshop?",["Sign up at the registration desk","Pay an extra fee","Bring their own display materials","Attend the morning panel first"],
 ["定員が30人なので、受付で申し込むように書かれています。","追加の料金の話は出ていません。","展示の材料を持ってくるようには書かれていません。","午前のパネル討論に先に出る必要はありません。"],
 "ハダッドさんのワークショップは 11:15 の行にあります。その直後の文に Space is limited to 30 people（定員30人）、so please sign up at the registration desk（だから受付で申し込んでください）とあります。","ハダッドさんのワークショップに参加するには、参加者は何をしなければなりませんか？","予定表の質問は、まず人の名前で行を探し、その行のすぐ後の注意書きまで読みます。",
 "Northwind Retail Forum, Day 2 Program (Thursday, November 6). 9:00-9:45 Opening Talk: Shopping in 2030, Lena Brooks, Brooks Market Research (Hall A). 10:00-11:00 Panel: Building Customer Loyalty, three store managers share their ideas (Hall A). 11:15-12:15 Workshop: Better Shop Displays on a Small Budget, Omar Haddad (Room 3). Space is limited to 30 people, so please sign up at the registration desk. 12:15-1:30 Lunch (Garden Terrace). 1:30-2:30 Workshop: Using Social Media to Attract Shoppers, Kei Tanaka (Room 3). 2:45-3:30 Closing Remarks, Forum Director Sam Ortiz (Hall A). Note: Ms. Brooks's talk was originally scheduled for Day 1 but has been moved because of a travel delay.","Space is limited to 30 people, so please sign up at the registration desk."),
EG_Q('rb17','r_rb_infer',3,"What is suggested about Ms. Brooks?",["She was unable to arrive in time for Day 1.","She will lead a workshop in Room 3.","She manages a store.","She will give the closing remarks."],
 ["旅の遅れ（travel delay）で講演が1日目から移ったので、1日目に間に合わなかったと考えられます。","Room 3 のワークショップはハダッドさんとタナカさんです。","店長として話すのはパネル討論の3人で、ブルックスさんは調査会社の人です。","閉会のあいさつはオルティスさんです。"],
 "最後の Note（注意）に、講演は originally scheduled for Day 1（もともと1日目の予定だった）が、because of a travel delay（移動の遅れのため）変更されたとあります。ここから「1日目に到着できなかった」と推測できます。","ブルックスさんについて何が示唆されていますか？","予定表の Note（注）や *印の文は、推測問題の答えの根拠になりやすいので必ず読みます。",
 "Northwind Retail Forum, Day 2 Program (Thursday, November 6). 9:00-9:45 Opening Talk: Shopping in 2030, Lena Brooks, Brooks Market Research (Hall A). 10:00-11:00 Panel: Building Customer Loyalty, three store managers share their ideas (Hall A). 11:15-12:15 Workshop: Better Shop Displays on a Small Budget, Omar Haddad (Room 3). Space is limited to 30 people, so please sign up at the registration desk. 12:15-1:30 Lunch (Garden Terrace). 1:30-2:30 Workshop: Using Social Media to Attract Shoppers, Kei Tanaka (Room 3). 2:45-3:30 Closing Remarks, Forum Director Sam Ortiz (Hall A). Note: Ms. Brooks's talk was originally scheduled for Day 1 but has been moved because of a travel delay.","Note: Ms. Brooks's talk was originally scheduled for Day 1 but has been moved because of a travel delay."),
EG_Q('rb18','r_rb_intent',3,"At 8:47 a.m., what does Mr. Carter most likely mean when he writes, \"Check your inbox in two minutes\"?",["He will e-mail the file soon.","He will arrive at the office soon.","He wants Ms. Mori to read an e-mail from the clients.","He has already sent the laptop to the office."],
 ["直前に「ファイルを送ってくれる？」と頼まれ、「2分後に受信箱を見て」と答えているので、すぐにメールで送るという意味です。","電車は止まったままで、すぐ着くとは言っていません。","客からのメールの話は出ていません。","ノートパソコンは自分のかばんの中にあります。"],
 "inbox は「（メールの）受信箱」です。直前にモリさんが Can you send me the presentation file?（発表のファイルを送ってくれますか）と頼んでいるので、その返事として「すぐにメールで送ります」という意味になります。直後の Got it.（受け取りました）とも合います。","午前8時47分に、カーターさんが「2分後に受信箱を見て」と書いているのは、どういう意味だと考えられますか？","発言の意図は、すぐ前の相手の頼みごとや質問への「返事」として読みます。",
 "Aiko Mori (8:41 a.m.): Hi Ben, are you already at the office? Ben Carter (8:43 a.m.): Not yet. My train is stopped between stations. They say it's a signal problem. Aiko Mori (8:44 a.m.): Oh no. The Fenwick clients are coming at 9:30 for the product demo. Ben Carter (8:45 a.m.): I know. The demo laptop is in my bag. Aiko Mori (8:46 a.m.): Can you send me the presentation file? I could start with the slides, and you could join for the demo part. Ben Carter (8:47 a.m.): Good idea. Check your inbox in two minutes. Aiko Mori (8:52 a.m.): Got it. I'll set up the meeting room. Ben Carter (8:53 a.m.): Thanks. I'll text you when the train starts moving.","Can you send me the presentation file?"),
EG_Q('rb19','r_reason',2,"Why is Mr. Carter late?",["His train stopped because of a technical problem.","He forgot the demo laptop at home.","He had a meeting with the Fenwick clients.","He missed his train."],
 ["電車が駅と駅の間で止まっていて、原因は信号の故障（signal problem）だと書かれています。","デモ用のノートパソコンはかばんの中にあります。","フェンウィックの客が来るのは9時半で、まだ会っていません。","電車には乗っていて、その電車が止まっています。"],
 "My train is stopped between stations.（電車が駅の間で止まっている）の次の文に、They say it's a signal problem.（信号のトラブルだそうです）と理由があります。signal problem を、選択肢では a technical problem（技術的な問題）とまとめて言いかえています。","カーターさんはなぜ遅れているのですか？","チャットでは理由が because を使わずに、次の短い文で説明されることが多いです。",
 "Aiko Mori (8:41 a.m.): Hi Ben, are you already at the office? Ben Carter (8:43 a.m.): Not yet. My train is stopped between stations. They say it's a signal problem. Aiko Mori (8:44 a.m.): Oh no. The Fenwick clients are coming at 9:30 for the product demo. Ben Carter (8:45 a.m.): I know. The demo laptop is in my bag. Aiko Mori (8:46 a.m.): Can you send me the presentation file? I could start with the slides, and you could join for the demo part. Ben Carter (8:47 a.m.): Good idea. Check your inbox in two minutes. Aiko Mori (8:52 a.m.): Got it. I'll set up the meeting room. Ben Carter (8:53 a.m.): Thanks. I'll text you when the train starts moving.","They say it's a signal problem."),
